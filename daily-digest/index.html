<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日早报 & 英语学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
        }

        .card-time {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .history-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #e0e0e0;
        }

        .history-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .history-item {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
        }

        .history-item-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .history-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-link {
            display: inline-block;
            padding: 5px 10px;
            background: white;
            color: #666;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 每日早报 & 英语学习</h1>
            <div class="date">每日推送 | 工作日 8:00 / 8:50</div>
        </div>

        <div class="content">
            <div class="card" onclick="location.href='news/2026-04-07.html'">
                <div class="card-icon">📊</div>
                <div class="card-title">PC行业早报</div>
                <div class="card-desc">PC/AIPC市场动态、零部件价格趋势、AI工具新闻、联想股价及SSC成本分析</div>
                <div class="card-time">每日 8:00 推送</div>
            </div>

            <div class="card" onclick="location.href='english/2026-04-07.html'">
                <div class="card-icon">📚</div>
                <div class="card-title">每日英语学习</div>
                <div class="card-desc">商务英语口语化练习，含英文短文+中文译文+重点词汇+理解练习</div>
                <div class="card-time">每日 8:50 推送 | 预计15分钟</div>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="content history-section">
            <h3 class="history-title">📅 历史记录</h3>
            <div class="history-grid">
                <div class="history-item">
                    <div class="history-item-title">📊 PC行业早报</div>
                    <div class="history-links">
                        <a href="news/2026-04-07.html" class="history-link">4月7日</a>
                        <a href="news/2026-04-06.html" class="history-link">4月6日</a>
                    </div>
                </div>
                <div class="history-item">
                    <div class="history-item-title">📚 英语学习</div>
                    <div class="history-links">
                        <a href="english/2026-04-07.html" class="history-link">4月7日</a>
                        <a href="english/2026-04-06.html" class="history-link">4月6日</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            数据来源：IDC/TrendForce/Gartner/CFM/StockAnalysis | 仅供学习参考
        </div>
    </div>
</body>
</html>
