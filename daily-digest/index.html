<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日早报 & 英语学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
        }

        .card-time {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 每日早报 & 英语学习</h1>
            <div class="date">每日推送 | 工作日 8:00 / 8:50</div>
        </div>

        <div class="content">
            <div class="card" onclick="location.href='news/latest.html'">
                <div class="card-icon">📊</div>
                <div class="card-title">PC行业早报</div>
                <div class="card-desc">PC/AIPC市场动态、零部件价格趋势、AI工具新闻、联想股价及SSC成本分析</div>
                <div class="card-time">每日 8:00 推送</div>
            </div>

            <div class="card" onclick="location.href='english/latest.html'">
                <div class="card-icon">📚</div>
                <div class="card-title">每日英语学习</div>
                <div class="card-desc">商务英语口语化练习，含英文短文+中文译文+重点词汇+理解练习</div>
                <div class="card-time">每日 8:50 推送 | 预计15分钟</div>
            </div>
        </div>

        <div class="footer">
            数据来源：IDC/TrendForce/Gartner/CFM/StockAnalysis | 仅供学习参考
        </div>
    </div>

    <script>
        // 自动跳转到今天的内容
        const today = new Date().toISOString().slice(0, 10);
        const todayPath = `news/${today}.html`;
        // 检查今天的内容是否存在，如果存在则自动跳转
        fetch(todayPath)
            .then(response => {
                if (response.ok) {
                    location.href = todayPath;
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
