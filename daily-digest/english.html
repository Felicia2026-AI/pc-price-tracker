<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月12日星期日';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/12 10:00:00';

        // 今日学习内容 - AI PC与存储涨价超级周期
        const todayContent = {
            english: "The global memory market is experiencing what analysts are calling a 'super-cycle' driven by insatiable AI computing demand. According to TrendForce, DRAM contract prices are projected to surge another 58-63% in Q2 2026, following a staggering 300%+ increase in DDR4 prices since September 2025. This unprecedented rally has forced supply chain managers to rethink procurement strategies, with many companies now securing early contracts to lock in prices before further increases.\n\nFor enterprise buyers, the implications are severe. A typical 1,000-unit PC fleet refresh that cost ¥500,000 in late 2024 now requires approximately ¥1.5 million—a 200% cost increase in just 18 months. Storage components have followed a similar trajectory, with enterprise SSDs now trading at 2.8x their September 2025 levels. Industry insiders suggest that this trend may persist until at least late 2026, as AI infrastructure buildout continues to absorbs available production capacity.\n\nThe competitive landscape is also shifting rapidly. Samsung and SK Hynix have both qualified as HBM4 suppliers for NVIDIA's upcoming Rubin platform, breaking SK Hynix's de facto monopoly in this segment. For component buyers, this diversification could eventually ease HBM allocation pressures, though any meaningful supply relief is unlikely before 2027. In the meantime, strategic early procurement remains the most effective risk mitigation strategy.",
            chinese: "全球存储市场正经历由AI算力需求驱动的"超级周期"。据TrendForce预测，2026年Q2 DRAM合约价将环比再涨58-63%，此前自2025年9月以来DDR4价格已暴涨超300%。这场前所未有的涨价潮迫使供应链管理者重新审视采购策略，许多公司正通过锁定长期合约来规避进一步涨价风险。\n\n对企业采购者而言，影响十分严峻。一个典型1000台PC机群更新项目，2024年末成本约50万元，如今已需约150万元——18个月内成本上涨200%。存储组件走势类似，企业级SSD如今交易价格已达2025年9月的2.8倍。业内人士指出，这一趋势可能持续至2026年末，因为AI基础设施建设仍在持续吸收可用产能。\n\n竞争格局也在快速变化。三星和SK海力士均已通过英伟达即将推出的Rubin平台的HBM4供应商资质认证，打破了SK海力士在这一领域的准垄断地位。对组件采购者而言，这种多元化可能在未来缓解HBM供货压力，但任何有意义的供应缓解都不太可能在2027年前出现。与此同时，战略性早期采购仍是目前最有效的风险缓解策略。",
            vocabulary: [
                {
                    word: "super-cycle",
                    meaning: "超级周期；商品或资产价格在长期上涨后经历的大幅、持续性上涨周期，通常持续数年",
                    example: "The current memory market super-cycle is driven by unprecedented AI infrastructure buildout."
                },
                {
                    word: "early procurement contract",
                    meaning: "早期采购合约；在价格上涨周期中提前锁定价格的采购协议，以规避未来涨价风险",
                    example: "Many companies are now securing early procurement contracts to lock in prices."
                },
                {
                    word: "HBM (High Bandwidth Memory)",
                    meaning: "高带宽内存；专为AI GPU设计的高性能内存类型，具有超高速数据传输能力",
                    example: "SK Hynix has maintained its dominance in HBM supply for NVIDIA GPUs."
                },
                {
                    word: "fleet refresh",
                    meaning: "机群更新；企业批量更换或升级PC、服务器等设备群体的过程",
                    example: "A typical fleet refresh now costs 3x more than 18 months ago due to component inflation."
                },
                {
                    word: "supply allocation",
                    meaning: "供货分配；供应商根据产能和需求对产品供货量进行分配管理的策略",
                    example: "HBM supply allocation remains tight, forcing AI companies to compete for limited capacity."
                }
            ],
            practice: [
                {
                    question: "According to TrendForce, what is the projected DRAM contract price increase in Q2 2026?",
                    options: [
                        "10-15%",
                        "20-30%",
                        "58-63%",
                        "100-120%"
                    ],
                    answer: 2
                },
                {
                    question: "How much has the cost of a typical 1,000-unit PC fleet refresh increased compared to late 2024?",
                    options: [
                        "50% increase",
                        "100% increase (2x)",
                        "200% increase (3x)",
                        "300% increase (4x)"
                    ],
                    answer: 2
                },
                {
                    question: "Which two companies have qualified as HBM4 suppliers for NVIDIA's Rubin platform?",
                    options: [
                        "Samsung and Micron only",
                        "SK Hynix and Micron only",
                        "Samsung and SK Hynix",
                        "Samsung, SK Hynix, and Micron"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
