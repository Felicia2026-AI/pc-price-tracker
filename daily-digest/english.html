<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月18日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/18 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"Following TrendForce's upward revision of Q2 DRAM contract price guidance to 58-63%, we need to urgently reassess our parts cost projection and explore alternative suppliers to mitigate the impact of this unprecedented price surge.\"",
            chinese: "随着TrendForce将Q2 DRAM合约价指引大幅上调至58-63%，我们需要紧急重新评估备件成本预测，并探索替代供应商以减轻这波史无前例的价格上涨冲击。",
            meaning: "upward revision：上调修订。contract price guidance：合约价指引。urgent reassessment：紧急重新评估。alternative suppliers：替代供应商。unprecedented price surge：史无前例的价格飙升。",
            example: "Given the upward revision of NAND contract price guidance, we expedited our alternative supplier qualification to reduce single-source risk."
        };

        // 今日学习内容 - 供应链韧性
        const todayContent = {
            english: "Supply chain resilience has emerged as a critical strategic priority for organizations across all industries, nowhere more so than in the technology sector where component shortages, geopolitical disruptions, and demand volatility create persistent challenges.\n\nThe semiconductor supply chain exemplifies both the importance and complexity of building resilient supply networks. A typical smartphone or laptop contains components sourced from dozens of countries, with critical chips often concentrated in a handful of specialized fabs. This concentration creates vulnerability—a single geopolitical event, natural disaster, or capacity constraint can cascade through the entire supply chain, disrupting production schedules and ballooning costs.\n\nThe DRAM and NAND markets provide a compelling case study in supply chain dynamics. Following years of cyclical oversupply and depressed margins, memory manufacturers undertook aggressive capacity rationalization. Several major fabs were closed or converted to more profitable product lines. When AI demand surged unexpectedly in 2023 and 2024, the industry found itself with insufficient capacity to meet demand. The result was a dramatic price surge—DRAM contract prices rose over 200% from their 2023 lows.\n\nFor organizations like Lenovo's SSC, this volatility creates significant challenges. Spare parts cost management becomes exponentially more complex when component prices can swing 30%, 50%, or even 100% within a single quarter. Budgets become meaningless. Inventory strategies must account for both price risk and supply availability risk. And supplier relationships take on heightened strategic importance.\n\nBuilding supply chain resilience requires a multi-faceted approach. Diversification of supplier sources reduces single-point-of-failure risk. Strategic inventory buffering—sometimes called strategic stock—provides a cushion against supply disruptions. Long-term supplier agreements can secure capacity and price stability during periods of scarcity. And visibility tools enable proactive risk identification and mitigation.\n\nDigital transformation is reshaping how organizations approach supply chain resilience. Artificial intelligence and machine learning can predict demand patterns with greater accuracy, enabling more precise inventory optimization. Blockchain technology offers potential for enhanced traceability and authenticity verification. Internet of Things sensors provide real-time visibility into inventory levels and locations throughout the supply network.\n\nCollaboration across the supply chain ecosystem has become essential. Traditional adversarial supplier relationships are giving way to strategic partnerships where risks and rewards are shared more equitably. Collaborative forecasting, joint capacity planning, and information sharing enable all participants to operate more efficiently and effectively.\n\nSustainability considerations are increasingly integrated into supply chain resilience strategies. ESG (Environmental, Social, and Governance) requirements from customers and regulators demand greater transparency into supply chain practices. Organizations must ensure their suppliers meet environmental and labor standards while maintaining competitive costs and delivery performance.\n\nFor SSC professionals, developing resilience capabilities requires both analytical skills and relationship management expertise. The technical aspects—inventory optimization, demand forecasting, supplier qualification—must be balanced with the softer skills of stakeholder management, negotiation, and strategic thinking.\n\nThe future of supply chain resilience will be shaped by several emerging trends. Regionalization and nearshoring trends are accelerating as organizations seek to reduce geopolitical risk and improve supply chain agility. Circular economy principles are driving greater emphasis on repairability, refurbishment, and recycling. And advanced manufacturing technologies like additive manufacturing may fundamentally reshape the economics of spare parts supply.\n\nOrganizations that successfully build supply chain resilience will enjoy significant competitive advantages. They will be better positioned to serve customers consistently, manage costs predictably, and respond swiftly to market opportunities. For SSC teams, this means developing the capabilities to anticipate disruptions, mitigate their impact, and recover quickly when they occur. The investments in resilience—though they may appear expensive in the short term—will generate substantial returns through avoided costs, enhanced customer satisfaction, and improved strategic positioning.",
            chinese: "供应链韧性已成为各行业组织的关键战略优先事项，在技术领域尤为突出，因为组件短缺、地缘政治动荡和需求波动带来了持续的挑战。\n\n半导体供应链很好地诠释了构建韧性供应网络的重要性和复杂性。一台典型的智能手机或笔记本电脑包含来自数十个国家/地区的组件，而关键芯片通常集中在少数专业晶圆厂。这种集中造成了脆弱性——单一的地缘政治事件、自然灾害或产能限制都可能在整个供应链中产生连锁反应，扰乱生产计划并推高成本。\n\nDRAM和NAND市场提供了供应链动态的典型案例研究。在经历了多年的周期性供过于求和利润低迷后，内存制造商采取了积极的产能优化举措。几家主要晶圆厂被关闭或转换为更有利可图的产品线。当2023年和2024年AI需求意外激增时，行业发现自己产能不足以满足需求。结果是价格大幅飙升——DRAM合约价从2023年低点上涨超过200%。\n\n对于联想SSC这样的组织来说，这种波动带来了巨大挑战。当组件价格可能在单个季度内波动30%、50%甚至100%时，备件成本管理变得异常复杂。预算变得毫无意义。库存策略必须同时考虑价格风险和供应可用性风险。供应商关系也具有更高的战略重要性。\n\n构建供应链韧性需要多方面的方法。供应商来源的多样化降低了单点故障风险。战略库存缓冲——有时称为战略储备——为供应中断提供了缓冲。长期供应商协议可以在供应短缺时期确保产能和价格稳定。可视化工具能够实现主动风险识别和缓解。\n\n数字化转型正在重塑组织处理供应链韧性的方式。人工智能和机器学习可以更准确地预测需求模式，从而实现更精确的库存优化。区块链技术为增强可追溯性和真实性验证提供了潜在可能。物联网传感器在整个供应网络中提供库存水平和位置的实时可见性。\n\n整个供应链生态系统的协作已变得必不可少。传统的对抗性供应商关系正在被战略伙伴关系所取代，风险和回报以更公平的方式分担。协作预测、联合产能规划和信息共享使所有参与者能够更高效、更有效地运作。\n\n可持续发展考量正日益融入供应链韧性战略。客户和监管机构对ESG（环境、社会和治理）的要求需要对供应链实践有更大的透明度。组织必须确保其供应商满足环境和劳工标准，同时保持有竞争力的成本和交付绩效。\n\n对于SSC专业人员来说，开发韧性能力需要分析技能和关系管理专业知识。技术方面——库存优化、需求预测、供应商认证——必须与利益相关者管理、谈判和战略思维等软技能相平衡。\n\n供应链韧性的未来将受到几个新兴趋势的影响。区域化和近岸外包趋势正在加速，因为组织寻求降低地缘政治风险并提高供应链敏捷性。循环经济原则正在推动对可维修性、翻新和回收的更大重视。增材制造等先进制造技术可能从根本上重塑备件供应的经济性。\n\n成功构建供应链韧性的组织将享有显著的竞争优势。它们将能够更好地持续服务客户、可预测地管理成本，并对市场机会做出快速响应。对于SSC团队来说，这意味着开发预测中断、减轻其影响并在发生时快速恢复的能力。尽管在短期内看起来成本很高，但对韧性的投资将通过避免成本、增强客户满意度和改善战略定位产生丰厚回报。",
            vocabulary: [
                {
                    word: "supply chain resilience",
                    meaning: "供应链韧性；供应链应对中断、适应变化并快速恢复的能力",
                    example: "Building supply chain resilience requires diversification, strategic inventory, and strong supplier partnerships."
                },
                {
                    word: "capacity rationalization",
                    meaning: "产能优化；削减或整合过剩产能以提高效率的过程",
                    example: "Following capacity rationalization, several major DRAM fabs were closed, creating supply constraints."
                },
                {
                    word: "strategic inventory",
                    meaning: "战略库存/安全库存；为应对供应中断而持有的额外库存缓冲",
                    example: "Strategic inventory of critical components helped us survive the chip shortage without production stoppages."
                },
                {
                    word: "single-source risk",
                    meaning: "单源风险；过度依赖单一供应商带来的供应中断风险",
                    example: "We diversified our NAND suppliers to reduce single-source risk in our supply chain."
                },
                {
                    word: "near-shoring",
                    meaning: "近岸外包；将供应链转移到更接近目标市场的地区以降低风险",
                    example: "Near-shoring of component production is accelerating as companies seek to reduce geopolitical risk."
                }
            ],
            practice: [
                {
                    question: "What is the primary risk created by concentration of semiconductor manufacturing in a few locations?",
                    options: [
                        "Higher transportation costs",
                        "Single-point-of-failure vulnerability",
                        "Reduced product quality",
                        "Slower innovation cycles"
                    ],
                    answer: 1
                },
                {
                    question: "Why did DRAM prices surge over 200% from their 2023 lows?",
                    options: [
                        "Government price controls were removed",
                        "Aggressive capacity rationalization created undersupply when AI demand surged",
                        "Memory manufacturers colluded to raise prices",
                        "Raw material costs increased significantly"
                    ],
                    answer: 1
                },
                {
                    question: "What is the purpose of 'strategic inventory' in supply chain management?",
                    options: [
                        "To maximize return on inventory investment",
                        "To provide a buffer against supply disruptions",
                        "To reduce transportation costs",
                        "To eliminate the need for supplier relationships"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-18', label: '2026-04-18（今日）'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
