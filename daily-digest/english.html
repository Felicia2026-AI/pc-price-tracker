<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 今日学习内容 - AI大模型与开源生态
        const todayContent = {
            english: "The artificial intelligence landscape is undergoing a seismic shift as major tech players compete for dominance in the foundation model race. OpenAI's highly anticipated GPT-6 is slated for release on April 14, with the company completing pre-training of its 'Spud' model just days before the launch. According to internal sources, the new model promises a 40% performance improvement over its predecessor, native multimodal capabilities spanning text, images, audio and video, and an unprecedented 2 million token context window.\n\nMeanwhile, Google's recent release of Gemma 4 has disrupted the open-source ecosystem with its Apache 2.0 licensing model. Unlike previous restrictive licenses, this new approach allows commercial use without limitations, fundamentally changing how enterprises can leverage advanced AI capabilities. The move signals a strategic pivot toward democratizing AI development while maintaining competitive differentiation through proprietary services.\n\nFor supply chain professionals tracking technology sector dynamics, these developments carry significant implications. AI-capable PCs are projected to surpass 50% market penetration by year-end, driving demand for high-bandwidth memory and advanced storage solutions. The convergence of foundation model capabilities with edge computing devices will reshape procurement strategies across the technology value chain.",
            chinese: "随着主要科技企业在基础模型领域展开激烈竞争，人工智能格局正在经历一场地震般的变革。OpenAI备受期待的GPT-6将于4月14日发布，公司在发布前几天刚刚完成了代号"Spud"模型的预训练。据内部消息，新模型承诺较前代提升40%的性能，原生多模态能力覆盖文本、图像、音频和视频，并配备史无前例的200万Token上下文窗口。\n\n与此同时，谷歌近期发布的Gemma 4以其Apache 2.0许可模式颠覆了开源生态。与以往限制性许可不同，这种新方式允许商业使用无限制，从根本上改变了企业利用先进AI能力的方式。此举标志着向AI开发民主化战略转型的开始，同时通过专有服务保持竞争优势。\n\n对于追踪技术领域动态的供应链专业人士而言，这些发展具有重要意义。具备AI能力的PC预计年底前将突破50%的市场渗透率，推动对高带宽内存和先进存储解决方案的需求。基础模型能力与边缘计算设备的融合将重塑整个技术价值链的采购策略。",
            vocabulary: [
                {
                    word: "seismic shift",
                    meaning: "地震般的变革；指行业内根本性、颠覆性的重大变化",
                    example: "The Gemini 4 release represents a seismic shift in the open-source AI licensing model."
                },
                {
                    word: "foundation model",
                    meaning: "基础模型；指在大规模数据上预训练的大型AI模型，可微调用于多种任务",
                    example: "GPT-6 and Gemini 3 are both examples of state-of-the-art foundation models."
                },
                {
                    word: "pre-training",
                    meaning: "预训练；指在大规模通用数据集上训练AI模型的阶段",
                    example: "OpenAI completed pre-training of the Spud model ahead of the GPT-6 launch."
                },
                {
                    word: "context window",
                    meaning: "上下文窗口；指模型一次能处理的输入/输出文本长度",
                    example: "GPT-6's 2 million token context window enables processing of entire codebases at once."
                },
                {
                    word: "democratizing AI",
                    meaning: "AI民主化；指使AI技术更易获取、降低使用门槛的过程",
                    example: "Apache 2.0 licensing is a key step toward democratizing access to advanced AI."
                }
            ],
            practice: [
                {
                    question: "What makes Google's Gemma 4 release significant for enterprise users?",
                    options: [
                        "It offers better performance than GPT-6",
                        "Apache 2.0 license allows unlimited commercial use",
                        "It is the first open-source AI model ever released",
                        "It requires no computational resources to run"
                    ],
                    answer: 1
                },
                {
                    question: "According to the passage, what is the projected AI PC market penetration by year-end 2026?",
                    options: [
                        "About 35%",
                        "Over 50%",
                        "Approximately 75%",
                        "Less than 20%"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ 正确！</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ 错误，请再试试</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
