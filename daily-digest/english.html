<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月11日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/11 10:00:00';

        // 今日学习内容 - HBM市场竞争与供应链管理
        const todayContent = {
            english: "The HBM4 memory race between Samsung and SK Hynix is reshaping the global AI supply chain. For the first time in years, Samsung Electronics has passed NVIDIA's Production Readiness Assessment (PRA) for its 12-layer HBM4 chips, officially entering the candidate list for NVIDIA's supply chain. Previously, SK Hynix commanded over 95% of NVIDIA's HBM orders, making it the de facto sole supplier of high-bandwidth memory for AI accelerators.\n\nSamsung's breakthrough threatens SK Hynix's dominant position. Industry analysts estimate that SK Hynix currently holds approximately 70% of NVIDIA's HBM4 order book, but this share could decline significantly if Samsung's products pass final qualification tests. The Korean chipmakers are competing intensely on two fronts: manufacturing process technology and chip-to-chip bonding techniques. SK Hynix's Advanced MR-MUF process offers superior thermal management, while Samsung is betting on its vertically integrated supply chain and proprietary fabrication capabilities.\n\nFor enterprise procurement teams in the technology sector, this competition has direct implications. When HBM suppliers compete aggressively for NVIDIA's business, downstream buyers—servers, AI PCs, data centers—may benefit from improved pricing and supply reliability. However, the transition period carries risk: early-stage supply chain instability, potential quality variations, and the need to qualify multiple suppliers simultaneously. A diversified HBM procurement strategy, combining long-term contracts with spot market flexibility, is increasingly becoming a competitive necessity rather than a luxury.",
            chinese: "三星与SK海力士之间的HBM4内存竞赛正在重塑全球AI供应链。多年来首次，三星电子的12层HBM4芯片已通过英伟达的量产准备认证（PRA），正式进入英伟达供应链候选名单。此前，SK海力士占据英伟达HBM订单的95%以上，成为AI加速器高带宽内存的事实上的唯一供应商。\n\n三星的突破威胁着SK海力士的主导地位。行业分析师估计，SK海力士目前约占英伟达HBM4订单的70%，但如果三星产品通过最终资格认证，这一份额可能大幅下降。这两家韩国芯片制造商正在两个领域展开激烈竞争：制造工艺技术和芯片键合技术。SK海力士的Advanced MR-MUF工艺在热管理方面表现更优，而三星则押注于其垂直整合的供应链和自有制造能力。\n\n对于科技行业的企业采购团队而言，这场竞争具有直接影响。当HBM供应商为争夺英伟达业务而激烈竞争时，下游买家——服务器、AI PC、数据中心——可能从更好的定价和供应可靠性中受益。然而，过渡期也伴随着风险：供应链早期不稳定、潜在的质量差异，以及同时认证多个供应商的需求。结合长期合约与现货市场灵活性的多元化HBM采购策略，正日益成为一种竞争必需，而非奢侈品。",
            vocabulary: [
                {
                    word: "supply chain",
                    meaning: "供应链；产品从原材料到最终交付消费者的完整流程网络",
                    example: "Samsung's vertically integrated supply chain gives it an advantage in HBM production."
                },
                {
                    word: "qualification test",
                    meaning: "资格认证测试；供应商产品通过采购方验证的正式评估流程",
                    example: "Samsung's HBM4 chips must pass NVIDIA's qualification tests before mass delivery."
                },
                {
                    word: "order book",
                    meaning: "订单簿；企业已确认但尚未完成的客户订单总额",
                    example: "SK Hynix currently holds approximately 70% of NVIDIA's HBM4 order book."
                },
                {
                    word: "thermal management",
                    meaning: "热管理；在电子设备中控制温度的技术和策略",
                    example: "Advanced MR-MUF process offers superior thermal management for stacked memory chips."
                },
                {
                    word: "diversified procurement",
                    meaning: "多元化采购；从多个供应商获取相同或类似产品以分散风险的策略",
                    example: "A diversified procurement strategy combining long-term contracts with spot market flexibility is essential."
                }
            ],
            practice: [
                {
                    question: "What does Samsung's passage of NVIDIA's PRA for HBM4 chips represent?",
                    options: [
                        "A complete takeover of SK Hynix's market share",
                        "Samsung's official entry into NVIDIA's HBM supply chain candidate list",
                        "The end of competition between Samsung and SK Hynix",
                        "NVIDIA's decision to use Samsung as its sole HBM supplier"
                    ],
                    answer: 1
                },
                {
                    question: "According to the passage, what risk does the HBM supply chain transition period carry?",
                    options: [
                        "Prices will immediately decrease for all buyers",
                        "Supply chain instability, quality variations, and the need to qualify multiple suppliers",
                        "SK Hynix will exit the HBM market entirely",
                        "AI acceleration technology will become obsolete"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11（今日）'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
