<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"With Samsung announcing another 30% DRAM price hike for Q2 on top of Q1's 100% increase, our parts cost will surge over 130% year-over-year. We need to expedite our Q2 order lock-in immediately and explore alternative suppliers for long-term cost optimization.\"",
            chinese: "随着三星宣布Q2 DRAM价格再次上涨30%（在Q1已涨100%的基础上），我们的备件成本将同比上涨超过130%。我们需要立即加快Q2订单锁定，并探索替代供应商以实现长期成本优化。",
            meaning: "price hike：价格上涨。expedite：加快、加速。order lock-in：订单锁定。alternative suppliers：替代供应商。cost optimization：成本优化。",
            example: "Given the unprecedented price hikes, we expedited our order lock-in for Q2 DDR5 inventory to secure pricing before the window closes."
        };

        // 今日学习内容 - 成本管理
        const todayContent = {
            english: "Cost management in spare parts supply chain operations represents one of the most complex challenges facing PC manufacturers and service organizations today. Unlike production parts, where volumes can be predicted with reasonable accuracy and inventory turns are relatively high, spare parts operate under fundamentally different economic conditions that require specialized approaches and frameworks.\n\nThe economic model of spare parts differs from production parts in several critical ways. First, demand for spare parts is inherently lumpy and unpredictable. While a PC manufacturer might produce millions of units of a particular model, the actual failure rate of individual components follows a probability distribution that means some components will fail far more or less frequently than statistical averages suggest. This demand variability makes forecasting extremely challenging.\n\nSecond, spare parts must be exact matches to original specifications. Unlike production where engineering teams can select from multiple component sources, spare parts must precisely match the components originally installed in the product. This constraint limits the ability to substitute lower-cost alternatives and requires maintaining relationships with original component manufacturers or their authorized distributors.\n\nThird, the service level requirements for spare parts are typically very high. When a business customer's ThinkPad fails, they expect the problem to be resolved within hours or days, not weeks. This expectation creates pressure to maintain high inventory levels of slow-moving parts, which ties up working capital and increases holding costs.\n\nFourth, the product lifecycle for PCs is relatively short compared to other industries. A typical ThinkPad model might be actively sold for 18-24 months, but the service lifecycle extends for 5-7 years after the last unit is sold. This creates the long tail problem—organizations must maintain spare parts inventory for products that are no longer being manufactured, sometimes for many years after the original components have been discontinued by suppliers.\n\nGiven these challenges, how do leading organizations approach spare parts cost management? Several strategies have proven effective.\n\nDemand forecasting accuracy is the foundation of effective spare parts management. Advanced statistical models that incorporate factors such as component failure rates, usage patterns, environmental conditions, and historical demand data can significantly improve forecast accuracy. Machine learning algorithms are increasingly being applied to spare parts forecasting, leveraging large datasets to identify patterns that traditional statistical methods might miss.\n\nLifecycle management is critical for managing costs across the product lifecycle. As products age, demand patterns change, and component availability becomes more constrained. Effective lifecycle management involves tracking each part through its lifecycle stages—from introduction through growth, maturity, and eventual decline—and adjusting inventory strategies accordingly. As products enter the decline phase, the focus shifts from inventory optimization to inventory liquidation and risk mitigation.\n\nSupplier relationship management takes on heightened importance in the spare parts context. Long-term agreements with key component suppliers can provide price stability, guaranteed availability, and priority allocation during supply constraints. For discontinued parts, authorized distributors and aftermarket suppliers may provide the only viable sources, making these relationships essential.\n\nStrategic inventory positioning can significantly reduce costs without compromising service levels. Rather than maintaining identical inventory at every service location, organizations can adopt hub-and-spoke models where slower-moving parts are held centrally and expedited to regional locations as needed. This approach reduces total inventory while maintaining acceptable response times for most situations.\n\nReverse logistics and refurbishment programs can recover value from failed components. Rather than disposing of returned parts, refurbishment operations can repair and restore components to original specifications, creating a secondary inventory source at significantly reduced cost compared to new parts. This approach is particularly valuable for high-cost components like motherboards and displays.\n\nTechnology enablers are transforming spare parts cost management. Radio frequency identification (RFID) and Internet of Things (IoT) sensors can provide real-time visibility into inventory levels and locations. Advanced planning systems can optimize inventory across multiple dimensions simultaneously. And blockchain technology is being explored for authenticating component sources and tracking part provenance.\n\nFor organizations like Lenovo's SSC, the implications are clear. Spare parts cost management requires sophisticated approaches that balance service level requirements against cost constraints. The good news is that technology and analytics are providing new tools to address these challenges. The key is to build organizational capabilities in forecasting, supplier management, and technology deployment while maintaining focus on the fundamental economics of spare parts operations.\n\nThe transformation journey typically involves several stages. Initial efforts focus on data quality and visibility—getting accurate information about what parts are where and how they are being used. The next stage involves implementing better forecasting and planning processes. Advanced stages involve deploying advanced analytics and machine learning, optimizing network design, and developing strategic supplier partnerships.\n\nMeasuring success requires a balanced set of metrics. Service level metrics ensure that customers continue to receive acceptable service. Cost metrics track inventory investment, holding costs, and parts costs. Efficiency metrics monitor forecast accuracy, inventory turns, and resource utilization. The optimal balance among these metrics will vary based on organizational strategy and competitive positioning.\n\nThe future of spare parts cost management will be shaped by several emerging trends. Additive manufacturing (3D printing) has the potential to disrupt traditional spare parts economics by enabling on-demand production of discontinued parts. Circular economy approaches will drive greater emphasis on refurbishment and recycling. And artificial intelligence will enable increasingly sophisticated optimization of complex, multi-variable inventory decisions.",
            chinese: "备件供应链运营中的成本管理代表了当今PC制造商和服务组织面临的最复杂挑战之一。与生产零件不同，备件的需求量可以相对准确地预测且库存周转相对较高，而备件则在不同经济条件下运作，需要专门的方法和框架。\n\n备件的经济模型在几个关键方面与生产零件不同。首先，备件需求天生是不稳定和不可预测的。虽然PC制造商可能生产数百万台特定型号的产品，但单个组件的实际故障率遵循概率分布，这意味着某些组件的故障频率将大大高于或低于统计平均值。这种需求可变性使预测变得极具挑战性。\n\n其次，备件必须与原始规格完全匹配。与工程团队可以从多个组件来源中进行选择的生产不同，备件必须与产品最初安装的组件完全匹配。这种限制限制了替换低成本替代品的能力，需要维护与原始组件制造商或其授权分销商的关系。\n\n第三，对备件的服务水平要求通常非常高。当企业客户的ThinkPad出现故障时，他们期望问题在几小时或几天内解决，而不是几周。这种期望给维护高库存的慢速周转备件带来了压力，这占用了营运资金并增加了持有成本。\n\n第四，PC的产品生命周期相对较短。与其他行业相比，典型的ThinkPad型号可能actively销售18-24个月，但服务生命周期延续到最后一款售出后的5-7年。这就产生了长尾问题——组织必须为不再生产的产品维护备件库存，有时在原始组件停止供应后数年仍需维护。\n\n鉴于这些挑战，领先组织如何处理备件成本管理？几种策略已被证明有效。\n\n需求预测准确性是有效备件管理的基础。结合组件故障率、使用模式、环境条件和历史需求数据等因素的高级统计模型可以显著提高预测准确性。机器学习算法正越来越多地应用于备件预测，利用大型数据集识别传统统计方法可能遗漏的模式。\n\n生命周期管理对于跨产品生命周期管理成本至关重要。随着产品老化，需求模式会发生变化，组件可用性也会变得更加受限。有效的生命周期管理涉及跟踪每个零件的生命周期阶段——从引入到增长、成熟和最终衰退——并相应地调整库存策略。当产品进入衰退阶段，重点从库存优化转向库存清算和风险缓解。\n\n供应商关系管理在备件环境中变得尤为重要。与关键组件供应商的长期协议可以提供价格稳定性、保证可用性以及供应紧张时的优先分配。对于停止供应的零件，授权分销商和售后市场供应商可能是唯一的可行来源，使这些关系变得至关重要。\n\n战略性库存配置可以显著降低成本而不影响服务水平。与其在每个服务地点维护相同的库存，组织可以采用中心辐射模式，在中心位置保留较慢周转的零件，并根据需要紧急运送到区域地点。这种方法减少了总库存，同时保持大多数情况下可接受的响应时间。\n\n逆向物流和翻新计划可以从故障组件中回收价值。翻新业务可以修复和恢复组件到原始规格，而不是处理退回的零件，创建secondary库存来源，成本显著低于新零件。这种方法对于主板和显示器等高价组件特别有价值。\n\n技术赋能者正在改变备件成本管理。射频识别（RFID）和物联网（IoT）传感器可以提供库存水平和位置的实时可见性。高级规划系统可以同时优化多维库存。区块链技术正在探索用于验证组件来源和跟踪零件来源。\n\n对于联想SSC这样的组织，含义很明确。备件成本管理需要复杂的方法来平衡服务水平要求与成本约束。好消息是技术和分析正在提供应对这些挑战的新工具。关键是在预测、供应商管理和技术部署方面建立组织能力，同时保持对备件运营基本经济的关注。\n\n转型之旅通常涉及几个阶段。初步工作侧重于数据质量和可见性——获取关于零件在哪里以及如何使用它们准确信息。下一阶段涉及实施更好的预测和规划流程。高级阶段涉及部署高级分析和机器学习、优化网络设计以及开发战略供应商合作伙伴关系。\n\n衡量成功需要一套平衡的指标。服务水平指标确保客户继续获得可接受的服务。成本指标跟踪库存投资、持有成本和零件成本。效率指标监控预测准确性、库存周转和资源利用率。这些指标之间的最佳平衡将因组织策略和竞争定位而异。\n\n备件成本管理的未来将受到几个新兴趋势的影响。增材制造（3D打印）有潜力通过按需生产停止供应的零件来颠覆传统备件经济。循环经济方法将推动更加强调翻新和回收。人工智能将实现对复杂、多变量库存决策的日益复杂的优化。",
            vocabulary: [
                {
                    word: "lumpy demand",
                    meaning: "不稳定需求/脉冲式需求；需求量波动大、难以预测的模式",
                    example: "Lumpy demand for spare parts makes traditional forecasting methods less reliable."
                },
                {
                    word: "long tail",
                    meaning: "长尾；指需求量小但种类繁多的产品或服务，在备件中指大量低销量SKU",
                    example: "Managing the long tail of spare parts inventory is one of our biggest cost challenges."
                },
                {
                    word: "hub-and-spoke model",
                    meaning: "中心辐射模式；一种库存分布策略，中心仓库存放慢速周转零件",
                    example: "We adopted a hub-and-spoke model to reduce total inventory while maintaining service levels."
                },
                {
                    word: "reverse logistics",
                    meaning: "逆向物流；将产品从客户处运回的过程，用于翻新或回收",
                    example: "Our reverse logistics program refurbishes 60% of returned components for resale."
                },
                {
                    word: "additive manufacturing",
                    meaning: "增材制造/3D打印；通过逐层添加材料制造零件的技术",
                    example: "Additive manufacturing could disrupt spare parts economics by enabling on-demand production."
                }
            ],
            practice: [
                {
                    question: "Why is demand forecasting for spare parts particularly challenging compared to production parts?",
                    options: [
                        "Spare parts are more expensive to manufacture",
                        "Spare parts demand is lumpy and unpredictable due to probabilistic failure rates",
                        "Spare parts require more quality testing",
                        "Spare parts have longer supply chains"
                    ],
                    answer: 1
                },
                {
                    question: "What is the 'long tail' problem in spare parts management?",
                    options: [
                        "Having too many suppliers for each part",
                        "Maintaining inventory for products no longer manufactured for many years",
                        "Parts that are too heavy to transport efficiently",
                        "Demand concentrated on only a few popular SKUs"
                    ],
                    answer: 1
                },
                {
                    question: "What is the key advantage of a hub-and-spoke inventory model?",
                    options: [
                        "Faster delivery to all customers simultaneously",
                        "Reduced total inventory while maintaining acceptable service levels",
                        "Elimination of all transportation costs",
                        "Automatic forecasting of spare parts demand"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
