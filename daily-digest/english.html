<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 10:00:00';

        // 今日学习内容 - 英特尔与AMD的AI PC处理器竞争
        const todayContent = {
            english: "The AI PC processor market is witnessing intense competition between Intel and AMD as both companies race to deliver next-generation chips optimized for artificial intelligence workloads. At CES 2026, Intel unveiled its Panther Lake architecture-based Core Ultra 300 series, featuring significant improvements in AI compute performance, power efficiency, and integrated NPU (Neural Processing Unit) capabilities. These processors are specifically designed to handle complex AI tasks locally, reducing reliance on cloud-based services.\n\nNot to be outdone, AMD launched its Ryzen AI 400 series, boasting up to 12 Zen 5 cores and substantially enhanced NPU performance. The new lineup includes multiple tiers: Ryzen AI 9 models for premium devices, Ryzen AI 7 for mainstream systems, and Ryzen AI 5 for entry-level AI PCs. AMD claims a 1000x improvement in AI performance over four generations, positioning its chips as compelling alternatives to Intel's offerings.\n\nFor enterprise procurement teams, this competitive dynamic presents both opportunities and challenges. On one hand, increased competition typically drives innovation and potentially moderates pricing pressures. On the other hand, the rapid pace of AI PC advancement means that devices purchased today may become obsolete faster than traditional PCs. Supply chain managers must balance the benefits of early AI PC adoption against the risks of investing in hardware that could be superseded within 12-18 months. Strategic recommendations include negotiating upgrade protection clauses in volume purchase agreements and maintaining flexibility in deployment timelines.",
            chinese: "AI PC处理器市场正见证英特尔与AMD之间的激烈竞争，两家公司都在竞相推出针对人工智能工作负载优化的下一代芯片。在CES 2026上，英特尔发布了基于Panther Lake架构的酷睿Ultra 300系列，在AI计算性能、能效和集成NPU（神经网络处理器）能力方面均有显著提升。这些处理器专为本地处理复杂AI任务而设计，减少对云服务的依赖。\n\n不甘示弱，AMD推出了Ryzen AI 400系列， boasting最高12个Zen 5核心和大幅增强的NPU性能。新产品线包括多个层级：Ryzen AI 9型号面向高端设备，Ryzen AI 7面向主流系统，Ryzen AI 5面向入门级AI PC。AMD宣称四代产品AI性能提升1000倍，将其芯片定位为英特尔产品的有力替代品。\n\n对企业采购团队而言，这种竞争态势既带来机遇也带来挑战。一方面，竞争加剧通常会推动创新并可能缓解价格压力。另一方面，AI PC的快速进步意味着今天购买的设备可能比传统PC更快过时。供应链管理者必须权衡早期采用AI PC的益处与硬件可能在12-18个月内被取代的风险。战略建议包括在大宗采购协议中协商升级保护条款，并在部署时间表上保持灵活性。",
            vocabulary: [
                {
                    word: "NPU (Neural Processing Unit)",
                    meaning: "神经网络处理器；专为加速AI和机器学习任务设计的专用芯片",
                    example: "Modern AI PCs feature integrated NPUs capable of handling complex neural network computations."
                },
                {
                    word: "Panther Lake",
                    meaning: "英特尔Panther Lake架构；英特尔下一代处理器架构，专为AI PC优化",
                    example: "Intel's Panther Lake architecture delivers significant improvements in AI performance."
                },
                {
                    word: "Zen 5",
                    meaning: "AMD Zen 5架构；AMD最新的CPU核心架构，提供更高性能和能效",
                    example: "AMD's Ryzen AI 400 series features up to 12 Zen 5 cores for maximum performance."
                },
                {
                    word: "upgrade protection clause",
                    meaning: "升级保护条款；采购合同中允许在一定期限内以优惠条件升级设备的条款",
                    example: "Negotiating upgrade protection clauses helps mitigate technology obsolescence risks."
                },
                {
                    word: "deployment timeline",
                    meaning: "部署时间表；设备或系统实施和上线的时间规划",
                    example: "Maintaining flexibility in deployment timelines allows organizations to adapt to rapid technology changes."
                }
            ],
            practice: [
                {
                    question: "What is the name of Intel's new processor architecture unveiled at CES 2026?",
                    options: [
                        "Tiger Lake",
                        "Alder Lake",
                        "Panther Lake",
                        "Meteor Lake"
                    ],
                    answer: 2
                },
                {
                    question: "How many Zen 5 cores does AMD's Ryzen AI 400 series support at maximum?",
                    options: [
                        "8 cores",
                        "10 cores",
                        "12 cores",
                        "16 cores"
                    ],
                    answer: 2
                },
                {
                    question: "What strategic recommendation is given for managing AI PC obsolescence risks?",
                    options: [
                        "Purchase only entry-level devices",
                        "Negotiate upgrade protection clauses in purchase agreements",
                        "Delay all AI PC purchases until 2027",
                        "Buy exclusively from one vendor"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
