<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月29日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/29 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"The lead time on enterprise NVMe SSDs has extended to 26 weeks, and our suppliers are asking us to commit to Q3 volumes now if we want to lock in Q2 pricing. This creates a procurement paradox: we're being asked to commit to future volumes at today's prices, while our own demand signal from the field is showing a potential 8-10% shortfall against the original forecast. The discipline is to distinguish between supply-driven urgency — which is real but not necessarily our emergency — and genuine demand-driven urgency.\"",
            chinese: "企业级NVMe SSD的交货期已延长至26周，供应商要求我们如果想锁定Q2价格，现在就要承诺Q3数量。这创造了一个采购悖论：我们被要求以今天的价格承诺未来的数量，而我们从现场获得的需求信号显示可能比原始预测低8-10%。纪律要求我们区分供应驱动的紧迫性——这是真实的但不一定是我们的紧急情况——与真正的需求驱动的紧迫性。",
            meaning: "lead time：交货期/前置时间。commit to volumes：承诺数量。lock in pricing：锁定价格。procurement paradox：采购悖论。demand signal：需求信号。shortfall：缺口/不足。supply-driven urgency：供应驱动的紧迫性。demand-driven urgency：需求驱动的紧迫性。",
            example: "When our supplier requested Q3 volume commitments to lock in Q2 pricing, we distinguished between their inventory optimization problem and our genuine parts availability requirement before agreeing."
        };

        // 今日学习内容 - 供应驱动紧迫 vs 需求驱动紧迫：采购决策中的界限管理
        const todayContent = {
            english: "The semiconductor supply chain of 2026 presents procurement professionals with a paradox that tests the boundaries of conventional supply chain management wisdom. Enterprise NVMe SSDs carry lead times of 26 weeks. Suppliers are requesting Q3 volume commitments in exchange for locking in Q2 pricing. Meanwhile, internal demand signals are showing potential 8-10% shortfalls against original forecasts. How should a rational procurement organization respond to this environment?\n\nThe key analytical discipline is to distinguish between two fundamentally different types of urgency: supply-driven urgency and demand-driven urgency. Understanding this distinction is critical because each type of urgency demands a different organizational response.\n\nSupply-driven urgency originates from the supplier side of the value chain. It emerges when suppliers face capacity constraints, material shortages, or their own inventory optimization pressures. The supplier's goal is to secure forward commitments that reduce their own risk. When a supplier asks for Q3 volume commitments to lock in Q2 pricing, they are managing their own inventory exposure — reducing the risk that they produce components that customers will not accept.\n\nThis supply-driven urgency is real. The lead times are genuinely extended. The capacity is genuinely constrained. The supplier's request is genuinely driven by their assessment of market conditions. But here is the critical insight: supply-driven urgency is the supplier's problem, not necessarily the procurement organization's emergency.\n\nDemand-driven urgency, by contrast, originates from within the procurement organization's own value chain. It emerges when genuine customer demand, product roadmaps, or service requirements create legitimate needs for specific components within specific timeframes. This urgency is backed by actual consumption plans, validated by customer commitments, or driven by observable market dynamics.\n\nThe danger in an extended lead time environment is that supply-driven urgency can contaminate demand-driven decision-making. The procurement team hears \"lead time is 26 weeks\" and \"suppliers want forward commitments\" and begins to treat these supplier-side factors as if they were demand-side imperatives. The result is that organizations commit to volumes they do not genuinely need, build inventory against forecasts that may not materialize, and allocate working capital to components that will sit in warehouses rather than generate value.\n\nThe discipline requires maintaining a clear analytical separation between these two types of urgency. When evaluating a supplier's request for forward commitments, the procurement team should ask: Is this request driven by our genuine demand requirements, or by the supplier's inventory optimization? If the answer is the latter — and it often is — then the procurement organization should resist the pressure to commit based on supplier-side urgency.\n\nThis does not mean ignoring supplier constraints. It means managing them strategically rather than reactively. If a 26-week lead time creates genuine availability risk for components that are truly needed, the appropriate response is to build buffer stocks sized according to the actual demand uncertainty — not to over-commit to volumes that serve the supplier's risk reduction more than the procurement organization's supply assurance.\n\nThe practical framework involves several analytical steps. First, validate the demand signal independently. Is the 8-10% shortfall real? Is it concentrated in specific product families or spread across the portfolio? Is it a timing issue or a structural change? Second, assess the supply risk independently. What is the probability that the 26-week lead time will slip further? Are there alternative sources? Third, size any buffer inventory according to the validated demand uncertainty — not according to the supplier's desire for forward commitments.\n\nThe organizations that navigate extended lead time environments most effectively are those that maintain this analytical discipline. They resist the gravitational pull of supply-driven urgency. They size inventory based on their own demand forecasts, not supplier's risk preferences. And they treat supplier requests for forward commitments as information about the supply environment, not as imperatives for their own procurement action.\n\nIn the semiconductor supercycle of 2026, this discipline is more important than ever. The pressure from suppliers to commit will be intense. The fear of missing parts will be real. But the organizations that maintain clear thinking about the distinction between supply-driven and demand-driven urgency will emerge with the best balance of supply assurance and working capital efficiency. The winners will be those who managed the paradox, not those who surrendered to it.",
            chinese: "2026年的半导体供应链给采购专业人员带来了一个考验传统供应链管理智慧边界的悖论。企业级NVMe SSD的交货期长达26周。供应商要求以锁定Q2价格为条件承诺Q3数量。与此同时，内部需求信号显示可能比原始预测低8-10%。一个理性的采购组织应该如何应对这种环境？\n\n关键分析纪律是区分两种根本不同的紧迫性：供应驱动的紧迫性和需求驱动的紧迫性。理解这种区别至关重要，因为每种类型的紧迫性都需要不同的组织响应。\n\n供应驱动的紧迫性源于价值链的供应方。当供应商面临产能限制、材料短缺或其自身的库存优化压力时，就会产生这种紧迫性。供应商的目标是确保远期承诺，以降低自身的风险。当供应商要求以锁定Q2价格为条件承诺Q3数量时，他们正在管理自己的库存敞口——降低生产客户不会接受的组件的风险。\n\n这种供应驱动的紧迫性是真实的。交货期确实延长了。产能确实受到限制。供应商的要求确实是由他们对市场状况的评估驱动的。但关键洞察是：供应驱动的紧迫性是供应商的问题，不一定是采购组织的紧急情况。\n\n相比之下，需求驱动的紧迫性源于采购组织自身价值链的内部。当真正的客户需求、产品路线图或服务要求在特定时间范围内产生对特定组件的合理需求时，就会出现这种紧迫性。这种紧迫性得到实际消耗计划的支持，经客户承诺验证，或由可观察到的市场动态驱动。\n\n在交货期延长的环境中，危险在于供应驱动的紧迫性可能污染需求驱动的决策。采购团队听到\"交货期26周\"和\"供应商要求远期承诺\"后，开始将这些供应方因素视为需求方的要务。其结果是组织承诺了并非真正需要的数量，根据可能不会实现的预测建立库存，并将营运资本分配给将在仓库中堆积而非产生价值的组件。\n\n这种纪律要求保持对这两种紧迫性的清晰分析分离。在评估供应商的远期承诺请求时，采购团队应该问：这个请求是由我们真正的需求驱动的，还是由供应商的库存优化驱动的？如果答案是后者——而且通常如此——那么采购组织应该顶住基于供应方紧迫性而承诺的压力。\n\n这并不意味着忽视供应商限制。它意味着战略性而非被动地管理它们。如果26周的交货期对真正需要的组件造成真正的可用性风险，适当的回应是根据实际需求不确定性建立安全库存——而不是过度承诺数量，因为这些数量更多是为了供应商的风险降低，而不是为了采购组织的供应保障。\n\n实用框架涉及几个分析步骤。首先，独立验证需求信号。8-10%的缺口是真实的吗？它集中在特定产品系列还是分散在整个产品组合中？这是时间问题还是结构性问题？其次，独立评估供应风险。26周的交货期进一步延误的概率是多少？是否有替代来源？第三，根据经验证的需求不确定性确定任何安全库存的规模——而不是根据供应商对远期承诺的渴望。\n\n最能驾驭交货期延长环境的组织是那些保持这种分析纪律的组织。它们顶住了供应驱动紧迫性的引力。它们根据自身需求预测而非供应商风险偏好来确定库存规模。它们将供应商的远期承诺请求视为有关供应环境的信息，而非其自身采购行动的指令。\n\n在2026年半导体超级周期中，这种纪律比以往任何时候都更重要。来自供应商承诺的压力将是巨大的。错失零件的恐惧是真实的。但那些对对供应驱动和需求驱动紧迫性之间的区别保持清醒思考的组织，将以最佳平衡的供应保障和营运资本效率脱颖而出。赢家将是那些管理悖论的人，而不是屈服于悖论的人。",
            vocabulary: [
                {
                    word: "supply-driven urgency",
                    meaning: "供应驱动的紧迫性；源于供应商产能/库存压力的紧迫感，通常不是采购组织的真实紧急情况",
                    example: "A supplier requesting forward commitments is expressing supply-driven urgency, which may not align with our actual demand requirements."
                },
                {
                    word: "demand-driven urgency",
                    meaning: "需求驱动的紧迫性；源于内部客户需求、产品路线图或服务要求的真实紧迫需求",
                    example: "A customer order with a hard delivery date creates genuine demand-driven urgency that justifies inventory commitments."
                },
                {
                    word: "forward commitment",
                    meaning: "远期承诺；提前承诺在未来某个时间点购买特定数量的承诺，通常用于锁定供应或价格",
                    example: "Suppliers often request forward commitments to reduce their inventory exposure during tight supply conditions."
                },
                {
                    word: "lead time",
                    meaning: "交货期/前置时间；从下单到交货所需的时间，是评估供应风险的关键参数",
                    example: "With enterprise NVMe SSD lead times extending to 26 weeks, we need to adjust our reorder points accordingly."
                },
                {
                    word: "buffer stock sizing",
                    meaning: "安全库存规模；根据需求不确定性和供应风险确定的缓冲库存量，应基于自身分析而非供应商建议",
                    example: "Buffer stock sizing should reflect our own demand uncertainty, not the supplier's desire for forward commitments."
                }
            ],
            practice: [
                {
                    question: "What is the key distinction between supply-driven urgency and demand-driven urgency?",
                    options: [
                        "Supply-driven urgency is more important because suppliers have better market information",
                        "Supply-driven urgency originates from the supplier side while demand-driven urgency originates from genuine internal requirements",
                        "They are essentially the same thing expressed differently",
                        "Demand-driven urgency is always more urgent than supply-driven urgency"
                    ],
                    answer: 1
                },
                {
                    question: "Why should procurement organizations resist committing to volumes based solely on supplier requests for forward commitments?",
                    options: [
                        "Because suppliers always ask for more than they actually need",
                        "Because supplier requests may be driven by their inventory optimization rather than our genuine needs, and over-committing wastes working capital",
                        "Because it is disrespectful to refuse supplier requests",
                        "Because forward commitments are never in the procurement organization's interest"
                    ],
                    answer: 1
                },
                {
                    question: "According to the article, how should buffer inventory be sized in an extended lead time environment?",
                    options: [
                        "Based on the supplier's request for forward commitments",
                        "Based on the 26-week lead time regardless of actual demand",
                        "Based on validated demand uncertainty and actual supply risk, not supplier pressure",
                        "As large as possible to avoid any availability risk"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-29', label: '2026-04-29（今日）'},
            {date: '2026-04-28', label: '2026-04-28'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
