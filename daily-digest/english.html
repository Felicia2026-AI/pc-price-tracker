<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>

            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月28日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/28 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"When analysts are calling for 280% DRAM price increases and 250% NAND increases, the rational procurement response is not to panic-buy — it is to stress-test your demand forecasts against downside scenarios where parts consumption runs below plan, and ensure that any inventory build is bounded by validated consumption data rather than price anxiety. In a supercycle, the winners are not those who bought the most — they are those who bought most accurately.\"",
            chinese: "当分析师喊出DRAM涨价280%、NAND涨价250%时，明智的采购应对不是恐慌性买入——而是针对消耗低于预期的悲观情景，对需求预测进行压力测试，确保任何库存建立都受控于经过验证的消耗数据，而非价格焦虑。在超级周期中，赢家不是买得最多的——而是买得最准的。",
            meaning: "panic-buy：恐慌性买入/囤货。stress-test：压力测试。downside scenario：悲观情景/下行情景。consumption runs below plan：消耗低于计划。bounded by：受控于/以...为界限。supercycle：超级周期。winners are not those who bought the most：赢家不是买得最多的。",
            example: "When the analyst predicted 280% DRAM price increases, our procurement team decided to stress-test our demand forecasts rather than panic-buy, ensuring our inventory build was bounded by validated consumption data."
        };

        // 今日学习内容 - 存储超级周期：如何不被涨价潮裹挟
        const todayContent = {
            english: "The storage semiconductor supercycle of 2026 has created an unprecedented environment for PC supply chain procurement professionals. Goldman Sachs has dramatically revised its forecasts upward, predicting that DRAM prices could surge as much as 280% in 2026, with NAND Flash prices climbing 250%. TrendForce has simultaneously issued its Q2 forecast showing NAND contract prices rising another 70%-75% quarter-on-quarter, with DRAM contract prices climbing 58%-63%. These are extraordinary numbers by any historical standard.\n\nYet the most sophisticated procurement professionals understand that extreme price forecasts require equally extreme analytical rigor before they translate into procurement action. The fundamental question is not whether prices will rise — the data clearly suggests they will. The question is whether the rise will be uniform across all product categories, whether it will be sustained or temporary, and critically, whether your organization's parts consumption will actually track with the market averages that underpin these forecasts.\n\nThis is where demand-signal discipline becomes non-negotiable. When analysts predict 280% price increases, the intuitive response is to front-load inventory purchases — to buy as much as possible, as quickly as possible, before prices climb further. This intuition is not irrational. It is a well-documented behavioral bias that economists call the \"availability heuristic\" — we over-weight recent dramatic events and under-weight historical base rates. When we see dramatic price increases in the news, we naturally assume that buying more now will save money later.\n\nBut this intuition contains a critical hidden assumption: that your parts consumption will remain stable or grow. If you are buying extra inventory in anticipation of continued price increases, you are implicitly assuming that you will actually use that inventory at some point in the future. If your installed base is declining — if fewer ThinkPads are in the field than projected, if product transitions are happening faster than expected, if enterprise customers are extending refresh cycles — then the extra inventory you bought at \"lower\" prices may simply sit on shelves, incurring holding costs while slowly approaching obsolescence.\n\nThe storage supercycle provides a perfect case study in this dynamic. Yes, DRAM and NAND prices are rising substantially. Yes, the supply-demand dynamics that drive these increases — AI server demand, HBM allocation, capacity constraints — are real and likely to persist. But the question for SSC procurement is not whether storage prices will rise. It is whether the storage parts you are buying will be consumed at the rate you need them to be consumed to justify the inventory you are holding.\n\nThis is why the concept of \"buying most accurately\" matters more than \"buying the most.\" Accurate procurement means that your purchase quantities are tightly calibrated to your validated consumption forecasts, with buffer stocks sized according to supply risk tolerance rather than price speculation. It means accepting that you will not perfectly time the market — that you will buy some parts at higher prices than you might have, and that you will forgo some potential savings from buying ahead. But it also means avoiding the much larger costs of over-procurement: holding costs, obsolescence write-offs, and capital that is locked in inventory instead of generating returns elsewhere.\n\nThe practical discipline involves several concrete steps. First, update your installed base projections to reflect the most current data — not the projections you made six months ago, but today's reality. If enterprise PC refresh cycles have extended, if product transitions are accelerating, if your customer base is shifting toward services rather than hardware purchases, your consumption forecasts must reflect these changes. Second, segment your parts inventory by criticality and supply risk. High-criticality parts with long lead times and single-source suppliers deserve higher buffer stocks than commodity parts with multiple sources and short lead times. Third, establish clear escalation protocols for when actual consumption diverges significantly from forecast. If you are consuming parts 15% below plan for two consecutive quarters, that is a signal to reduce purchase quantities — not to hope that the third quarter will be different.\n\nThe storage supercycle will run its course. Prices will eventually peak, plateau, and likely decline as new capacity comes online and AI infrastructure buildout normalizes. The procurement organizations that will emerge strongest are not those that bought the most during the peak — they are those that maintained analytical discipline throughout, kept their demand forecasts honest, and avoided the behavioral trap of buying based on headlines rather than data. In a supercycle, as in most things in supply chain management, accuracy beats volume.",
            chinese: "2026年的存储半导体超级周期，为PC供应链采购专业人员创造了一个前所未有的环境。高盛大幅上调预测，预计2026年DRAM价格可能飙升280%，NAND Flash价格上涨250%。TrendForce同步发布Q2预测，显示NAND合约价环比再涨70%-75%，DRAM合约价上涨58%-63%。以任何历史标准衡量，这些都是非凡的数字。\n\n然而，最老练的采购专业人员明白，极端价格预测在转化为采购行动之前，需要同样极端的分析严谨性。根本问题不是价格是否会上涨——数据清楚地表明会。问题在于涨幅是否会在所有产品类别中均匀分布，是会持续还是暂时的，关键是，组织的零件消耗是否会实际上与支撑这些预测的市场平均水平一致。\n\n这就是需求信号纪律变得不可或缺的原因。当分析师预测涨价280%时，直觉反应是提前买入库存——尽可能多、尽可能快地买，趁价格进一步上涨之前。这种直觉并非不合理。这是经济学家所称的一种有据可查的行为偏见——\"可得性启发法\"——我们过度加权最近的戏剧性事件，而低估历史基准率。当我们在新闻中看到戏剧性的价格上涨时，自然会假设现在买更多将来会省钱。\n\n但这种直觉包含一个关键的隐藏假设：你的零件消耗将保持稳定或增长。如果你在预期价格持续上涨的情况下购买额外库存，你隐含的假设是你将在某个未来时点实际使用那些库存。如果你的装机基础正在萎缩——如果现场使用的ThinkPad比预期少，如果产品切换速度快于预期，如果企业客户正在延长更新周期——那么你以\"更低\"价格购买的额外库存可能只是堆积在货架上，产生持有成本，同时慢慢走向过时。\n\n存储超级周期提供了一个完美的案例研究。是的，DRAM和NAND价格正在大幅上涨。是的，推动这些上涨的供需动态——AI服务器需求、HBM分配、产能限制——是真实的，可能持续。但SSC采购的问题不是存储价格是否会上涨。而是你购买的存储零件是否会以你需要的速度被消耗，以证明你持有的库存是合理的。\n\n这就是\"买得最准\"比\"买得最多\"更重要的原因。准确的采购意味着你的采购数量与经过验证的消耗预测紧密校准，安全库存根据供应风险承受能力而非价格投机来确定。这意味着接受你不会完美地把握市场时机——你会以比你本可以得到的更高价格购买一些零件，你会放弃一些提前购买带来的潜在节省。但这也意味着避免过度采购的更大成本：持有成本、过时注销，以及被锁定在库存中而非在其他地方产生回报的资本。\n\n实际纪律包括几个具体步骤。首先，更新你的装机基础预测以反映最新数据——不是你六个月前做的预测，而是今天的现实。如果企业PC更新周期延长，如果产品切换加速，如果你的客户群正在转向服务而非硬件购买，你的消耗预测必须反映这些变化。其次，按关键性和供应风险对零件库存进行分类。与交货期长且单一来源供应商的关键零件相比，具有多个来源和短交货期的商品零件应该持有更少的安全库存。第三，当实际消耗与预测显著偏离时，建立明确的升级协议。如果你连续两个季度的零件消耗比计划低15%，这就是减少采购数量的信号——不是希望第三季度会有所不同。\n\n存储超级周期将走完其进程。随着新产能上线和AI基础设施建设的正常化，价格最终将达到峰值、平稳，并可能下降。最先走出来的采购组织，不是那些在高峰期购买最多的——而是那些在整个过程中保持分析纪律、保持需求预测诚实、避免基于标题而非数据购买的行为陷阱的。在超级周期中，就像供应链管理中的大多数事情一样，准确性胜过数量。",
            vocabulary: [
                {
                    word: "availability heuristic",
                    meaning: "可得性启发法；一种行为经济学概念，指人们根据信息的易获取程度来判断事件可能性，高估近期事件的重要性",
                    example: "The availability heuristic causes procurement teams to over-weight recent price spikes and under-weight historical price stability when making inventory decisions."
                },
                {
                    word: "front-load inventory",
                    meaning: "提前建库/前置库存；在价格上涨前主动增加采购量以锁定较低成本的库存策略",
                    example: "The temptation to front-load inventory before predicted price increases requires careful evaluation of actual consumption needs."
                },
                {
                    word: "installed base",
                    meaning: "装机基础；已售出并正在使用的设备总量，是预测备件消耗量的基础数据",
                    example: "If the installed base is declining, even dramatically rising component prices may not justify aggressive inventory build."
                },
                {
                    word: "buffer stock sizing",
                    meaning: "安全库存规模；基于供应风险和需求不确定性确定的缓冲库存量",
                    example: "Buffer stock sizing should be calibrated by supply risk tolerance rather than price speculation during a supercycle."
                },
                {
                    word: "consumption forecast",
                    meaning: "消耗预测；基于历史数据和趋势对未来零件消耗量的预估",
                    example: "The procurement team validated their consumption forecast against actual shipment data before committing to additional inventory purchases."
                }
            ],
            practice: [
                {
                    question: "What does the 'availability heuristic' describe in the context of procurement decision-making?",
                    options: [
                        "A method for calculating available inventory levels in a warehouse",
                        "The behavioral tendency to over-weight recent dramatic events and under-weight historical data when making decisions",
                        "A type of heuristic used by logistics companies to optimize delivery routes",
                        "The availability of multiple suppliers for critical components"
                    ],
                    answer: 1
                },
                {
                    question: "Why might front-loading inventory purchases based on price forecasts backfire even if those forecasts are accurate?",
                    options: [
                        "Suppliers always charge higher prices for large orders",
                        "If the installed base is declining, extra inventory may not be consumed and will incur holding costs and obsolescence risk",
                        "Price forecasts are never accurate enough to justify advance purchasing",
                        "Front-loading only works for consumer goods, not enterprise components"
                    ],
                    answer: 1
                },
                {
                    question: "According to the article, what is the key difference between 'buying the most' versus 'buying most accurately'?",
                    options: [
                        "Buying the most means purchasing from multiple suppliers, while buying most accurately means single-source procurement",
                        "Buying the most focuses on volume regardless of price, while buying most accurately focuses on price timing",
                        "Buying the most prioritizes volume over data, while buying most accurately prioritizes consumption-validated quantities over speculative buying",
                        "There is no practical difference; both approaches lead to the same outcomes"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-28', label: '2026-04-28（今日）'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
