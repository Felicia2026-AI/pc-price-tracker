<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"Q1 PC shipments came in below expectations at just 3% YoY growth. However, we expect cost pressures to intensify from Q2 as memory and storage prices surge faster than anticipated, which will squeeze our margins. We need to accelerate our LTA negotiations before the window closes.\"",
            chinese: "Q1 PC出货低于预期，同比增长仅3%。然而，我们预计从Q2开始，随着内存和存储价格以超出预期的速度上涨，成本压力将加剧，这将压缩我们的毛利空间。我们需要在窗口关闭之前加快长协谈判。",
            meaning: "come in below expectations：低于预期（常用商业表达）。YoY = Year-over-Year：同比增长。cost pressures intensify：成本压力加剧。surge faster than anticipated：以超出预期的速度上涨。squeeze margins：压缩利润空间。accelerate LTA negotiations：加快长协谈判。",
            example: "Given that Q1 shipments came in below expectations, we need to accelerate our cost control initiatives and explore alternative sourcing strategies before the pricing window closes."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 库存管理
        const todayContent = {
            english: "In the memory and storage supply chain, effective inventory management is critical to balancing cost control with production continuity. For SSC teams managing spare parts procurement, understanding the key inventory strategies and their trade-offs is essential.\n\nThe first concept to grasp is safety stock. Safety stock is the buffer inventory kept to protect against variability in demand and supply. In the context of memory components, where prices can fluctuate dramatically and lead times are unpredictable, maintaining adequate safety stock is crucial. However, the challenge lies in determining the right level—too much safety stock ties up working capital and increases carrying costs; too little risks stockouts that can halt production.\n\nThe safety stock formula incorporates several factors: average daily usage rate, lead time variability, and service level requirements. For DDR5 and NAND components, where demand can spike突然 due to AI server orders or drop suddenly when channel inventory corrects, safety stock calculations must account for high volatility. SSC teams should review safety stock levels quarterly and adjust based on recent demand patterns.\n\nAnother critical concept is Economic Order Quantity (EOQ). EOQ determines the optimal order quantity that minimizes total inventory costs, including ordering costs and carrying costs. The formula balances the trade-off between ordering frequency (more frequent orders mean lower inventory levels but higher ordering costs) and order quantity (larger orders mean lower ordering costs but higher carrying costs).\n\nFor memory components, EOQ calculations are complicated by price volatility. When prices are rising, it may make sense to order larger quantities to lock in current prices, even if this increases carrying costs. When prices are falling, ordering smaller quantities more frequently may be preferable. SSC teams must integrate price trend analysis into their EOQ calculations.\n\nLead time management is equally important. Memory component lead times can range from 4 weeks to 16 weeks depending on the component type and market conditions. Long lead times require earlier ordering and more accurate demand forecasting. In a supercycle environment where supply constraints persist, lead times tend to lengthen, requiring procurement teams to plan further ahead.\n\nJust-In-Time (JIT) inventory is a strategy where components arrive exactly when needed for production, minimizing inventory holding costs. While JIT can be highly efficient in stable environments, it becomes risky when lead times are long and variable. During the 2025-2026 memory supercycle, many PC manufacturers that relied heavily on JIT found themselves unable to secure sufficient components when demand spiked.\n\nConsignment inventory is another option where the supplier holds inventory at the customer's location until it is consumed. This transfers carrying cost risk to the supplier and can improve cash flow. However, consignment requires careful tracking and may not be available for all component types or suppliers.\n\nDemand forecasting accuracy is the foundation of effective inventory management. For memory components, forecasting is particularly challenging due to the influence of external factors such as AI server demand, geopolitical tensions affecting semiconductor supply chains, and channel inventory corrections. SSC teams should use multiple forecasting methods—quantitative models for short-term projections and qualitative judgment for longer-term scenarios.\n\nWhen demand forecasting indicates potential shortages, procurement teams should consider strategic stockpiling. Strategic stockpiling involves building inventory above normal safety stock levels in anticipation of future price increases or supply constraints. The decision to strategically stockpile requires careful cost-benefit analysis, considering the probability and magnitude of price increases, available storage capacity, and working capital constraints.\n\nInventory turns is a key performance indicator that measures how many times inventory is sold and replaced over a period. Higher inventory turns indicate more efficient inventory management, but excessively high turns may signal insufficient inventory that risks stockouts. For memory components with volatile pricing, the optimal inventory turn rate balances carrying costs against the risk of holding expensive inventory that may decline in value.\n\nThe days of inventory (DOI) metric complements inventory turns by showing how many days of inventory are on hand. Industry benchmarks for memory components typically range from 30 to 60 days, depending on product lifecycle stage and demand predictability. SSC teams should track DOI trends and investigate deviations from benchmarks.\n\nIn practice, the most effective inventory management approach for SSC teams combines multiple strategies. Maintain appropriate safety stock based on component criticality and demand volatility. Use EOQ principles adjusted for price trends. Build strategic stockpiles when market analysis indicates favorable conditions. Monitor lead times closely and adjust order timing accordingly. Continuously improve demand forecasting accuracy through data analytics and cross-functional collaboration.\n\nThe memory market dynamics of 2026 demand that SSC teams be more sophisticated in their inventory management approaches. The days of simple reorder-point systems are gone. Today's environment requires integrated demand planning, strategic supplier partnerships, and agile response to market signals. Those who master these skills will deliver competitive advantage through better cost control and production continuity.",
            chinese: "在内存和存储供应链中，有效的库存管理对于平衡成本控制与生产连续性至关重要。对于管理备件采购的SSC团队来说，理解关键库存策略及其权衡取舍是必不可少的。\n\n第一个需要掌握的概念是安全库存。安全库存是为防止需求和供应波动而保持的缓冲库存。在内存零部件的背景下——价格可能剧烈波动，交期不可预测——保持充足的安全库存至关重要。然而，挑战在于确定正确的水平——过多的安全库存会占用营运资金并增加持有成本；过少则可能导致缺货，进而中断生产。\n\n安全库存公式包含几个因素：平均日使用率、交期变动性和服务水平要求。对于DDR5和NAND零部件，需求可能因AI服务器订单而突然激增，或因渠道库存修正而突然下降，因此安全库存计算必须考虑高波动性。SSC团队应每季度审查安全库存水平，并根据近期需求模式进行调整。\n\n另一个关键概念是经济订货量（EOQ）。EOQ决定使总库存成本最小化的最优订货量，包括订货成本和持有成本。该公式平衡了订货频率（更频繁的订货意味着更低的库存水平但更高的订货成本）与订货量（大额订单意味着更低的订货成本但更高的持有成本）之间的权衡。\n\n对于内存零部件，EOQ计算因价格波动而变得复杂。当价格上涨时，订货更大数量以锁定当前价格可能是合理的，即使这会增加持有成本。当价格下跌时，更频繁地订购更小数量可能更可取。SSC团队必须将价格趋势分析整合到EOQ计算中。\n\n交期管理同样重要。内存零部件的交期可能从4周到16周不等，具体取决于零部件类型和市场状况。长交期需要更早订货和更准确的需求预测。在供应约束持续的超级周期环境中，交期往往会延长，要求采购团队更早规划。\n\n准时制（JIT）库存是一种策略，零部件在生产需要时刚好到达，将库存持有成本降至最低。虽然JIT在稳定环境中可能非常高效，但当交期长且变动大时，它就变得有风险。在2025-2026年内存超级周期期间，许多严重依赖JIT的PC制造商发现，当需求激增时，他们无法获得足够的零部件。\n\n寄售库存是另一个选项，供应商将库存放在客户所在地直到被消耗。这将持有成本风险转移给供应商，可以改善现金流。然而，寄售需要仔细跟踪，可能并非所有零部件类型或供应商都提供。\n\n需求预测准确性是有效库存管理的基础。对于内存零部件，预测尤其困难，因为受外部因素影响较大，如AI服务器需求、影响半导体供应链的地缘政治紧张局势以及渠道库存修正。SSC团队应使用多种预测方法——定量模型用于短期预测，定性判断用于长期情景。\n\n当需求预测显示潜在短缺时，采购团队应考虑战略储备。战略储备是在预期未来价格上涨或供应紧张时，建立高于正常安全库存水平的库存。决定进行战略储备需要仔细的成本效益分析，考虑价格上涨的概率和幅度、可用存储容量以及营运资金限制。\n\n库存周转率是衡量库存在一段时间内被销售和更换次数的关键绩效指标。较高的库存周转率表明库存管理更高效，但过高的周转率可能表明库存不足，有缺货风险。对于价格波动较大的内存零部件，最佳库存周转率平衡持有成本与持有可能贬值的昂贵库存的风险。\n\n库存天数（DOI）指标补充了库存周转率，显示手头有多少天的库存。内存零部件的行业基准通常在30至60天之间，取决于产品生命周期阶段和需求可预测性。SSC团队应跟踪DOI趋势并调查与基准的偏差。\n\n在实践中，SSC团队最有效的库存管理方法结合了多种策略。根据零部件关键性和需求波动性保持适当的安全库存。使用根据趋势调整的EOQ原则。当市场分析显示有利条件时建立战略储备。密切监控交期并相应调整订货时间。通过数据分析和跨职能协作持续提高需求预测准确性。\n\n2026年的内存市场动态要求SSC团队在库存管理方法上更加成熟。简单的再订货点系统时代已经过去。今天的环境需要综合需求规划、战略性供应商伙伴关系以及对市场信号的敏捷响应。那些掌握这些技能的人将通过更好的成本控制和生产连续性交付竞争优势。",
            vocabulary: [
                {
                    word: "safety stock",
                    meaning: "安全库存；为防止需求和供应波动而保持的缓冲库存",
                    example: "We maintain 15 days of safety stock for DDR5 components due to high demand volatility."
                },
                {
                    word: "economic order quantity (EOQ)",
                    meaning: "经济订货量；使总库存成本最小化的最优订货量",
                    example: "The EOQ model suggests ordering 5,000 units per batch, but we adjust this based on price trends."
                },
                {
                    word: "lead time",
                    meaning: "交期/前置时间；从下单到交货所需的时间",
                    example: "Current DDR5 lead times range from 8 to 12 weeks, up from 4 weeks last quarter."
                },
                {
                    word: "just-in-time (JIT)",
                    meaning: "准时制；零部件在生产需要时刚好到达的库存策略",
                    example: "JIT worked well in stable markets but became risky during the memory supercycle."
                },
                {
                    word: "inventory turns / days of inventory (DOI)",
                    meaning: "库存周转率/库存天数；衡量库存效率的关键指标",
                    example: "Our inventory turns improved to 8x annually, reducing DOI from 60 to 45 days."
                }
            ],
            practice: [
                {
                    question: "Why is safety stock important for memory component inventory management?",
                    options: [
                        "It reduces ordering costs",
                        "It protects against demand and supply variability in a volatile market",
                        "It eliminates the need for forecasting",
                        "It lowers the purchase price"
                    ],
                    answer: 1
                },
                {
                    question: "What is a key limitation of Just-In-Time (JIT) inventory during a memory supercycle?",
                    options: [
                        "JIT increases carrying costs",
                        "JIT becomes risky when lead times are long and variable",
                        "JIT requires more storage space",
                        "JIT is too expensive to implement"
                    ],
                    answer: 1
                },
                {
                    question: "When might it make sense to order larger quantities than EOQ suggests?",
                    options: [
                        "When prices are falling rapidly",
                        "When prices are rising and you want to lock in current prices",
                        "When lead times are short",
                        "When inventory turns are high"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
