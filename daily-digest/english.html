<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月16日星期四';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/16 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"With NAND supplier inventory at historical lows and pricing power shifting decisively to OEMs, we're facing a supercycle where spot price dips are just noise. The real story is contract pricing—Q2 NAND contracts are up 75% QoQ. We need to secure our LTA allocations before the window closes.\"",
            chinese: "随着NAND供应商库存降至历史低位，定价权已决定性地转向原厂，我们正面临一个超级周期，现货价格的下跌只是噪音。真正的问题是合约价——Q2 NAND合约价环比上涨75%。我们需要在窗口关闭之前确保长协配额。",
            meaning: "pricing power shifting to OEMs：定价权转向原厂（OEM在这里指内存原厂如三星/SK海力士）。supercycle：超级周期。spot price dips are just noise：现货下跌只是噪音/干扰信号。contract pricing：合约价。LTA allocations：长协配额。",
            example: "While competitors focus on spot market movements, we're locking in LTA allocations to secure our contract pricing position for Q3."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 供应链弹性
        const todayContent = {
            english: "Supply chain resilience has become the defining competitive advantage in the memory and storage industry during the 2026 supercycle. As component shortages persist and price volatility intensifies, companies with robust supply chain capabilities are outperforming those relying on spot markets and just-in-time procurement.\n\nSupply chain resilience refers to a company's ability to anticipate, prepare for, and respond to unexpected disruptions while maintaining continuous operations. In the context of memory components, resilience encompasses multiple dimensions: supplier relationship depth, inventory strategy sophistication, demand forecasting accuracy, and logistical flexibility.\n\nThe first pillar of resilience is strategic supplier partnerships. Long-term agreements (LTAs) with memory OEMs provide price stability, allocation priority during shortages, and access to new product generations. Companies that secured LTAs before the 2025-2026 supercycle are now enjoying cost advantages and supply security that competitors lack. The key is developing relationships at multiple levels—executive, technical, and commercial—to ensure mutual commitment during challenging periods.\n\nSupplier diversification is another critical element. Relying on a single memory supplier creates concentration risk that can materialize during geopolitical tensions, natural disasters, or production issues. Leading PC manufacturers maintain relationships with three or more major memory OEMs, enabling them to shift volumes based on availability and pricing. However, diversification requires careful management to avoid sacrificing volume discounts and relationship depth.\n\nInventory resilience involves balancing the trade-offs between carrying costs, working capital requirements, and supply security. The supercycle has demonstrated that aggressive inventory building before price increases can generate significant cost savings. Strategic stockpiling—maintaining inventory above normal safety stock levels in anticipation of future constraints—has proven valuable for companies with sufficient capital and storage capacity.\n\nThe rise of consignment models represents another resilience mechanism. Under consignment, suppliers hold inventory at customer facilities until components are consumed, transferring carrying cost risk and improving cash flow. While consignment requires sophisticated inventory tracking systems, it can provide supply security during shortages when spot market availability is limited.\n\nDemand forecasting accuracy underpins all resilience strategies. Accurate forecasts enable optimal inventory levels, effective LTA negotiation, and proactive supplier communication. In volatile markets, forecasting methods must evolve beyond simple historical averaging. Machine learning models that incorporate market signals, economic indicators, and supplier data can improve forecast accuracy significantly.\n\nRisk monitoring and early warning systems represent the proactive dimension of resilience. Leading companies monitor a range of indicators including supplier capacity utilization, lead time trends, spot-to-contract price spreads, and geopolitical risk indices. When indicators signal increasing risk, pre-planned response protocols activate, such as accelerating orders, qualifying alternative suppliers, or adjusting production schedules.\n\nGeographic diversification of supply chain operations adds another layer of resilience. Companies with manufacturing facilities in multiple regions can shift production based on logistics disruptions, tariff changes, or regional demand shifts. For memory components, this often means maintaining relationships with suppliers in different geographic clusters—Korea, Taiwan, China, and emerging markets—to reduce single-region exposure.\n\nThe financial dimension of resilience deserves attention. Companies with strong credit ratings and cash reserves can invest in inventory building, secure LTAs, and absorb short-term cost volatility. Those with constrained balance sheets may find themselves unable to participate in strategic inventory programs, leaving them vulnerable to price increases.\n\nTechnology investment in supply chain systems enables resilience at scale. Real-time visibility into inventory levels, supplier production status, and logistics operations allows rapid decision-making during disruptions. Cloud-based supply chain platforms, IoT tracking, and AI-powered analytics are becoming standard tools for leading organizations.\n\nCollaboration across the supply chain represents the final frontier of resilience. Sharing demand forecasts, production plans, and risk information with suppliers enables proactive response to potential issues. Collaborative forecasting programs, joint inventory optimization initiatives, and shared risk management frameworks strengthen relationships and improve overall supply chain performance.\n\nIn the 2026 memory supercycle, companies that have invested in supply chain resilience are demonstrating clear competitive advantages. They maintain lower costs through LTA security, avoid production disruptions through diversified supply, and identify market opportunities through superior forecasting. As the supercycle continues and market volatility persists, resilience will remain the key differentiator between industry leaders and laggards.",
            chinese: "在2026年超级周期中，供应链弹性已成为内存和存储行业决定性的竞争优势。随着零部件短缺持续和价格波动加剧，拥有强大供应链能力的公司正在超越那些依赖现货市场和准时制采购的竞争对手。\n\n供应链弹性指公司在保持持续运营的同时，预测、准备和应对意外中断的能力。在内存零部件领域，弹性涵盖多个维度：供应商关系深度、库存策略成熟度、需求预测准确性和物流灵活性。\n\n弹性的第一个支柱是战略性供应商伙伴关系。与内存原始设备制造商签订的长期协议（LTA）提供价格稳定、短缺时期的优先分配权以及获取新一代产品的机会。在2025-2026超级周期之前锁定LTA的公司现在正享受着竞争对手缺乏的成本优势和供应安全保障。关键是建立多层次的关系——高管、技术和商业层面——以确保在困难时期的相互承诺。\n\n供应商多元化是另一个关键要素。依赖单一内存供应商会造成集中风险，在地缘政治紧张、自然灾害或生产问题时可能显现。领先的PC制造商与三个或更多主要内存原始设备制造商保持关系，能够根据可用性和定价调整数量。然而，多元化需要谨慎管理，以避免牺牲数量折扣和关系深度。\n\n库存弹性涉及平衡持有成本、营运资金需求与供应安全之间的权衡。超级周期表明，在价格上涨之前积极建立库存可以产生显著的成本节约。战略储备——在预期未来约束时维持高于正常安全库存水平的库存——已被证明对拥有充足资本和存储容量的公司有价值。\n\n寄售模式的兴起代表了另一种弹性机制。在寄售模式下，供应商在客户设施持有库存直到零部件被消耗，转移持有成本风险并改善现金流。虽然寄售需要复杂的库存跟踪系统，但在现货市场可用性有限的短缺时期，它可以提供供应保障。\n\n需求预测准确性是所有弹性策略的基础。准确的预测使最佳库存水平、有效的长协谈判和积极的供应商沟通成为可能。在波动市场中，预测方法必须超越简单的历史平均。纳入市场信号、经济指标和供应商数据的机器学习模型可以显著提高预测准确性。\n\n风险监控和早期预警系统代表了弹性的主动维度。领先公司监控一系列指标，包括供应商产能利用率、交期趋势、现货-合约价差和地缘政治风险指数。当指标显示风险增加时，预设的响应协议被激活，如加速订单、认证替代供应商或调整生产计划。\n\n供应链运营的地理多元化增加了弹性的另一层。在多个地区拥有制造设施的公司可以根据物流中断、关税变化或区域需求变化调整生产。对于内存零部件，这通常意味着保持与不同地理集群供应商的关系——韩国、台湾、中国和新兴市场——以减少单一地区敞口。\n\n弹性的财务维度值得关注。拥有强劲信用评级和现金储备的公司可以投资于库存建设、锁定长协，并吸收短期成本波动。那些资产负债表受限的公司可能发现自己无法参与战略库存计划，使他们容易受到价格上涨的影响。\n\n对供应链系统的技术投资使弹性能够规模化。实时了解库存水平、供应商生产状态和物流运营情况，使公司在中断期间能够快速决策。基于云的供应链平台、物联网跟踪和AI驱动的分析正在成为领先组织的标准工具。\n\n跨供应链协作代表了弹性的最后前沿。与供应商共享需求预测、生产计划和风险信息，能够对潜在问题做出积极响应。协作预测计划、联合库存优化举措和共享风险管理框架加强了关系并改善了整体供应链绩效。\n\n在2026年内存超级周期中，投资于供应链弹性的公司正在展示明显的竞争优势。他们通过长协保障维持较低成本，通过多元化供应避免生产中断，并通过卓越的预测识别市场机会。随着超级周期的持续和市场波动的持续，弹性仍将是在行业领导者和落后者之间区分的关键因素。",
            vocabulary: [
                {
                    word: "supply chain resilience",
                    meaning: "供应链弹性；应对中断并保持持续运营的能力",
                    example: "Our supply chain resilience strategy helped us navigate the memory shortage better than competitors."
                },
                {
                    word: "strategic supplier partnerships",
                    meaning: "战略性供应商伙伴关系；与关键供应商建立长期深度合作",
                    example: "Strategic supplier partnerships enabled priority allocation during the NAND shortage."
                },
                {
                    word: "consignment model",
                    meaning: "寄售模式；供应商在客户处持有库存直到消耗",
                    example: "The consignment model reduced our carrying costs while ensuring supply security."
                },
                {
                    word: "geographic diversification",
                    meaning: "地理多元化；在多个地区建立供应链以降低风险",
                    example: "Geographic diversification of our supplier base reduced single-region risk exposure."
                },
                {
                    word: "collaborative forecasting",
                    meaning: "协作预测；与供应商共享信息以提高预测准确性",
                    example: "Collaborative forecasting with our NAND suppliers improved our demand planning accuracy by 25%."
                }
            ],
            practice: [
                {
                    question: "Why are Long-Term Agreements (LTAs) important during a memory supercycle?",
                    options: [
                        "They reduce the need for inventory",
                        "They provide price stability and allocation priority during shortages",
                        "They eliminate the need for supplier relationships",
                        "They guarantee unlimited supply at fixed prices"
                    ],
                    answer: 1
                },
                {
                    question: "What is a key limitation of aggressive inventory building during a supercycle?",
                    options: [
                        "It reduces supplier relationships",
                        "It requires significant capital and storage capacity",
                        "It increases spot market dependence",
                        "It eliminates the need for forecasting"
                    ],
                    answer: 1
                },
                {
                    question: "What does geographic diversification of supply chain help companies avoid?",
                    options: [
                        "Price negotiations",
                        "Single-region exposure to disruptions",
                        "Long-term agreements",
                        "Inventory management"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-16', label: '2026-04-16（今日）'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
