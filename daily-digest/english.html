<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 18:00:00';

        // 今日短语
        const todayPhrase = {
            english: "\"We need to front-load our inventory before the May price hike takes effect.\"",
            chinese: "我们需要在5月涨价生效之前提前增加库存。",
            meaning: "front-load：提前加载/前置。此处指在涨价前抢先采购和储备库存，以锁定当前较低价格。",
            example: "Given the confirmed 15-20% NAND price increase in May, our procurement team decided to front-load Q2 inventory to capture cost savings."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 采购与供应商管理
        const todayContent = {
            english: "Strategic procurement in the PC spare parts industry requires balancing multiple factors: component availability, cost optimization, and supply chain resilience. In today's volatile memory market, successful procurement teams employ several key strategies to manage risk and maximize value.\n\nLong-term framework agreements with tier-one suppliers have become essential for managing DRAM and NAND price volatility. These agreements typically lock in volume commitments and price formulas for 12-24 months, providing cost predictability while maintaining flexibility for volume adjustments. Major OEMs like Lenovo have increasingly turned to 2-year pricing frameworks with Samsung and SK Hynix to secure supply and stabilize costs for the SSC.\n\nDiversification is another critical strategy. Relying on a single supplier for critical components creates unacceptable risk. Progressive organizations maintain relationships with 2-3 qualified suppliers for each critical part category. This not only provides backup supply options but also creates competitive tension that can yield better pricing terms. The ongoing push for domestic alternatives—such as ChangXin Memory DRAM and Yangtze Memory NAND—adds another dimension to supplier diversification strategies.\n\nDynamic inventory management tied to market intelligence is the third pillar. When price forecasts indicate upward pressure—as with the confirmed May NAND increase—procurement teams must act decisively to front-load inventory. Conversely, when spot prices are trending down faster than contract prices, minimizing new purchases and drawing down inventory becomes prudent. This requires close collaboration between procurement, finance, and the SSC cost team to balance working capital constraints against cost savings opportunities.",
            chinese: "PC备件行业的战略性采购需要平衡多个因素：零部件可得性、成本优化和供应链韧性。在当今波动的存储市场中，成功的采购团队采用多种关键策略来管理风险和最大化价值。\n\n与一级供应商签订长期框架协议已成为管理DRAM和NAND价格波动的关键。这些协议通常锁定12-24个月的量价承诺，提供成本可预测性，同时保持量价调整的灵活性。联想等主要OEM越来越多地与三星和SK海力士签订2年定价框架协议，以锁定供应并稳定SSC成本。\n\n多元化是另一个关键策略。依赖单一供应商供应关键零部件会造成不可接受的风险。先进的企业为每个关键零部件类别维持2-3个合格供应商关系。这不仅提供备用供应选项，还创造竞争压力以获得更好的定价条款。推进国产替代（如长江存储DRAM和长江存储NAND）为供应商多元化策略增添了新维度。\n\n与市场情报挂钩的动态库存管理是第三支柱。当价格预测显示上行压力时——如5月NAND涨价已确认——采购团队必须果断行动提前增加库存。相反，当现货价格下跌速度快于合约价格时，最小化新采购和消耗现有库存是审慎之举。这需要采购、财务和SSC成本团队密切协作，在营运资金限制与成本节约机会之间取得平衡。",
            vocabulary: [
                {
                    word: "framework agreement",
                    meaning: "框架协议；规定合作基本条款的长期合同，通常包含量价承诺和灵活性条款",
                    example: "Our 2-year framework agreement with Samsung provides price stability for DRAM procurement."
                },
                {
                    word: "tier-one supplier",
                    meaning: "一级供应商；指行业领先、规模最大、质量和交付能力最强的供应商",
                    example: "Samsung and SK Hynix are considered tier-one suppliers in the memory market."
                },
                {
                    word: "front-load",
                    meaning: "提前加载；在价格变动发生前抢先采取行动，通常指提前采购以锁定价格",
                    example: "We decided to front-load inventory ahead of the confirmed May price increase."
                },
                {
                    word: "supply chain resilience",
                    meaning: "供应链韧性；供应链应对中断、波动和意外事件的能力",
                    example: "Building supply chain resilience requires diversifying suppliers and maintaining safety stock."
                },
                {
                    word: "cost predictability",
                    meaning: "成本可预测性；能够预见和规划未来成本水平的能力",
                    example: "Long-term agreements provide cost predictability for annual budgeting."
                }
            ],
            practice: [
                {
                    question: "What is the primary benefit of long-term framework agreements with tier-one suppliers?",
                    options: [
                        "Guaranteed exclusive supply",
                        "Cost predictability and supply security",
                        "Access to the newest technology first",
                        "Elimination of all procurement risks"
                    ],
                    answer: 1
                },
                {
                    question: "Why is supplier diversification important in strategic procurement?",
                    options: [
                        "To increase dependence on a single supplier",
                        "To reduce risk and create competitive pricing pressure",
                        "To simplify the procurement process",
                        "To reduce the number of contracts needed"
                    ],
                    answer: 1
                },
                {
                    question: "What does 'front-load inventory' mean in the context of rising prices?",
                    options: [
                        "Delay purchases until prices peak",
                        "Purchase extra inventory before price increases take effect",
                        "Reduce inventory levels to save storage costs",
                        "Spread purchases evenly throughout the year"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
