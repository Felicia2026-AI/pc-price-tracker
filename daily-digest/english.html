<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"Goldman Sachs' latest research confirms a triple tightening balance across DRAM, NAND, and HBM markets—the supply-demand gap is widening beyond previous expectations. For our Q2 parts procurement, this means we need to lock in orders at least one quarter ahead to avoid shortage risk in Q3.\"",
            chinese: "高盛最新研究确认DRAM、NAND和HBM市场三重紧平衡——供需缺口超出此前预期。对我们的Q2备件采购而言，这意味着需要提前至少一个季度锁单，以避免Q3缺货风险。",
            meaning: "triple tightening balance：三重紧平衡，指DRAM、NAND、HBM三条产品线同时处于供应紧张状态。supply-demand gap：供需缺口。lock in orders：锁单/锁定订单。shortage risk：缺货风险。",
            example: "Given the triple tightening balance, we should submit our Q3 parts orders to key suppliers by end of April to secure allocation priority."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 供应紧张下的库存策略
        const todayContent = {
            english: "Goldman Sachs' latest research note on global semiconductor supply dynamics has confirmed a \"triple tightening balance\" across DRAM, NAND, and High-Bandwidth Memory (HBM) markets—the supply-demand gap is widening beyond previous expectations. This represents a significant shift from the cyclical supply-demand patterns that characterized the memory industry for decades.\n\nThe concept of triple tightening balance means that supply constraints are not isolated to one product category—they are systemic across the entire memory ecosystem. In previous cycles, when DRAM prices were rising, NAND might have been in oversupply, allowing buyers to shift their procurement mix. Today, all three product families are simultaneously constrained, leaving buyers with fewer degrees of freedom to optimize their component sourcing.\n\nLet's examine what's happening in each market segment. In DRAM, the dual pressure of AI server demand and conventional PC/consumer demand has created insufficient manufacturing capacity. HBM, used exclusively in AI accelerators like NVIDIA's H100 and H200 GPUs, requires specialized manufacturing processes that share some capacity with conventional DRAM. As HBM demand exploded, manufacturers redirected their most advanced processes toward HBM production, creating a structural constraint in commodity DRAM supply.\n\nThe NAND market faces similar pressures. Enterprise SSD demand for AI training infrastructure is consuming NAND supply that would otherwise go to consumer applications. TrendForce forecasts of 70-75% Q2 contract price increases for NAND reflect this fundamental imbalance.\n\nFor HBM specifically, the constraint is even more severe. SK Hynix remains the primary supplier for NVIDIA's HBM3, with Samsung and Micron racing to qualify their HBM3e solutions. The tight HBM supply has direct implications even for PC manufacturers—servers using HBM-based AI accelerators require supporting infrastructure that competes with PC component supply.\n\nWhat does triple tightening mean for spare parts supply chain management? First, procurement lead times need to extend. Standard lead times of 4-8 weeks have extended to 12-16 weeks or longer for high-demand SKUs. SSC teams should rebuild planning assumptions to account for these longer cycles.\n\nSecond, safety stock levels need to increase. Traditional 2-4 week safety stock may be insufficient when replenishment lead times are 12+ weeks. Some practitioners recommend increasing safety stock to 6-8 weeks for critical components, though this increases working capital requirements.\n\nThird, demand forecasting accuracy becomes more critical than ever. When supply is tight and lead times are long, forecast errors are expensive—a 10% demand miss might mean a 10-week wait to correct inventory imbalance. SSC teams should work closely with product planning and sales operations to improve demand signal quality.\n\nFourth, supplier relationship management takes center stage. In a tight supply environment, suppliers allocate based on customer priority and relationship strength. Companies with strong existing relationships and LTA coverage will get allocated first; those without LTAs may face extended delivery schedules or allocation cuts.\n\nFifth, design-for-supply-chain becomes a competitive advantage. Product designs allowing multiple qualified component sources, wider operating voltage ranges, and modular architecture provide flexibility to adapt to supply constraints.\n\nFor Lenovo's SSC, the triple tightening has immediate implications. The ThinkPad 2026 launch on April 22 will introduce new product models requiring new component specifications. Ensuring supply for new models while maintaining service parts coverage for existing models demands careful coordination with procurement and suppliers.\n\nThe practical takeaway: the era of abundant component supply has ended. The new normal requires supply chain organizations to be more proactive, more strategic in supplier relationships, and more rigorous in demand planning. Those who adapt will maintain service levels and cost efficiency; those who cling to old practices will face increasing supply disruptions and cost volatility.",
            chinese: "高盛关于全球半导体供应动态的最新研究报告确认了DRAM、NAND和HBM市场的"三重紧平衡"——供需缺口超出此前预期。这代表了数十年来内存行业周期性供需模式的重大转变。\n\n三重紧平衡意味着供应紧张不是孤立于某一产品类别——而是系统性地贯穿整个内存生态系统。在过去的周期中，当DRAM价格上涨时，NAND可能处于供过于求状态，买家可以通过调整采购组合来优化。如今，三条产品线同时受到约束，买家几乎没有自由度来优化零部件采购。\n\n让我们分析每个细分市场。DRAM市场面临AI服务器需求和传统PC/消费需求的双重压力，产能不足。HBM用于NVIDIA H100/H200 GPU等AI加速器，需要与常规DRAM共享产能的专用制造工艺。随着HBM需求暴增，制造商将最先进工艺转向HBM生产，在商品DRAM市场造成结构性约束。\n\nNAND市场面临类似压力。AI训练基础设施的企业级SSD需求正在消耗原本流向消费应用的NAND供应。TrendForce预测NAND Q2合约价将上涨70-75%，反映了这一基本失衡。\n\nHBM的约束更为严峻。SK海力士仍是NVIDIA HBM3的主要供应商，三星和美光正竞相认证HBM3e解决方案。紧张的HBM供应对PC制造商有直接影响——使用HBM加速器的服务器需要与PC零部件供应形成竞争的支持性基础设施。\n\n三重紧平衡对备件供应链管理意味着什么？第一，采购交期需要延长。标准交期从4-8周延长至12-16周或更长。第二，安全库存水平需要提高。传统2-4周的安全库存在12+周补货交期下可能不够充分。第三，需求预测准确性比以往更加关键。第四，供应商关系管理成为核心。第五，面向供应链的设计成为竞争优势。\n\n具体到联想SSC，4月22日的ThinkPad 2026发布将推出需要新规格的新产品型号。为新型号确保供应同时保持现有产品的服务零部件覆盖，需要与采购和供应商仔细协调。\n\n实用建议：零部件供应充裕的时代已经结束。新常态要求供应链组织更加积极主动、更加战略性地处理供应商关系、更加严格地进行需求规划。",
            vocabulary: [
                {
                    word: "triple tightening balance",
                    meaning: "三重紧平衡；DRAM、NAND、HBM三条产品线同时处于供应紧张状态",
                    example: "Goldman Sachs confirms a triple tightening balance across memory markets, with supply-demand gaps widening beyond expectations."
                },
                {
                    word: "supply-demand gap",
                    meaning: "供需缺口；市场需求超过供应能力的差额",
                    example: "The supply-demand gap in HBM has widened to where major cloud providers commit to 3-year LTAs just to secure allocation."
                },
                {
                    word: "lock in orders",
                    meaning: "锁单；提前锁定供应商的订单配额和价格",
                    example: "We need to lock in our Q3 DRAM orders by end of April to ensure supply for the ThinkPad 2026 launch."
                },
                {
                    word: "shortage risk",
                    meaning: "缺货风险；供应商无法按承诺时间交付足量货物的风险",
                    example: "Given the triple tightening, our shortage risk for LCD panels has increased from 15% to 35% for Q3."
                },
                {
                    word: "safety stock",
                    meaning: "安全库存；为应对需求波动和供应不确定性而额外持有的库存",
                    example: "With lead times extending to 12+ weeks, we should increase safety stock for critical components from 3 to 6 weeks."
                }
            ],
            practice: [
                {
                    question: "What does 'triple tightening balance' mean in memory supply?",
                    options: [
                        "Three memory chip types are getting cheaper",
                        "DRAM, NAND, and HBM are all simultaneously in tight supply",
                        "Three major suppliers are competing for market share",
                        "Three product generations are available at the same time"
                    ],
                    answer: 1
                },
                {
                    question: "Why have DRAM and NAND lead times extended?",
                    options: [
                        "Suppliers are deliberately delaying deliveries to raise prices",
                        "Transportation has become more complicated",
                        "Manufacturing capacity is insufficient to meet demand across all memory segments",
                        "Government regulations require longer inspection periods"
                    ],
                    answer: 2
                },
                {
                    question: "What safety stock level is recommended when lead times extend to 12+ weeks?",
                    options: [
                        "1-2 weeks, to minimize inventory costs",
                        "2-4 weeks, following traditional approaches",
                        "6-8 weeks, to account for longer replenishment cycles",
                        "12 weeks, matching the lead time"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
