<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 今日学习内容
        const todayContent = {
            english: "Good morning, everyone. Thanks for joining today's review. I'd like to walk you through our Q1 cost performance for the service supply chain.\n\nOverall, we are tracking slightly above target — about 3% over plan — mainly driven by a sharp spike in component costs. DRAM and NAND prices have surged significantly this quarter, which has pushed up our parts cost per unit.\n\nThat said, we've taken some proactive steps. We locked in contract pricing with two key suppliers before the market moved, which helped us offset roughly half of the exposure. Going forward, I'd recommend we keep a close eye on Q2 procurement windows, because memory prices are expected to stay elevated through the year.\n\nOn the positive side, our repair yield rate improved by 2 percentage points compared to last quarter, which helped bring down our net parts cost. I'll share the breakdown by region in the next slide.\n\nAny questions before I move on?",
            chinese: "大家早上好，感谢参加今天的回顾会。我来带大家看一下我们服务供应链Q1的成本表现。\n\n总体来看，我们比目标略高——大约超出计划3%——主要驱动因素是零部件成本的大幅上涨。本季度DRAM和NAND价格明显飙升，推高了每台的备件成本。\n\n尽管如此，我们提前采取了一些措施。在市场波动之前，我们与两家关键供应商锁定了合约价格，这帮助我们对冲了约一半的敞口。展望未来，我建议我们密切关注Q2的采购时间窗口，因为内存价格预计全年都将维持在高位。\n\n积极的一面是，我们的维修良率比上季度提升了2个百分点，有助于降低净备件成本。我将在下一张幻灯片中按地区详细拆解。\n\n在我继续之前，有什么问题吗？",
            vocabulary: [
                {
                    word: "walk you through",
                    meaning: "带大家逐步过一遍；详细讲解某事",
                    example: "Let me walk you through our Q1 cost breakdown."
                },
                {
                    word: "tracking above target",
                    meaning: "（实际进展）高于目标；常用于汇报数据",
                    example: "We are tracking 3% above plan this quarter."
                },
                {
                    word: "lock in (pricing)",
                    meaning: "锁定（价格/合同）；提前固定条件以规避风险",
                    example: "We locked in contract pricing before the market moved."
                },
                {
                    word: "offset exposure",
                    meaning: "对冲风险敞口；用某一动作来抵消潜在损失",
                    example: "The early contracts helped offset roughly half of our cost exposure."
                },
                {
                    word: "going forward",
                    meaning: "展望未来；从现在起（正式汇报常用过渡语）",
                    example: "Going forward, I'd recommend we keep a close eye on procurement windows."
                }
            ],
            practice: [
                {
                    question: "According to the passage, why is the company tracking above target?",
                    options: [
                        "Because repair yield rates declined",
                        "Because component costs surged sharply",
                        "Because the team missed procurement windows",
                        "Because suppliers raised shipping fees"
                    ],
                    answer: 1
                },
                {
                    question: "What proactive step did the team take to manage cost risk?",
                    options: [
                        "They reduced repair volume",
                        "They switched to new suppliers",
                        "They locked in contract pricing before the market moved",
                        "They delayed Q2 procurement"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ 正确！</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ 错误，请再试试</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
            {date: '2026-04-05', label: '2026-04-05'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `history/english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
