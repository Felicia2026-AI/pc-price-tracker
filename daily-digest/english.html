<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月13日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/13 10:00:00';

        // 今日学习内容 - 供应链成本管理中的关键指标
        const todayContent = {
            english: "Effective cost management in IT supply chain operations requires a deep understanding of several key performance indicators that directly impact the bottom line. The first critical metric is Total Cost of Ownership (TCO), which encompasses not only the initial purchase price but also hidden costs such as logistics, inventory carrying costs, quality issues, and end-of-life disposal. For spare parts inventory, TCO analysis often reveals that the purchase price represents only 40-60% of total costs, making strategic sourcing decisions essential.\n\nThe second metric gaining prominence is Days of Supply (DOS), which measures how long current inventory levels will last given average consumption rates. Optimal DOS varies by part criticality: critical service parts may warrant 60-90 days of supply while non-critical components can be maintained at 15-30 days. However, the rising trend in component prices is prompting many organizations to deliberately increase DOS for high-value items, effectively converting cash reserves into inventory as a hedge against further price escalation.\n\nThe third essential KPI is Inventory Carrying Cost Rate (ICCR), which typically ranges from 20-30% of average inventory value annually. This rate includes capital costs, storage facilities, insurance, taxes, shrinkage, and obsolescence reserves. In high-inflation environments for electronics components, the opportunity cost of capital locked in inventory becomes particularly significant. Finance teams and supply chain managers must collaborate closely to balance the trade-offs between inventory investment, price risk mitigation, and working capital efficiency. Best practices include implementing demand-driven replenishment systems, establishing supplier-managed inventory programs for stable-demand items, and conducting regular TCO-based supplier performance reviews.",
            chinese: "IT供应链运营中的有效成本管理要求深入理解若干直接影�响底线的关键绩效指标。第一个关键指标是总拥有成本（TCO），它不仅包括初始采购价格，还包括隐性成本，如物流、库存持有成本、质量问题和生命周期末期处置成本。对于备件库存，TCO分析通常揭示采购价格仅占总成本的40-60%，这使得战略性采购决策变得至关重要。\n\n第二个日益重要的指标是供应天数（DOS），它衡量的是以当前消耗率计算，现有库存水平能够维持多长时间。最优DOS因零件关键程度而异：关键维修零件可能需要60-90天的库存，而非关键部件可维持在15-30天。然而，零部件价格上涨的趋势正促使许多组织有意识地增加高价值物品的DOS，实际上是将现金储备转化为库存，作为对冲进一步价格上涨的手段。\n\n第三个必备KPI是库存持有成本率（ICCR），通常占年平均库存价值的20-30%。该比率包括资本成本、仓储设施、保险、税费、损耗和过时准备金。在电子产品零部件高通胀环境下，锁定在库存中的资本机会成本变得尤为显著。财务团队和供应链管理者必须密切合作，在库存投资、价格风险缓解和营运资金效率之间取得平衡。最佳实践包括实施需求驱动补货系统、为稳定需求品项建立供应商管理库存计划，以及定期开展基于TCO的供应商绩效评审。",
            vocabulary: [
                {
                    word: "TCO (Total Cost of Ownership)",
                    meaning: "总拥有成本；采购物品的完整成本，包括采购价+物流+库存持有+处置等全生命周期费用",
                    example: "TCO analysis revealed that the purchase price represented only 45% of total costs for critical spare parts."
                },
                {
                    word: "DOS (Days of Supply)",
                    meaning: "供应天数；当前库存以消耗率可维持的天数，衡量库存充足性的关键指标",
                    example: "We deliberately increased DOS for high-value DRAM modules to hedge against further price increases."
                },
                {
                    word: "ICCR (Inventory Carrying Cost Rate)",
                    meaning: "库存持有成本率；持有库存的年度成本占库存价值的比例，通常包含资本成本、仓储、保险、损耗等",
                    example: "With an ICCR of 25%, holding $10 million in inventory costs $2.5 million annually."
                },
                {
                    word: "supplier-managed inventory (SMI)",
                    meaning: "供应商管理库存；一种库存管理模式，由供应商监控并管理买方的库存水平",
                    example: "Implementing SMI for non-critical components freed up significant working capital."
                },
                {
                    word: "opportunity cost of capital",
                    meaning: "资本机会成本；将资金投入某一用途而放弃其他投资所损失的潜在收益",
                    example: "In a high-inflation environment, the opportunity cost of capital locked in slow-moving inventory becomes prohibitively high."
                }
            ],
            practice: [
                {
                    question: "According to the passage, what percentage of total costs does the initial purchase price typically represent for spare parts inventory?",
                    options: [
                        "15-25%",
                        "40-60%",
                        "70-80%",
                        "90-95%"
                    ],
                    answer: 1
                },
                {
                    question: "What is the recommended Days of Supply (DOS) range for non-critical spare parts according to the passage?",
                    options: [
                        "5-10 days",
                        "15-30 days",
                        "60-90 days",
                        "120-180 days"
                    ],
                    answer: 1
                },
                {
                    question: "Which of the following is listed as a best practice for balancing inventory investment and working capital efficiency?",
                    options: [
                        "Increase inventory levels for all parts uniformly",
                        "Eliminate all safety stock to reduce carrying costs",
                        "Implement demand-driven replenishment systems",
                        "Rely exclusively on just-in-time delivery"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
