<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月28日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/28 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"When AI inference costs approach near-zero, the marginal cost of deploying intelligent agents approaches zero, which fundamentally changes the unit economics of knowledge work. The bottleneck shifts from computation to judgment — and judgment is where humans remain irreplaceable.\"",
            chinese: "当AI推理成本趋近于零时，部署智能体的边际成本也趋近于零，这将根本性地改变知识工作的单位经济结构。瓶颈从计算转向判断力——而判断力正是人类不可替代之所在。",
            meaning: "inference cost：推理成本。marginal cost：边际成本。unit economics：单位经济/单位成本结构。knowledge work：知识工作。bottleneck：瓶颈。judgment：判断力/决策能力。irreplaceable：不可替代的。",
            example: "As API pricing for large language models continues to drop, the marginal cost of AI inference is approaching near-zero, which will transform the economics of knowledge work."
        };

        // 今日学习内容 - AI推理成本压缩：从"聊天便宜"到"Agent便宜"
        const todayContent = {
            english: "On April 26th, DeepSeek announced a dramatic price reduction across its entire API pricing structure, cutting input cache hit prices to one-tenth of their original launch prices. For the Flash model in the V4 series, the cost per million tokens dropped to just 0.02 yuan — approximately 0.3 US cents. This is not merely a price war between AI vendors. It represents a fundamental shift in the economics of AI deployment that every supply chain and procurement professional must understand.\n\nWhen we talk about AI becoming \"cheap,\" we need to distinguish between training costs and inference costs. Training is the upfront investment — the massive compute expenditure required to build a capable model. This remains enormously expensive. GPT-5.5 and DeepSeek-V4 each required hundreds of millions of dollars in training compute. This cost is sunk, amortized across billions of future inferences.\n\nInference is the ongoing cost — the compute required to actually run the model when a user asks a question or an application makes an API call. This is the cost that scales linearly with usage. And this is the cost that is plummeting.\n\nThe 0.02 yuan per million tokens figure deserves context. A typical email might consume 100 tokens. A moderately complex document analysis might require 10,000 tokens. At these prices, the cost of processing an email through a state-of-the-art language model is approximately 0.002 yuan — essentially negligible. Even a complex analytical task consuming 100,000 tokens costs just 2 yuan.\n\nThis has profound implications for the unit economics of knowledge work. When the marginal cost of processing information approaches zero, the constraint is no longer compute — it is judgment. Which problems are worth solving? Which analyses should be commissioned? What conclusions should be acted upon? These questions require human judgment that AI cannot automate away.\n\nFor supply chain professionals specifically, the implication is that AI will increasingly handle the mechanical aspects of our work — data gathering, report generation, anomaly detection, scenario modeling — while humans focus on strategic decisions that require contextual understanding, stakeholder management, and accountability.\n\nConsider the practical implications. A spare parts inventory optimization exercise that previously required a team of analysts spending weeks on data preparation, modeling, and reporting can now be accomplished in hours. The AI handles the heavy lifting of processing historical demand patterns, running optimization algorithms, and generating scenario comparisons. The human supply chain professional then applies judgment: Are the assumptions valid? What risks are not captured in the model? Which recommendation balances cost, service, and resilience appropriately?\n\nThis does not make human expertise obsolete. It makes human expertise more valuable by removing the mechanical drudgery that previously consumed most of our analytical bandwidth. The professional who can effectively collaborate with AI tools — who knows how to frame problems, validate outputs, and apply contextual judgment — will be dramatically more productive than the professional who relies on either AI alone or human effort alone.\n\nFor SSC organizations, this suggests a shift in skill development priorities. Technical skills in data analysis and modeling remain important, but increasingly the differentiator will be the ability to effectively leverage AI tools for rapid analysis while maintaining human oversight and judgment in decision-making.\n\nThe organizations that adapt fastest will be those that recognize the bottleneck has shifted. The constraint is no longer how fast we can process data — it is how wisely we can direct that processing toward the highest-value problems. This is a human question, not an AI question.\n\nFor SSC spare parts management specifically, the practical implication is that demand sensing, inventory optimization, and cost analysis that previously required dedicated analytical resources can now be performed on-demand with AI assistance. The challenge shifts to ensuring that the humans overseeing these AI-driven analyses have the domain expertise and strategic judgment to interpret results correctly and act appropriately. AI handles the number-crunching; humans provide the contextual wisdom that numbers alone cannot capture.",
            chinese: "4月26日，DeepSeek宣布对其整个API定价结构进行大幅调整，将输入缓存命中价格降至原始发布价的十分之一。对于V4系列中的Flash模型，每百万Tokens的成本降至仅0.02元（约0.3美分）。这不是简单的AI厂商价格战——它代表了AI部署经济模式的根本性转变，每个供应链和采购专业人员都必须理解这一变化。\n\n当我们讨论AI变得"便宜"时，需要区分训练成本和推理成本。训练是前期投入——构建一个合格模型所需的大规模计算支出。这仍然极其昂贵。GPT-5.5和DeepSeek-V4各自需要数亿美元的训练计算成本。这笔成本已经沉没，分摊到未来数十亿次推理中。\n\n推理是持续成本——当用户提问或应用程序调用API时实际运行模型所需的计算。这是随使用量线性增长的成本，也正是成本正在暴跌的部分。\n\n每百万Tokens 0.02元的数字值得加以说明。一封典型邮件可能消耗约100个Tokens。一份中等复杂度的文档分析可能需要10,000个Tokens。以此价格计算，通过最先进的语言模型处理一封邮件的成本约为0.002元——几乎可以忽略不计。即使是消耗100,000个Tokens的复杂分析任务，成本也仅约2元。\n\n这对知识工作的单位经济具有深远影响。当处理信息的边际成本趋近于零时，约束条件不再是计算——而是判断力。哪些问题值得解决？哪些分析应该委托进行？哪些结论应该付诸行动？这些问题需要AI无法自动化的判断力。\n\n对于供应链专业人员而言，这意味着AI将越来越多地处理我们工作中的机械部分——数据收集、报告生成、异常检测、情景建模——而人类则专注于需要上下文理解、利益相关者管理和责任担当的战略决策。\n\n考虑实际影响。一项以前需要一组分析师花费数周进行数据准备、建模和报告的备件库存优化工作，现在可以在数小时内完成。AI负责处理大量工作：处理历史需求模式、运行优化算法、生成情景对比。然后人类供应链专业人员应用判断力：假设是否有效？模型未捕捉哪些风险？哪些建议能够适当平衡成本、服务和韧性？\n\n这并没有使人类专业知识过时。它通过消除以前消耗大部分分析带宽的机械性苦差工作，使人类专业知识更有价值。那些能够有效与AI工具协作的人——知道如何构建问题、验证输出、应用上下文判断的人——将比单纯依赖AI或单纯依赖人力的专业人员效率高得多。\n\n对于SSC组织，这表明技能发展重点的转变。数据分析与建模的技术技能仍然重要，但差异化因素将越来越多地转向有效利用AI工具进行快速分析的能力，同时在决策中保持人类监督和判断。\n\n适应最快的组织将是那些认识到瓶颈已经转移的组织。约束条件不再是我们的处理速度有多快——而是我们能够多明智地将处理引导向最高价值的问题。这是一个人类问题，而非AI问题。\n\n对于SSC备件管理具体而言，实际影响是：以前需要专门分析资源进行的需求感知、库存优化和成本分析，现在可以在AI辅助下按需执行。挑战转向确保监督这些AI驱动分析的人类具备必要的领域专业知识和战略判断力，以正确解读结果并适当行动。AI负责数据处理；人类提供上下文智慧，而这是数字本身无法捕获的。",
            vocabulary: [
                {
                    word: "inference cost",
                    meaning: "推理成本；AI模型在实际运行（处理请求）时消耗的计算资源成本，与训练成本相对",
                    example: "As API pricing drops, the inference cost per query approaches near-zero for most business applications."
                },
                {
                    word: "marginal cost",
                    meaning: "边际成本；每增加一个单位产出所增加的成本，趋近于零时意味着规模效应极强",
                    example: "When the marginal cost of AI inference approaches zero, the unit economics of knowledge work transform fundamentally."
                },
                {
                    word: "unit economics",
                    meaning: "单位经济/单位成本结构；计算单个产品或服务的成本与收入关系，评估商业模式可持续性",
                    example: "Understanding the unit economics of spare parts storage helps determine optimal inventory levels."
                },
                {
                    word: "bottleneck",
                    meaning: "瓶颈；限制整体系统性能的关键约束点",
                    example: "In the AI era, the bottleneck shifts from computation to human judgment about which problems to solve."
                },
                {
                    word: "judgment",
                    meaning: "判断力；基于经验、专业知识和上下文理解做出明智决策的能力，AI难以自动化",
                    example: "AI can process data at scale, but strategic decisions require human judgment that accounts for organizational context."
                }
            ],
            practice: [
                {
                    question: "According to the article, why does the drop in AI inference costs represent a fundamental shift rather than just a price war?",
                    options: [
                        "Because it enables AI companies to undercut competitors",
                        "Because it transforms the unit economics of knowledge work by making the marginal cost of information processing approach zero",
                        "Because it reduces the cost of training large language models",
                        "Because it makes AI companies more profitable"
                    ],
                    answer: 1
                },
                {
                    question: "What does the article suggest will be the new bottleneck in knowledge work as AI inference costs approach zero?",
                    options: [
                        "Computing power availability",
                        "Data storage capacity",
                        "Human judgment about which problems to solve and which conclusions to act upon",
                        "Network bandwidth for transmitting data"
                    ],
                    answer: 2
                },
                {
                    question: "What skill shift does the article suggest is needed for SSC supply chain professionals?",
                    options: [
                        "Learning to code in Python",
                        "Memorizing more supply chain formulas",
                        "Developing ability to effectively leverage AI tools while maintaining human oversight and judgment",
                        "Reducing dependence on data-driven decision making"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-28', label: '2026-04-28（今日）'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
