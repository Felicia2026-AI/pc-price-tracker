<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月18日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/18 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"Micron's announcement of a 25% DRAM price increase for Q3, following Samsung's 30% hike in Q2, signals that the memory supercycle will extend into the second half. We need to reassess our full-year parts cost budget and lock in Q3 orders before the window closes.\"",
            chinese: "美光宣布Q3 DRAM价格上涨25%，继三星Q2涨价30%之后，这表明存储超级周期将延续至下半年。我们需要重新评估全年备件成本预算，并在窗口关闭前锁定Q3订单。",
            meaning: "supercycle：超级周期。reassess：重新评估。full-year budget：全年预算。lock in：锁定。window closes：窗口关闭。",
            example: "Given the extended supercycle, we need to reassess our procurement strategy and lock in pricing for the remainder of the year."
        };

        // 今日学习内容 - 供应商谈判与合同管理
        const todayContent = {
            english: "Supplier negotiation and contract management are critical competencies for supply chain cost professionals, particularly in volatile markets where component prices can fluctuate dramatically quarter over quarter. The difference between an average negotiator and a skilled one can translate to millions of dollars in cost savings—or cost overruns—over the course of a fiscal year.\n\nEffective supplier negotiation begins long before the actual negotiation meeting. Preparation is everything. This means understanding not just your own requirements and constraints, but also the supplier's position, market dynamics, and alternative options available to both parties.\n\nThe first step in preparation is to clearly define your objectives. What are your must-haves versus nice-to-haves? What is your walk-away price? What are your alternatives if this negotiation fails? Having clarity on these points before entering the room gives you confidence and prevents emotional decision-making during the negotiation.\n\nUnderstanding the supplier's perspective is equally important. What are their cost structures? What pressures are they facing? What are their strategic priorities? A supplier who is desperate for volume to fill capacity may be more flexible on price than one who is capacity-constrained. Similarly, a supplier who views you as a strategic customer for their new product line may offer better terms than one who sees you as a transactional buyer.\n\nMarket intelligence provides crucial context. Current spot prices, industry forecasts, competitor actions, and macroeconomic trends all influence the negotiation landscape. In the memory market, for example, understanding the supply-demand balance, fab utilization rates, and technology transition timelines can give you significant leverage in price discussions.\n\nThe negotiation itself is both an art and a science. Skilled negotiators understand that it's not a zero-sum game. The best outcomes often come from creative solutions that address both parties' underlying interests rather than just splitting the difference on price.\n\nSeveral tactics can be effective in supplier negotiations. Anchoring—making the first offer—can set the reference point for the entire discussion. However, this requires confidence that your anchor is defensible and not so aggressive that it damages the relationship.\n\nConcessions should be planned and traded, not given away freely. When you make a concession, ask for something in return. This maintains the principle of reciprocity and prevents the negotiation from becoming one-sided.\n\nSilence can be a powerful tool. After making a proposal or receiving an offer, resist the urge to fill the silence. The other party may feel compelled to improve their position just to break the uncomfortable quiet.\n\nBATNA—Best Alternative to a Negotiated Agreement—is your most important source of power. The better your alternatives, the stronger your negotiating position. This is why developing multiple supplier relationships and maintaining competitive tension is so important.\n\nContract management is the discipline that ensures negotiated agreements deliver their intended value. A well-negotiated contract is worthless if it's not properly implemented and monitored.\n\nKey contract elements for supply chain agreements include pricing mechanisms, volume commitments, delivery terms, quality standards, and intellectual property protections. Each of these requires careful attention to detail and clear definition to prevent disputes later.\n\nPricing mechanisms can take various forms. Fixed pricing provides certainty but may not reflect market changes. Index-based pricing adjusts according to market indicators but requires agreement on the index and adjustment formula. Cost-plus pricing provides transparency but may not incentivize supplier efficiency. The right mechanism depends on the specific circumstances and risk allocation preferences.\n\nVolume commitments create obligations for both parties. Buyers commit to purchase minimum quantities; suppliers commit to provide capacity and prioritize the buyer's orders. These commitments need to be realistic and account for demand uncertainty.\n\nPerformance metrics and service level agreements (SLAs) define expected standards and consequences for non-performance. On-time delivery rates, quality defect rates, and response times are common metrics. The key is to measure what matters and to have clear remedies when standards are not met.\n\nContract administration involves monitoring performance against the agreement, managing changes and amendments, and maintaining the relationship with the supplier. Regular business reviews provide opportunities to discuss performance, address issues, and identify improvement opportunities.\n\nFor organizations like Lenovo's SSC, supplier negotiation and contract management are particularly challenging given the scale and complexity of the supply base. Hundreds of suppliers, thousands of parts, and volatile market conditions create a dynamic environment that requires sophisticated capabilities.\n\nThe investment in negotiation and contract management capabilities pays dividends. Organizations with mature practices consistently achieve better pricing, more favorable terms, and stronger supplier relationships than those that treat these activities as purely transactional. In a market where component prices can swing 30% or more in a single quarter, these capabilities are not just nice to have—they are essential for cost competitiveness.",
            chinese: "供应商谈判和合同管理是供应链成本专业人员的关键能力，特别是在组件价格可能每季度大幅波动的动荡市场中。普通谈判者和熟练谈判者之间的差异可能在一个财政年度内转化为数百万美元的成本节约——或成本超支。\n\n有效的供应商谈判在实际谈判会议之前很久就开始了。准备就是一切。这意味着不仅要了解你自己的要求和限制，还要了解供应商的立场、市场动态以及双方可用的替代方案。\n\n准备的第一步是明确界定你的目标。什么是你的必须条件，什么是锦上添花？你的退出价格是多少？如果这次谈判失败，你的替代方案是什么？在进入会议室之前对这些要点有清晰的认识会给你信心，并防止在谈判期间做出情绪化决定。\n\n理解供应商的视角同样重要。他们的成本结构是什么？他们面临什么压力？他们的战略优先事项是什么？一个急需产量来填补产能的供应商可能比一个产能受限的供应商在价格上更灵活。同样，一个将你视为其新产品线战略客户的供应商可能比一个将你视为交易性买家的供应商提供更好的条款。\n\n市场情报提供关键背景。当前现货价格、行业预测、竞争对手行动和宏观经济趋势都会影响谈判格局。例如，在内存市场，了解供需平衡、晶圆厂利用率和技术转型时间表可以在价格讨论中给你显著的杠杆作用。\n\n谈判本身既是一门艺术也是一门科学。熟练的谈判者明白这不是零和游戏。最好的结果往往来自创造性的解决方案，解决双方的根本利益，而不仅仅是在价格上折中。\n\n有几种策略在供应商谈判中可能有效。锚定——先出价——可以为整个讨论设定参考点。然而，这需要对你的锚点是可辩护的有信心，而不是过于激进以至于损害关系。\n\n让步应该被计划和交换，而不是免费赠送。当你做出让步时，要求一些回报。这维持了互惠原则，防止谈判变得一边倒。\n\n沉默可以是一个强大的工具。在提出建议或收到报价后，抵制填补沉默的冲动。对方可能觉得有必要改善他们的立场，只是为了打破不舒服的安静。\n\nBATNA——谈判协议的最佳替代方案——是你最重要的权力来源。你的替代方案越好，你的谈判地位就越强。这就是为什么发展多个供应商关系并保持竞争张力如此重要。\n\n合同管理是确保谈判协议实现其预期价值的学科。一个谈判良好的合同如果实施和监控不当，就毫无价值。\n\n供应链协议的关键合同要素包括定价机制、数量承诺、交货条款、质量标准和知识产权保护。这些都需要仔细关注细节和明确定义，以防止以后发生争议。\n\n定价机制可以采取各种形式。固定定价提供确定性，但可能无法反映市场变化。基于指数的定价根据市场指标调整，但需要对指数和调整公式达成一致。成本加成定价提供透明度，但可能无法激励供应商提高效率。正确的机制取决于具体情况和风险分配偏好。\n\n数量承诺为双方创造义务。买家承诺购买最低数量；供应商承诺提供产能并优先考虑买家的订单。这些承诺需要现实，并考虑需求不确定性。\n\n绩效指标和服务水平协议（SLA）定义预期标准和未达到绩效的后果。准时交货率、质量缺陷率和响应时间是常见指标。关键是衡量重要的内容，并在未达到标准时有明确的补救措施。\n\n合同管理涉及监控协议执行情况、管理变更和修订，以及与供应商保持关系。定期业务审查提供了讨论绩效、解决问题和识别改进机会的机会。\n\n对于联想SSC这样的组织，鉴于供应基础的规模和复杂性，供应商谈判和合同管理尤其具有挑战性。数百家供应商、数千个零件和动荡的市场条件创造了一个需要复杂能力的动态环境。\n\n对谈判和合同管理能力的投资会带来回报。具有成熟实践的组织始终比那些将这些活动视为纯粹交易性的组织获得更好的定价、更有利的条款和更强的供应商关系。在一个组件价格可能在一个季度内波动30%或更多的市场中，这些能力不仅是锦上添花——它们对于成本竞争力至关重要。",
            vocabulary: [
                {
                    word: "BATNA",
                    meaning: "谈判协议的最佳替代方案（Best Alternative to a Negotiated Agreement）；谈判失败时的最佳选择",
                    example: "Our BATNA is to source from the secondary market, which gives us leverage in negotiations."
                },
                {
                    word: "anchoring",
                    meaning: "锚定效应；谈判中先提出一个参考点来影响后续讨论的策略",
                    example: "We used anchoring by opening with an aggressive but defensible price point."
                },
                {
                    word: "cost-plus pricing",
                    meaning: "成本加成定价；基于供应商成本加上一定利润率的定价方式",
                    example: "Cost-plus pricing provides transparency but doesn't incentivize supplier efficiency improvements."
                },
                {
                    word: "service level agreement (SLA)",
                    meaning: "服务水平协议；定义服务标准和绩效指标的合同条款",
                    example: "Our SLA requires 98% on-time delivery with penalties for non-compliance."
                },
                {
                    word: "competitive tension",
                    meaning: "竞争张力；通过维持多个供应商选择来创造谈判优势",
                    example: "We maintain competitive tension by qualifying at least two suppliers for each critical component."
                }
            ],
            practice: [
                {
                    question: "What does BATNA stand for and why is it important in negotiations?",
                    options: [
                        "Best Annual Total Negotiation Amount - it sets the budget for negotiations",
                        "Best Alternative to a Negotiated Agreement - it provides leverage and confidence",
                        "Business Agreement Terms and Negotiation Approach - it defines the negotiation strategy",
                        "Budget Allocation for Negotiation Activities - it determines available resources"
                    ],
                    answer: 1
                },
                {
                    question: "What is the anchoring tactic in negotiations?",
                    options: [
                        "Refusing to make any concessions during the negotiation",
                        "Making the first offer to set the reference point for discussion",
                        "Always accepting the supplier's first offer to build goodwill",
                        "Focusing exclusively on price rather than other terms"
                    ],
                    answer: 1
                },
                {
                    question: "Why is cost-plus pricing considered transparent but potentially problematic?",
                    options: [
                        "It doesn't allow for any profit margin for the supplier",
                        "It provides visibility into costs but may not incentivize efficiency",
                        "It requires too much documentation and administrative overhead",
                        "It only works for commodities, not custom components"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-18', label: '2026-04-18（今日）'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
