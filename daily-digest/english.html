<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月15日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/15 18:00:00';

        // 今日短语
        const todayPhrase = {
            english: "\"With spot prices trending down but contract prices firm, we need to lock in our Q2 volume commitment before the pricing window closes.\"",
            chinese: "随着现货价格下跌但合约价格坚挺，我们需要在定价窗口关闭前锁定Q2的量价承诺。",
            meaning: "lock in：锁定，锁定价格或数量以避免未来波动风险。pricing window：定价窗口，指供应商接受特定报价的有效时间段。理解这两个概念对于采购时机决策至关重要。",
            example: "The DRAM pricing window is expected to close by end of April—we should lock in our HBM volume commitment with SK Hynix this week."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 供应链风险管理与成本优化
        const todayContent = {
            english: "Supply chain risk management has become a critical discipline for procurement teams in the semiconductor and memory industry. With spot prices trending downward while contract prices remain firm, timing the lock-in of volume commitments has become both an art and a science.\n\nThe first principle of risk management is diversification. No single supplier should account for more than 40% of your total component spend—this prevents over-reliance on any one vendor's pricing decisions or production issues. Lenovo SSC's strategy of qualifying Yangtze Memory Technologies (YMTC) for SSD supply while maintaining Samsung and SK Hynix partnerships exemplifies this principle. Diversification not only reduces supply risk but also creates competitive tension that can be leveraged during price negotiations.\n\nThe second principle is the strategic use of framework agreements. These long-term contracts, typically spanning 18-24 months, lock in pricing, allocation volumes, and supply commitments in exchange for volume guarantees from the buyer. The key to successful framework agreements lies in the price adjustment mechanism—linking contract prices to market indices like TrendForce quarterly averages can protect both parties from extreme volatility. For Lenovo SSC, framework agreements with tier-one DRAM suppliers provide cost predictability essential for annual budgeting and margin protection.\n\nThe third principle is maintaining operational flexibility through buffer inventory. While just-in-time inventory minimizes carrying costs, the current supply uncertainty makes a modest safety stock strategically valuable. The optimal buffer level depends on your supply lead times, demand volatility, and the cost of stockouts versus the cost of capital tied up in inventory. Many procurement teams target 2-4 weeks of safety stock for critical components.\n\nFinally, continuous market intelligence gathering is non-negotiable. Weekly tracking of spot prices, monthly review of contract price forecasts from multiple sources, and quarterly supplier meetings to discuss roadmap alignment form the backbone of an effective risk management program. The goal is not to predict the market perfectly but to make better-informed decisions faster than competitors.\n\nFor cost managers at Lenovo SSC, these principles translate into concrete actions: qualifying alternative suppliers, negotiating framework agreements with favorable adjustment clauses, right-sizing inventory buffers, and maintaining robust market intelligence capabilities.",
            chinese: "供应链风险管理已成为半导体和存储行业采购团队的关键能力。随着现货价格下跌但合约价格坚挺，锁定量价承诺的时机选择已成为一门艺术和科学。\n\n风险管理的第一个原则是多元化。任何单一供应商都不应占你总零部件支出的40%以上——这可以避免过度依赖任何供应商的定价决策或生产问题。联想SSC通过认证长江存储（YMTC）作为SSD供应来源，同时保持与三星和SK海力士的合作，正是这一原则的体现。多元化不仅降低供应风险，还创造了竞争张力，可在价格谈判中加以利用。\n\n第二个原则是战略性使用框架协议。这些通常跨度18-24个月的长期合同，通过买方的量价保证来锁定价格、分配量和供应承诺。成功的框架协议关键在于价格调整机制——将合同价格与TrendForce季度均价等市场指数挂钩，可以保护双方免受极端波动的影响。对于联想SSC来说，与一级DRAM供应商的框架协议提供了年度预算和利润保护所必需的成本可预测性。\n\n第三个原则是通过缓冲库存保持运营灵活性。虽然准时制库存将持有成本降至最低，但当前的供应不确定性使适度的安全库存在战略上具有价值。最优缓冲水平取决于你的供应交货周期、需求波动性以及缺货成本与库存占用资金成本的权衡。许多采购团队针对关键零部件设定2-4周的安全库存目标。\n\n最后，持续收集市场情报是不可妥协的。每周跟踪现货价格、每月审查多个来源的合约价格预测、每季度与供应商召开会议讨论路线图对齐，是有效风险管理计划的基础。目标不是完美预测市场，而是比竞争对手更快做出更好的信息驱动决策。\n\n对于联想SSC的成本经理来说，这些原则转化为具体行动：认证替代供应商、谈判具有有利调整条款的框架协议、正确调整库存缓冲规模，以及保持强大的市场情报能力。",
            vocabulary: [
                {
                    word: "lock in",
                    meaning: "锁定；锁定价格、数量或承诺以避免未来风险",
                    example: "We should lock in our Q2 DRAM volume commitment before the pricing window closes at the end of April."
                },
                {
                    word: "pricing window",
                    meaning: "定价窗口；供应商接受特定报价的有效时间段",
                    example: "The NAND pricing window typically opens at the beginning of each quarter and closes 2-3 weeks later."
                },
                {
                    word: "framework agreement",
                    meaning: "框架协议；定义长期合作条款和条件的合同",
                    example: "Our 2-year framework agreement with Samsung provides price stability in exchange for volume commitment."
                },
                {
                    word: "safety stock",
                    meaning: "安全库存；为应对供应中断或需求波动而保持的额外库存",
                    example: "We maintain 3 weeks of safety stock for DDR5 modules to protect against supply disruptions."
                },
                {
                    word: "just-in-time (JIT)",
                    meaning: "准时制；一种库存管理策略，最大限度减少库存持有成本",
                    example: "While JIT reduces inventory costs, it increases vulnerability to supply shocks—hence the need for safety stock."
                }
            ],
            practice: [
                {
                    question: "What is the recommended maximum percentage of total component spend from a single supplier?",
                    options: [
                        "20%",
                        "40%",
                        "60%",
                        "80%"
                    ],
                    answer: 1
                },
                {
                    question: "Why is it important to link contract prices to market indices in framework agreements?",
                    options: [
                        "To make the supplier richer",
                        "To protect both parties from extreme price volatility",
                        "To complicate the contract terms",
                        "To reduce the buyer's purchasing volume"
                    ],
                    answer: 1
                },
                {
                    question: "What does 'lock in' mean in the context of procurement?",
                    options: [
                        "To physically store products in a warehouse",
                        "To secure pricing or volume commitments before conditions change",
                        "To increase the order quantity",
                        "To cancel existing supplier contracts"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-15', label: '2026-04-15（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
