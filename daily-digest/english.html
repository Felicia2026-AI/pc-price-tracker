<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 今日学习内容 - 云算力涨价与供应链成本管理
        const todayContent = {
            english: "The global cloud computing industry has entered a historic inflection point in 2026. For the first time in nearly two decades, major cloud providers — including Alibaba Cloud, Baidu AI Cloud, and Tencent Cloud — have collectively raised their AI compute pricing, with increases reaching as high as 456% for certain GPU instance types. This reversal of the long-standing 'race to the bottom' pricing model signals a fundamental shift: AI compute is transitioning from a commoditized utility into a scarce, strategic resource.\n\nThe root cause is straightforward: demand for AI training and inference capacity is outpacing supply. Nvidia's H100 and H200 GPUs remain in chronic shortage, and High Bandwidth Memory (HBM) — the specialized chip that makes modern AI accelerators possible — continues to face severe supply constraints from Samsung, SK Hynix, and Micron. Morgan Stanley's latest research warns that as frontier AI models achieve 'capability step-changes', enterprise AI deployment needs will 'systemically exceed' available compute supply through the remainder of 2026.\n\nFor supply chain cost managers in the technology sector, this cloud pricing surge has direct operational implications. First, any AI-assisted forecasting or analytics tools deployed on cloud infrastructure will see cost increases that must be factored into budget planning. Second, the same hardware scarcity driving cloud price hikes will continue to put upward pressure on server-grade memory and storage spare parts — the core components in any technology company's after-sales service parts inventory. Proactive contract-based procurement and forward-looking safety stock strategies are no longer optional; they are competitive necessities.",
            chinese: "2026年，全球云计算行业迎来历史性拐点。近二十年来，阿里云、百度智能云、腾讯云等主要云服务商首次集体上调AI算力定价，部分GPU实例类型涨幅高达456%。这一持续多年的"价格竞争到底"模式的逆转，标志着一个根本性转变：AI算力正从商品化的公共事业转变为稀缺的战略性资源。\n\n根本原因不难理解：AI训练和推理容量的需求正超过供给。英伟达H100和H200 GPU持续严重短缺，而使现代AI加速器得以运行的专用芯片——高带宽内存（HBM）——来自三星、SK海力士和美光的供应依然极为紧张。摩根士丹利最新研究警告称，随着前沿AI模型实现"能力阶跃式突破"，企业AI部署需求将在2026年剩余时间内"系统性超越"可用算力供给。\n\n对于技术领域的供应链成本管理人员而言，这波云服务涨价具有直接的运营影响。首先，部署在云基础设施上的任何AI辅助预测或分析工具都将面临成本上涨，必须纳入预算规划。其次，推动云价格上涨的同一硬件稀缺性，也将继续对服务器级内存和存储备件造成上行压力——这些都是任何科技公司售后服务备件库存的核心组件。主动签订合约采购和前瞻性安全库存策略不再是可选项，而是竞争必需。",
            vocabulary: [
                {
                    word: "inflection point",
                    meaning: "拐点；事物发展轨迹发生根本性转变的时刻",
                    example: "The collective price hike by major cloud providers marks a clear inflection point for the AI compute market."
                },
                {
                    word: "race to the bottom",
                    meaning: "竞相压低（价格）；各方为争夺市场份额而不断降低标准或价格的竞争模式",
                    example: "The 20-year race to the bottom in cloud pricing has officially ended in 2026."
                },
                {
                    word: "supply constraint",
                    meaning: "供给约束；因供应不足而限制产品或服务可获得性的状况",
                    example: "HBM supply constraints are the primary driver of AI compute price increases."
                },
                {
                    word: "capability step-change",
                    meaning: "能力阶跃式突变；性能或功能的非线性、跳跃式提升",
                    example: "Morgan Stanley warns that AI capability step-changes will cause demand to systemically exceed supply."
                },
                {
                    word: "safety stock",
                    meaning: "安全库存；为应对需求波动或供应中断而持有的额外缓冲库存",
                    example: "A forward-looking safety stock strategy is essential when key components face chronic shortages."
                }
            ],
            practice: [
                {
                    question: "According to the passage, why have cloud providers raised AI compute prices in 2026?",
                    options: [
                        "Due to increased operational overhead and energy costs only",
                        "Because AI compute demand is outpacing supply, driven by GPU and HBM shortages",
                        "In response to government regulations on cloud pricing",
                        "Because competition among cloud providers has decreased"
                    ],
                    answer: 1
                },
                {
                    question: "What does the author recommend for supply chain cost managers facing hardware scarcity?",
                    options: [
                        "Switch entirely to on-premises infrastructure to avoid cloud costs",
                        "Reduce AI tool usage to minimize cloud spending",
                        "Adopt proactive contract-based procurement and forward-looking safety stock strategies",
                        "Wait for prices to decrease before making procurement decisions"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
