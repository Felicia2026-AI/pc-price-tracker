<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:06';

        // 今日短语
        const todayPhrase = {
            english: "\"With DDR5 spot prices breaking through the ¥500 psychological level, this creates a buying window for non-critical components. However, we should lock in our Q4 requirements before the HBM4 production ramp-up tightens DDR5 supply in August-September.\"",
            chinese: "随着DDR5现货价格跌破500元心理关口，这为非关键零部件创造了采购窗口。但我们应在HBM4量产拉升导致DDR5供应收紧前（8-9月前），锁定Q4需求。",
            meaning: "breaking through the psychological level：突破心理关口，指价格跌破重要整数位引发市场情绪变化。buying window：采购窗口，指市场价格或供应条件有利的短期机会。lock in：锁定，指通过合约或预购确保未来的采购价格和供应。",
            example: "The DRAM spot market has dropped to ¥12, creating a short-term buying window. We're planning to lock in our Q2 notebook memory requirements through long-term contracts to avoid the anticipated supply tightness in Q3."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 库存周期管理与采购策略
        const todayContent = {
            english: "In the complex world of supply chain management, understanding inventory cycles and their implications for procurement strategy is fundamental to maintaining operational efficiency while controlling costs.\n\nThe inventory cycle refers to the time period from when raw materials are procured until finished goods are sold. In the PC industry, this cycle typically spans 6-12 weeks, depending on component availability, manufacturing lead times, and channel distribution. For the SSC (Service & Support Cost) team, managing the inventory cycle of spare parts is particularly challenging because demand is driven by product failure rates rather than consumer purchasing patterns.\n\nInventory days of supply (DOS) is a key metric for measuring inventory health. It indicates how many days of inventory are on hand to meet current demand. A high DOS suggests overstocking and potential obsolescence risk, while a low DOS indicates potential stockout risk. For PC spare parts, the optimal DOS varies by component criticality: critical components like motherboards may require 8-10 weeks of safety stock, while non-critical items like cables may only need 4-6 weeks.\n\nBuffer stock and safety stock serve different purposes in inventory management. Buffer stock refers to additional inventory held above theoretical requirements to absorb demand variability or supply disruptions. It's typically used for high-value components or items with long lead times. Safety stock, on the other hand, is the minimum inventory level maintained to prevent stockouts under normal demand fluctuations. The formula for calculating safety stock typically considers demand variability, lead time variability, and the desired service level.\n\nThe recent Gartner report highlighting extended PC inventory cycles from 5 to 6 weeks in Q2 2026 has significant implications for procurement strategy. When inventory cycles extend, companies face higher carrying costs, increased obsolescence risk, and greater capital tied up in inventory. For SSC, this means we need to recalibrate our safety stock levels and potentially renegotiate terms with suppliers to allow for more flexible inventory commitments.\n\nProcurement strategy during inventory cycle extensions should focus on several key areas: first, demand forecasting accuracy must improve to avoid over-ordering; second, supplier relationships become critical to ensure priority allocation during tight supply periods; third, inventory monitoring systems need real-time visibility to trigger alerts when stock levels approach critical thresholds; fourth, disposition strategies for slow-moving inventory should be pre-planned rather than reactive.\n\nThe concept of inventory velocity is equally important. High inventory velocity means products move quickly through the supply chain, reducing holding costs and minimizing obsolescence risk. Strategies to improve inventory velocity include just-in-time delivery, demand-driven replenishment, and channel-stuffing reduction. For spare parts specifically, improving inventory velocity requires close coordination with service operations to match parts availability with actual repair demand patterns.\n\nFrom an SSC perspective, the key takeaway is that inventory management is not a set-it-and-forget-it discipline. It requires continuous monitoring, forecasting refinement, and strategic supplier engagement. The current market conditions—extended inventory cycles, DDR5 price volatility, and HBM4 supply uncertainties—demand a more sophisticated approach to spare parts inventory management that balances service level requirements with cost efficiency.",
            chinese: "在复杂的供应链管理领域，理解库存周期及其对采购策略的影响，是保持运营效率和控制成本的基础。\n\n库存周期是指从原材料采购到成品销售的整个时间段。在PC行业，这一周期通常跨越6-12周，取决于零部件可用性、生产交付周期和渠道分销情况。对于SSC（服务与支持成本）团队而言，备件库存周期管理尤其具有挑战性，因为需求是由产品故障率而非消费者购买模式驱动的。\n\n库存天数（DOS）是衡量库存健康状况的关键指标。它表示满足当前需求所需的库存天数。DOS高意味着库存过剩和潜在过时风险，而DOS低则表示潜在的缺货风险。对于PC备件，最优DOS因零部件关键程度而异：关键零部件（如主板）可能需要8-10周的安全库存，而Cable等非关键物料可能仅需4-6周。\n\n缓冲库存和安全库存在库存管理中服务不同目的。缓冲库存是指在理论需求之上持有的额外库存，用于吸收需求变化或供应中断。它通常用于高价值零部件或交付周期较长的物料。另一方面，安全库存是指为防止正常需求波动下的缺货而维持的最低库存水平。安全库存计算公式通常考虑需求可变性、交付周期可变性和所需服务水平。\n\nGartner最近报告显示2026年Q2全球PC库存周期从5周拉长至6周，这对采购策略具有重要影响。当库存周期拉长时，公司面临更高的持有成本、更大的过时风险，以及被库存占用的更多资金。对SSC而言，这意味着我们需要重新校准安全库存水平，并可能与供应商重新谈判条款，以允许更灵活的库存承诺。\n\n库存周期拉长期间的采购策略应聚焦几个关键领域：首先，需求预测准确性必须提高以避免过量订购；其次，供应商关系变得至关重要，以确保在供应紧张时期的优先分配；第三，库存监控系统需要实时可见性，在库存水平接近临界阈值时触发警报；第四，滞销库存处置策略应预先计划而非被动反应。\n\n库存周转速度的概念同样重要。高库存周转速度意味着产品快速通过供应链，降低持有成本并最大限度减少过时风险。提高库存周转速度的策略包括准时制交付、需求驱动补货和减少渠道囤货。具体到备件，提高库存周转速度需要与服务商密切协调，将零部件可用性与实际维修需求模式相匹配。\n\n从SSC的角度来看，关键要点是：库存管理不是一劳永逸的学科。它需要持续监控、预测优化和战略性供应商合作。当前市场状况——库存周期拉长、DDR5价格波动和HBM4供应不确定性——要求采用更复杂的备件库存管理方法，在服务水平要求和成本效率之间取得平衡。",
            vocabulary: [
                {
                    word: "inventory cycle / DOS",
                    meaning: "库存周期/库存天数；衡量库存周转速度的关键指标",
                    example: "Our current inventory DOS has extended to 6 weeks, indicating we need to review our safety stock policies."
                },
                {
                    word: "buffer stock",
                    meaning: "缓冲库存；在理论需求之上持有的额外库存，用于应对供应中断",
                    example: "We're building buffer stock for critical NPU components due to the uncertain supply situation in Q3."
                },
                {
                    word: "safety stock",
                    meaning: "安全库存；防止正常需求波动下缺货的最低库存水平",
                    example: "The safety stock calculation considers both demand variability and lead time fluctuations."
                },
                {
                    word: "inventory velocity",
                    meaning: "库存周转速度；产品通过供应链的速度，高速度降低持有成本",
                    example: "Improving inventory velocity from 6 weeks to 4 weeks would reduce our carrying costs by approximately 15%."
                },
                {
                    word: "demand-driven replenishment",
                    meaning: "需求驱动补货；基于实际需求而非预测进行库存补充的策略",
                    example: "We've implemented a demand-driven replenishment system that automatically triggers orders when inventory falls below threshold."
                }
            ],
            practice: [
                {
                    question: "According to the Gartner report, what happened to global PC inventory cycles in Q2 2026?",
                    options: [
                        "Inventory cycles shortened from 5 to 4 weeks",
                        "Inventory cycles extended from 5 to 6 weeks",
                        "Inventory cycles remained stable at 5 weeks",
                        "Inventory cycles extended from 4 to 6 weeks"
                    ],
                    answer: 1
                },
                {
                    question: "What is the difference between 'buffer stock' and 'safety stock'?",
                    options: [
                        "They are the same thing with different names",
                        "Buffer stock handles normal demand fluctuations; safety stock addresses supply disruptions",
                        "Buffer stock addresses supply disruptions; safety stock handles normal demand fluctuations",
                        "Buffer stock is for non-critical items; safety stock is for critical items"
                    ],
                    answer: 2
                },
                {
                    question: "Why is 'inventory velocity' important for SSC?",
                    options: [
                        "It helps predict product failure rates",
                        "Higher velocity reduces carrying costs and minimizes obsolescence risk",
                        "It determines supplier payment terms",
                        "It measures employee productivity"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
