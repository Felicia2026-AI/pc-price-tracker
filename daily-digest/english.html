<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习 - 周末特辑</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读 - AI in Supply Chain</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日 星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"With the ThinkPad 2026 launch just 5 days away, we need to accelerate our spare parts certification process for the new models. The X1 Carbon and X9-15p SKUs require immediate attention to ensure smooth inventory planning and avoid any supply chain disruptions during the launch window.\"",
            chinese: "随着ThinkPad 2026发布会还有5天，我们需要加快新机型的备件认证流程。X1 Carbon和X9-15p的SKU需要立即关注，以确保库存规划顺畅，避免发布会期间出现任何供应链中断。",
            meaning: "launch window：发布窗口期。accelerate：加速。certification process：认证流程。SKU：库存单位。supply chain disruptions：供应链中断。",
            example: "We accelerated our certification process for the new ThinkPad models to avoid any supply chain disruptions during the launch window."
        };

        // 今日学习内容 - AI in Supply Chain
        const todayContent = {
            english: "The integration of artificial intelligence into supply chain management represents one of the most transformative developments in modern business operations. As organizations grapple with increasing complexity, globalization, and customer expectations, AI offers unprecedented opportunities to optimize operations, reduce costs, and improve service levels.\n\nUnderstanding AI's Role in Modern Supply Chains\n\nArtificial intelligence encompasses a broad range of technologies that enable machines to mimic human cognitive functions such as learning, reasoning, and problem-solving. In supply chain contexts, AI applications range from demand forecasting and inventory optimization to supplier selection and risk management.\n\nThe foundation of AI in supply chains is data. Modern supply chains generate vast amounts of data from multiple sources: enterprise resource planning systems, Internet of Things sensors, transportation management systems, and customer relationship management platforms. AI algorithms excel at processing these large, complex datasets to identify patterns and generate insights that would be impossible for humans to discover manually.\n\nMachine learning, a subset of AI, enables systems to improve automatically through experience. In supply chain applications, machine learning models can analyze historical demand patterns, weather data, economic indicators, and social media signals to generate highly accurate demand forecasts. These forecasts inform inventory decisions, production planning, and transportation scheduling.\n\nPredictive analytics represents another powerful AI application. By analyzing historical data and identifying correlations, predictive models can anticipate potential disruptions before they occur. For example, AI can predict supplier delivery delays based on carrier performance data, weather patterns, and geopolitical events, allowing organizations to take proactive mitigation measures.\n\nNatural language processing enables AI systems to understand and generate human language. In supply chain contexts, NLP can analyze supplier contracts, extract key terms and conditions, and identify potential risks. Chatbots powered by NLP can handle routine customer inquiries, freeing human agents to focus on more complex issues.\n\nComputer vision, another AI technology, enables machines to interpret visual information. In warehouses, computer vision systems can verify product quality, track inventory movements, and optimize storage layouts. Autonomous vehicles and drones equipped with computer vision are revolutionizing transportation and last-mile delivery operations.\n\nAI is also transforming procurement and supplier management. Intelligent spend analysis tools can categorize and analyze procurement data to identify savings opportunities. AI-powered supplier scorecards can evaluate supplier performance across multiple dimensions, from quality and delivery to sustainability and financial stability.\n\nThe implementation of AI in supply chains requires careful planning and change management. Organizations must ensure data quality and accessibility, invest in appropriate technology infrastructure, and develop the organizational capabilities to leverage AI insights effectively.\n\nDespite the challenges, the potential benefits of AI in supply chain management are substantial. Companies that successfully implement AI can expect improved forecast accuracy, reduced inventory costs, enhanced supplier performance, and better customer service. As AI technologies continue to evolve, their applications in supply chain management will only expand, making AI literacy an essential skill for supply chain professionals.\n\nFor finance professionals working with supply chain teams, understanding AI capabilities and limitations is increasingly important. AI-generated forecasts and recommendations often require financial validation and risk assessment. Budgeting for AI implementations requires understanding both the upfront investment and ongoing operational costs. And measuring the return on investment from AI initiatives demands financial expertise combined with operational knowledge.\n\nThe future of supply chain management is undeniably intertwined with artificial intelligence. Organizations that embrace AI while maintaining strong fundamentals in financial management, supplier relationships, and operational excellence will be best positioned to thrive in an increasingly complex and competitive global marketplace.",
            chinese: "人工智能与供应链管理的融合代表了现代商业运营中最具变革性的发展之一。随着组织应对日益增加的复杂性、全球化和客户期望，人工智能为优化运营、降低成本和提高服务水平提供了前所未有的机会。\n\n理解人工智能在现代供应链中的作用\n\n人工智能涵盖广泛的技术，使机器能够模仿学习、推理和解决问题等人类认知功能。在供应链领域，人工智能应用涵盖从需求预测和库存优化到供应商选择和风险管理的各个方面。\n\n供应链中人工智能的基础是数据。现代供应链从多个来源生成大量数据：企业资源规划系统、物联网传感器、运输管理系统和客户关系管理平台。人工智能算法擅长处理这些大型复杂数据集，以识别人类手动无法发现的模式和洞察。\n\n机器学习是人工智能的一个子集，使系统能够通过经验自动改进。在供应链应用中，机器学习模型可以分析历史需求模式、天气数据、经济指标和社交媒体信号，以生成高度准确的需求预测。这些预测为库存决策、生产规划和运输调度提供信息。\n\n预测分析代表了另一个强大的人工智能应用。通过分析历史数据和识别相关性，预测模型可以在潜在中断发生之前预见它们。例如，人工智能可以根据承运商绩效数据、天气模式，地缘政治事件预测供应商交货延迟，使组织能够采取积极的缓解措施。\n\n自然语言处理使人工智能系统能够理解和生成人类语言。在供应链环境中，NLP可以分析供应商合同，提取关键条款和条件，并识别潜在风险。由NLP驱动的聊天机器人可以处理常规客户查询，使人工代理能够专注于更复杂的问题。\n\n计算机视觉是另一种人工智能技术，使机器能够解释视觉信息。在仓库中，计算机视觉系统可以验证产品质量、跟踪库存移动并优化存储布局。配备计算机视觉的自动驾驶汽车和无人机正在彻底改变运输和最后一公里配送运营。\n\n人工智能也在改变采购和供应商管理。智能支出分析工具可以对采购数据进行分类和分析，以识别节省机会。由人工智能驱动的供应商记分卡可以评估供应商在多个维度上的绩效，从质量和交付到可持续性和财务稳定性。\n\n供应链中人工智能的实施需要仔细的规划和变革管理。组织必须确保数据质量和可访问性，投资适当的技术基础设施，并培养有效利用人工智能洞察的组织能力。\n\n尽管面临挑战，人工智能在供应链管理中的潜在利益是实质性的。成功实施人工智能的公司可以预期提高预测准确性、降低库存成本、增强供应商绩效和改善客户服务。随着人工智能技术的不断发展，其在供应链管理中的应用只会扩大，使人工智能素养成为供应链专业人员的必备技能。\n\n对于与供应链团队合作的财务专业人员来说，了解人工智能的能力和局限性越来越重要。人工智能生成的预测和建议通常需要财务验证和风险评估。为人工智能实施编制预算需要了解前期投资和持续运营成本。衡量人工智能举措的投资回报需要结合运营知识的财务专业知识。\n\n供应链管理的未来无疑与人工智能交织在一起。在日益复杂和竞争激烈的全球市场中，拥抱人工智能同时保持财务管理、供应商关系和卓越运营强大基础的组织将处于最佳位置。",
            vocabulary: [
                {
                    word: "predictive analytics",
                    meaning: "预测分析；使用历史数据和统计模型预测未来趋势的技术",
                    example: "Predictive analytics helped us anticipate the supplier delay and secure alternative sources."
                },
                {
                    word: "natural language processing",
                    meaning: "自然语言处理（NLP）；使计算机能够理解和生成人类语言的人工智能分支",
                    example: "NLP-powered chatbots handle 80% of routine customer inquiries without human intervention."
                },
                {
                    word: "computer vision",
                    meaning: "计算机视觉；使机器能够解释和理解图像/视频的人工智能技术",
                    example: "Computer vision systems in our warehouse verify product quality in real-time."
                },
                {
                    word: "demand forecasting",
                    meaning: "需求预测；预测未来客户需求以指导库存和生产的商业实践",
                    example: "Accurate demand forecasting reduced our inventory holding costs by 25%."
                },
                {
                    word: "supply chain disruptions",
                    meaning: "供应链中断；供应链中任何导致货物/服务流动中断的意外事件",
                    example: "We developed contingency plans to mitigate supply chain disruptions from geopolitical risks."
                }
            ],
            practice: [
                {
                    question: "What is the foundation of AI applications in supply chain management?",
                    options: [
                        "Advanced robotics and automation",
                        "Large amounts of data from multiple sources",
                        "Cloud computing infrastructure",
                        "Blockchain technology for traceability"
                    ],
                    answer: 1
                },
                {
                    question: "How does machine learning improve demand forecasting in supply chains?",
                    options: [
                        "By replacing human planners entirely",
                        "By analyzing data to identify patterns humans might miss",
                        "By reducing the need for historical data",
                        "By eliminating the need for IT infrastructure"
                    ],
                    answer: 1
                },
                {
                    question: "Why is AI literacy becoming essential for supply chain professionals?",
                    options: [
                        "AI will replace all supply chain jobs",
                        "AI-generated outputs require human validation and interpretation",
                        "AI is only useful for IT departments",
                        "AI regulations require certification"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
