<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习 2026-04-13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date">2026年4月13日 星期一</div>
            <div class="update-time">每日10:00自动更新</div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 今日学习内容 - 联想蝉联PC市场第一（4月13日）
        const todayContent = {
            english: "Lenovo has solidified its position as the world's leading PC manufacturer with an impressive Q1 2026 performance that outpaced market expectations by a significant margin. According to IDC's latest market tracking data released on April 8, 2026, Lenovo shipped 16.5 million PCs in Q1, representing a year-over-year growth of 8.6% that substantially exceeded the market average of 2.5%.\n\nThis performance translated into a market share of 25.2%, extending Lenovo's lead as the number one PC vendor globally. Analysts attribute this success to multiple factors: the ongoing Windows refresh cycle that began in late 2025, anticipatory purchasing driven by expected component price increases, and the company's aggressive push into the AI PC segment ahead of the ThinkPad 2026 product launch scheduled for April 22.\n\nFor supply chain cost managers at Lenovo's Services Group China (SSC), this growth story presents both opportunities and challenges. On the opportunity side, higher shipment volumes typically translate into better leverage when negotiating component contracts. On the challenge side, sustained component price inflation—particularly in DRAM, where TrendForce forecasts another 58-63% contract price increase in Q2—puts pressure on margins and requires increasingly sophisticated cost management strategies.",
            chinese: "联想以令人印象深刻的2026年第一季度表现巩固了其全球领先PC制造商的地位，出货量增速远超市场预期。根据IDC于2026年4月8日发布的最新市场追踪数据，联想在Q1出货1650万台PC，同比增长8.6%，大幅超越市场平均水平2.5%。\n\n这一表现为联想带来了25.2%的市场份额，进一步巩固了其全球第一PC厂商的地位。分析师将这一成功归因于多重因素：始于2025年末的Windows换机周期、零部件涨价预期驱动的提前采购，以及公司抢先布局AI PC领域的积极举措——4月22日ThinkPad 2026新品发布会渐近。\n\n对于联想SSC的成本管理人员而言，这一增长故事既带来机遇也带来挑战。从机遇角度看，更高的出货量通常意味着在谈判组件合同时拥有更大的议价筹码。从挑战角度看，持续的零部件价格通胀——尤其是TrendForce预测Q2 DRAM合约价将再涨58-63%——给利润率带来压力，需要越来越复杂的成本管理策略。",
            vocabulary: [
                {
                    word: "market share",
                    meaning: "市场份额；指某公司销售额或出货量占行业总量的比例",
                    example: "Lenovo extended its market share to 25.2% in Q1 2026."
                },
                {
                    word: "year-over-year (YoY)",
                    meaning: "同比增长；与去年同期相比的变化百分比",
                    example: "Lenovo achieved 8.6% YoY growth in PC shipments."
                },
                {
                    word: "component price inflation",
                    meaning: "零部件价格通胀；零部件成本持续上涨的现象",
                    example: "Sustained component price inflation pressures profit margins."
                },
                {
                    word: "contract price",
                    meaning: "合约价；供应商与客户之间长期合同约定的价格",
                    example: "DRAM contract prices are expected to rise 58-63% in Q2."
                },
                {
                    word: "cost management strategy",
                    meaning: "成本管理策略；用于控制和管理企业运营成本的系统性方法",
                    example: "Sophisticated cost management strategies are essential during price volatility."
                }
            ],
            practice: [
                {
                    question: "By how much did Lenovo's PC shipments grow year-over-year in Q1 2026?",
                    options: [
                        "2.5%",
                        "8.6%",
                        "16.5%",
                        "25.2%"
                    ],
                    answer: 1
                },
                {
                    question: "According to analysts, what is a challenge for Lenovo's SSC due to the growth in shipments?",
                    options: [
                        "Decreased leverage in component negotiations",
                        "Sustained component price inflation pressures on margins",
                        "Reduced demand for AI PCs",
                        "Lower market share compared to competitors"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-13', label: '2026-04-13（今日）'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
