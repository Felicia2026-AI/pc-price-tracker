<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月16日星期四';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/16 09:58';

        // 今日短语
        const todayPhrase = {
            english: "\"With NAND contract prices expected to compress from 55-65% to 45-50% growth in Q2, we should recalibrate our cost forecast and explore spot market opportunities for non-critical components.\"",
            chinese: "随着NAND合约价Q2涨幅预期从55-65%收窄至45-50%，我们应该重新校准成本预测，并为非关键零部件探索现货市场机会。",
            meaning: "recalibrate：重新校准、重新调整，以适应新情况。explore spot market opportunities：探索现货市场机会，指在现货市场寻找更优惠的采购价格。理解成本预测的动态调整机制对采购决策至关重要。",
            example: "Given the softening smartphone demand, we've recalibrated our Q2 NAND cost forecast downward by 8% and are now exploring spot market purchases for consumer-grade components."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - BOM成本管理与产品定价策略
        const todayContent = {
            english: "In the highly competitive PC industry, Bill of Materials (BOM) cost management and product pricing strategy are tightly intertwined disciplines that directly impact a company's profitability and market positioning.\n\nThe fundamental challenge lies in the cost-price gap. When component costs rise faster than product prices—as happened with DDR5 memory, SSDs, and new NPU chips in 2026—manufacturers face a difficult choice: absorb the cost increase (hurting margins), pass it on to customers (risking demand destruction), or find a middle path through value engineering and component optimization.\n\nConsider Lenovo's situation with the ThinkPad X1 Carbon 2026 launch. The BOM cost increased approximately 22% due to three key drivers: DDR5 modules now represent 18% of total BOM cost (up 5 percentage points), a new NPU chip accounts for 22% (previously nonexistent), and SSD costs rose 3 percentage points to 15%. However, the retail price only increased 12%, creating a 10-percentage-point gap that Lenovo must absorb through operational efficiency, volume leverage, or alternative cost savings.\n\nValue engineering is a critical tool for bridging this gap. This systematic approach involves analyzing each component's function relative to its cost, then finding ways to deliver the same function at lower cost or enhanced function at the same cost. Common strategies include: component standardization (using the same part across multiple product lines to achieve volume economics), design simplification (eliminating unnecessary features that don't contribute to customer value), and supplier-driven innovation (encouraging suppliers to propose cost-saving alternatives during design phase).\n\nFor the SSC (Service & Support Cost) team, BOM cost increases have downstream implications. When product margins compress, companies often reduce warranty periods, tighten service level agreements, or increase spare parts pricing—all of which impact after-sales service profitability. The SSC team must proactively model these scenarios and develop mitigation strategies, such as negotiating extended warranty terms with suppliers or optimizing spare parts inventory to reduce carrying costs.\n\nThe key insight is that BOM cost management is not just a product development responsibility—it's a cross-functional discipline that requires close collaboration between R&D, procurement, finance, and service teams. At Lenovo SSC, this means actively participating in product planning meetings, challenging cost assumptions, and developing service-related cost models that inform commercial decisions.\n\nIn today's rapidly evolving technology landscape, where AI capabilities are becoming a key differentiator, BOM management also increasingly involves evaluating the cost-benefit trade-offs of AI integration. The NPU chip in the ThinkPad X1 Carbon 2026 is a prime example: while adding 22% to BOM cost, it enables AI features that justify premium pricing and potentially improve long-term customer retention.",
            chinese: "在竞争激烈的PC行业，物料清单（BOM）成本管理与产品定价策略是紧密相关的学科，直接影响公司的盈利能力和市场定位。\n\n根本挑战在于成本-价格差距。当零部件成本上涨速度快于产品价格——如2026年DDR5内存、SSD和新NPU芯片的情况——制造商面临艰难选择：吸收成本上涨（损害利润）、转嫁给客户（可能破坏需求），或通过价值工程和零部件优化找到中间路径。\n\n以联想ThinkPad X1 Carbon 2026为例。BOM成本因三个关键因素上涨约22%：DDR5模组现在占BOM总成本的18%（上升5个百分点），新NPU芯片占22%（之前不存在），SSD成本上升3个百分点至15%。然而，零售价仅上调12%，产生了联想必须通过运营效率、体量杠杆或替代成本节约来吸收的10个百分点差距。\n\n价值工程是弥合这一差距的关键工具。这种系统性方法涉及分析每个零部件功能相对于其成本的价值，然后找到以更低成本实现相同功能或以相同成本实现增强功能的方法。常见策略包括：零部件标准化（在多个产品线中使用相同零件以实现体量经济）、设计简化（消除对客户价值贡献不大的不必要功能）、供应商驱动的创新（在设计阶段鼓励供应商提出节约成本的替代方案）。\n\n对于SSC（服务与支持成本）团队，BOM成本上涨具有下游影响。当产品利润压缩时，公司通常会缩短保修期、收紧服务水平协议或提高备件价格——所有这些都会影响售后服务盈利能力。SSC团队必须主动建模这些情景并制定缓解策略，如与供应商谈判延长保修期或优化备件库存以降低持有成本。\n\n关键洞察是，BOM成本管理不仅仅是产品开发的责任——它是一门需要研发、采购、财务和服务团队密切协作的跨职能学科。在联想SSC，这意味着积极参与产品规划会议、质疑成本假设，并开发为商业决策提供信息的服务相关成本模型。\n\n在当今快速发展的技术格局中，AI能力正成为关键差异化因素，BOM管理也越来越多地涉及评估AI整合的成本效益权衡。ThinkPad X1 Carbon 2026中的NPU芯片就是一个典型例子：虽然使BOM成本增加22%，但它支持AI功能，可证明溢价定价的合理性，并可能提高长期客户留存。",
            vocabulary: [
                {
                    word: "Bill of Materials (BOM)",
                    meaning: "物料清单；列出产品所需所有零部件及其成本的清单",
                    example: "The BOM for ThinkPad X1 Carbon 2026 shows a 22% cost increase, driven primarily by DDR5 and NPU chips."
                },
                {
                    word: "value engineering",
                    meaning: "价值工程；通过系统分析在保持功能的同时降低成本的方法",
                    example: "Through value engineering, we reduced the hinge assembly cost by 15% while maintaining durability standards."
                },
                {
                    word: "absorb the cost increase",
                    meaning: "吸收成本上涨；公司承担零部件成本上涨而非转嫁给客户",
                    example: "We decided to absorb a 5% material cost increase rather than raise product prices during a competitive launch period."
                },
                {
                    word: "margin compression",
                    meaning: "利润压缩；因成本上升或价格下降导致利润率收窄",
                    example: "Margin compression in the consumer PC segment has forced many vendors to focus on premium products and services."
                },
                {
                    word: "cost-benefit trade-off",
                    meaning: "成本效益权衡；比较一项投资的成本与其带来的收益",
                    example: "The NPU chip presents a clear cost-benefit trade-off: higher BOM cost but enables AI features that justify premium pricing."
                }
            ],
            practice: [
                {
                    question: "What happened to Lenovo's ThinkPad X1 Carbon 2026 retail price increase compared to its BOM cost increase?",
                    options: [
                        "Retail price increased more than BOM cost",
                        "Retail price increase matched BOM cost increase exactly",
                        "Retail price increase was less than BOM cost increase",
                        "Retail price decreased while BOM cost increased"
                    ],
                    answer: 2
                },
                {
                    question: "What is 'value engineering' in the context of cost management?",
                    options: [
                        "Hiring more engineers to reduce labor costs",
                        "Eliminating engineering features to save money",
                        "Systematically analyzing components to deliver same function at lower cost",
                        "Outsource engineering work to lower-cost countries"
                    ],
                    answer: 2
                },
                {
                    question: "What does 'margin compression' mean for a company?",
                    options: [
                        "Expanding profit margins through higher sales",
                        "Reducing the workforce to cut costs",
                        "Experiencing reduced profitability due to cost increases or price pressure",
                        "Compressing the product size to save materials"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据（快照文件需加../前缀）
        const historyDates = [
            {date: '2026-04-16', label: '2026-04-16（快照）'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接（快照文件需加../前缀）
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
