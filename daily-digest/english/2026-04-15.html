<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月15日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/15 10:15';

        // 今日短语
        const todayPhrase = {
            english: "\"With IDC revising the 2026 PC market forecast upward to 6.2% growth, we need to front-load our spare parts procurement to capture the buying window before Q3 demand surge. Let's also lock in Q3 SSD supply contracts before NAND contract prices rise further.\"",
            chinese: "随着IDC将2026年PC市场预测上调至6.2%增长，我们需要在Q3需求高峰前提速备件采购以抓住采购窗口。同时，在NAND合约价进一步上涨前锁定Q3 SSD供应协议。",
            meaning: "revising upward：上调预测，指调整数字或预期向更高方向变动。front-load：前置，指将活动或资源安排在计划前期执行。lock in：锁定，指通过合约确保未来的价格和供应。",
            example: "Given the revised demand forecast, we're planning to front-load our Q2 notebook component orders to secure allocation before the peak season. We're also looking to lock in pricing through long-term agreements with our key suppliers."
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 今日学习内容 - 供应商谈判与采购策略
        const todayContent = {
            english: "In the fast-paced world of component procurement, supplier negotiation skills are essential for cost management and supply security. The ability to negotiate effectively with suppliers can mean the difference between a profitable product launch and a costly supply chain disruption.\n\nSupplier relationship management (SRM) forms the foundation of successful procurement. Modern SRM goes beyond transactional purchasing to build strategic partnerships with key suppliers. These partnerships are characterized by mutual trust, shared risk, and collaborative problem-solving. For the SSC (Service & Support Cost) team, strong supplier relationships are particularly valuable because spare parts demand is often unpredictable and requires flexible response from suppliers.\n\nThe concept of total cost of ownership (TCO) is critical in supplier negotiations. TCO includes not just the unit price, but also logistics costs, quality costs, inventory holding costs, and the cost of potential supply disruptions. A lower unit price may actually result in higher TCO if it leads to longer lead times, lower quality, or increased inventory requirements. When negotiating with suppliers, always consider the full TCO picture rather than focusing solely on unit price.\n\nVolume commitment and flexibility are key negotiation variables. Suppliers typically offer better pricing in exchange for volume commitments, but these commitments can create risk if demand forecasts are inaccurate. The modern approach is to negotiate frame contracts with flexible volume bands—typically plus or minus 20-30% from the committed volume. This provides price benefits while maintaining operational flexibility. For SSC, where demand is driven by product failure rates rather than planned production, flexible commitments are essential.\n\nLead time optimization is another critical negotiation point. Shorter lead times provide operational flexibility but usually come at a cost premium. The optimal approach is to negotiate differentiated lead times for different component categories: standard lead times for stable-demand items, and expedited lead times with premium pricing for critical or high-uncertainty components. This tiered approach balances cost and flexibility.\n\nQuality specifications must be clearly defined in supplier agreements. Vague quality requirements lead to disputes, returns, and increased costs. The best practice is to establish objective, measurable quality standards including defect rates, inspection criteria, and rejection procedures. For spare parts specifically, quality consistency is paramount because a defective spare part can damage customer relationships and increase warranty costs far beyond the part's purchase price.\n\nSupply chain risk management should be integrated into supplier negotiations. This includes identifying single-source components, negotiating alternate sourcing options, and establishing business continuity plans with key suppliers. The recent global supply chain disruptions have highlighted the importance of supply chain resilience. For SSC, having backup suppliers or emergency sourcing channels for critical spare parts is essential for maintaining service level agreements.\n\nThe concept of collaborative forecasting has gained traction in supplier relationships. By sharing demand forecasts with suppliers, companies can help suppliers better plan their production and inventory, which often results in better pricing and availability. However, collaborative forecasting requires trust and data-sharing agreements that protect proprietary information while enabling supply chain coordination.\n\nStrategic sourcing is a systematic approach to procurement that analyzes spend data, market conditions, and supplier capabilities to optimize the supplier base. For the SSC team, strategic sourcing can identify opportunities to consolidate spare parts suppliers, standardize components across product lines, and leverage volume for better pricing. The goal is to create a supplier portfolio that balances cost, quality, risk, and innovation.\n\nIn today's dynamic market environment, successful supplier negotiation requires a combination of market knowledge, analytical skills, and relationship management. The SSC team must stay informed about component market trends, understand the supplier's cost structure and margin pressures, and build relationships that enable collaborative problem-solving. By mastering these skills, procurement professionals can create value that extends far beyond the unit price savings achieved at the negotiation table.",
            chinese: "在快节奏的零部件采购世界中，供应商谈判技巧对于成本管理和供应保障至关重要。与供应商有效谈判的能力，可能意味着产品发布的盈利与供应链中断的高成本之间的差异。\n\n供应商关系管理（SRM）是成功采购的基础。现代SRM超越交易性采购，与关键供应商建立战略伙伴关系。这些伙伴关系的特点是相互信任、风险共担和协作解决问题。对于SSC（服务与支持成本）团队而言，强有力的供应商关系尤其有价值，因为备件需求通常不可预测，需要供应商的灵活响应。\n\n总拥有成本（TCO）的概念在供应商谈判中至关重要。TCO不仅包括单价，还包括物流成本、质量成本、库存持有成本和潜在供应中断成本。如果低价导致更长的交付周期、更低的质量或更高的库存需求，实际上可能导致更高的TCO。在与供应商谈判时，应始终考虑完整的TCO情况，而非仅关注单价。\n\n数量承诺和灵活性是关键的谈判变量。供应商通常会为数量承诺提供更好的价格，但这些承诺如果需求预测不准确就会带来风险。现代方法是谈判带有灵活数量区间的框架合同——通常为承诺数量的正负20-30%。这既提供价格优惠又保持运营灵活性。对于SSC而言，由于需求由产品故障率而非计划生产驱动，灵活的承诺至关重要。\n\n交付周期优化是另一个关键谈判点。更短的交付周期提供运营灵活性，但通常需要支付溢价。最佳方法是针对不同零部件类别谈判差异化的交付周期：稳定需求的物料采用标准交付周期，关键或高不确定性物料采用溢价加急交付。这种分层方法在成本和灵活性之间取得平衡。\n\n质量规格必须在供应商协议中明确界定。模糊的质量要求会导致争议、退货和成本增加。最佳实践是建立客观、可测量的质量标准，包括不良率、检验标准和拒收程序。对于备件而言，质量一致性至关重要，因为有缺陷的备件可能损害客户关系，增加远超零部件采购价格的保修成本。\n\n供应链风险管理应纳入供应商谈判。这包括识别单一来源零部件、谈判替代采购选项，以及与关键供应商建立业务连续性计划。近期全球供应链中断凸显了供应链韧性的重要性。对于SSC，为关键备件提供备用供应商或紧急采购渠道对于维持服务水平协议至关重要。\n\n协作预测的概念在供应商关系中越来越受关注。通过与供应商共享需求预测，公司可以帮助供应商更好地规划其生产和库存，这通常会带来更好的价格和可用性。然而，协作预测需要信任和数据共享协议，在保护专有信息的同时实现供应链协调。\n\n战略采购是一种系统化的采购方法，通过分析支出数据、市场状况和供应商能力来优化供应商基础。对于SSC团队，战略采购可以识别整合备件供应商、跨产品线标准化零部件以及利用量价优势的机会。目标是创建一个在成本、质量、风险和创新之间取得平衡的供应商组合。\n\n在当今动态的市场环境中，成功的供应商谈判需要市场知识、分析技能和关系管理的结合。SSC团队必须了解零部件市场趋势，理解供应商的成本结构和利润压力，并建立能够实现协作解决问题的关系。掌握这些技能，采购专业人员可以创造远超谈判桌上实现的单位价格节约的价值。",
            vocabulary: [
                {
                    word: "supplier relationship management (SRM)",
                    meaning: "供应商关系管理；与供应商建立和维护战略性伙伴关系的系统方法",
                    example: "Our SRM program has helped us secure priority allocation from key component suppliers during tight supply periods."
                },
                {
                    word: "total cost of ownership (TCO)",
                    meaning: "总拥有成本；采购决策中考虑的所有相关成本的综合衡量",
                    example: "The lower unit price from Supplier B actually resulted in higher TCO due to increased logistics and quality costs."
                },
                {
                    word: "frame contract / flexible commitment",
                    meaning: "框架合同/灵活承诺；带有数量灵活区间的长期采购协议",
                    example: "We've negotiated a frame contract with flexible commitments of plus or minus 25% to balance pricing and inventory risk."
                },
                {
                    word: "collaborative forecasting",
                    meaning: "协作预测；与供应商共享需求预测以改善供应链协调的做法",
                    example: "Through collaborative forecasting with our top suppliers, we've reduced lead times by 15% while maintaining competitive pricing."
                },
                {
                    word: "strategic sourcing",
                    meaning: "战略采购；系统性分析和优化供应商基础以实现最佳采购结果的方法",
                    example: "Strategic sourcing analysis helped us identify consolidation opportunities that saved 12% on our annual component spend."
                }
            ],
            practice: [
                {
                    question: "What is the key characteristic of modern Supplier Relationship Management (SRM)?",
                    options: [
                        "Focusing solely on unit price negotiation",
                        "Building strategic partnerships with mutual trust and shared risk",
                        "Minimizing communication with suppliers",
                        "Avoiding long-term commitments"
                    ],
                    answer: 1
                },
                {
                    question: "Why should TCO (Total Cost of Ownership) be considered instead of just unit price?",
                    options: [
                        "Unit prices are always accurate",
                        "Lower unit prices always mean lower total costs",
                        "TCO includes hidden costs like logistics, quality, and inventory that can make a 'lower' unit price more expensive overall",
                        "TCO is only relevant for consumer products"
                    ],
                    answer: 2
                },
                {
                    question: "What is the advantage of 'frame contracts with flexible commitment' over fixed volume contracts?",
                    options: [
                        "They guarantee the lowest possible price",
                        "They eliminate all supply chain risks",
                        "They provide price benefits while maintaining operational flexibility to adjust volumes",
                        "They require no negotiation"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-15', label: '2026-04-15（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
