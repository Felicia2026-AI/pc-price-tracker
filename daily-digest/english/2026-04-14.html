<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月13日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/13 18:00:00';

        // 今日学习内容 - 库存管理与需求预测
        const todayContent = {
            english: "Effective inventory management is the cornerstone of supply chain cost control, particularly in the PC spare parts industry where component obsolescence and price volatility present constant challenges. The fundamental principle is balancing service levels against carrying costs—holding too much inventory ties up working capital and risks write-downs when parts become obsolete, while holding too little risks stockouts that can disrupt customer service and damage relationships.\n\nDemand forecasting in the PC repair ecosystem requires sophisticated multi-dimensional modeling. Unlike new product sales, spare parts demand is driven by failure rates, warranty expirations, and product lifecycle stages. For critical components like motherboards and LCD panels—which represent 80-90% of repair costs—forecasting must incorporate: historical failure rate data by product line, seasonal patterns in repair volume, upcoming warranty cliff events, and planned product end-of-life announcements. Advanced organizations use machine learning models that continuously refine predictions based on actual consumption patterns.\n\nSafety stock optimization is particularly crucial given the current DRAM and NAND price volatility. Traditional safety stock formulas assume stable lead times and demand patterns, but today's storage market requires dynamic adjustment. When prices are rising rapidly, increasing safety stock before further price hikes can generate significant cost savings. Conversely, when spot prices are falling faster than contract prices, minimizing inventory exposure becomes the priority. This requires close coordination between procurement, finance, and repair operations teams.",
            chinese: "有效的库存管理是供应链成本控制的基石，特别是在PC备件行业，零部件过时和价格波动带来持续挑战。基本原则是在服务水平和持有成本之间取得平衡——库存过多会占用营运资金，并在零部件过时时面临减值风险；库存过少则面临缺货风险，可能中断客户服务并损害关系。\n\nPC维修生态系统中的需求预测需要复杂的多维建模。与新产品销售不同，备件需求由故障率、保修到期和产品生命周期阶段驱动。对于主板和LCD面板等关键零部件——占维修成本的80-90%——预测必须纳入：按产品线的历史故障率数据、维修量的季节性模式、即将到来的保修到期高峰，以及计划的产品停产公告。先进的组织使用机器学习模型，根据实际消耗模式持续优化预测。\n\n鉴于当前DRAM和NAND价格波动，安全库存优化尤为关键。传统安全库存公式假设稳定的交货期和需求模式，但今天的存储市场需要动态调整。当价格快速上涨时，在进一步涨价前增加安全库存可以产生显著的成本节约。相反，当现货价格跌幅超过合约价格时，最小化库存敞口成为优先事项。这需要采购、财务和维修运营团队之间的密切协调。",
            vocabulary: [
                {
                    word: "carrying costs",
                    meaning: "持有成本；维持库存所产生的成本，包括资金占用、仓储、保险和贬值风险",
                    example: "High carrying costs led the company to implement just-in-time inventory practices."
                },
                {
                    word: "stockouts",
                    meaning: "缺货/断货；库存耗尽无法满足客户需求的情况",
                    example: "Stockouts of critical components can result in significant customer dissatisfaction."
                },
                {
                    word: "warranty cliff",
                    meaning: "保修到期高峰；大量产品同时过保导致维修需求激增的时间点",
                    example: "We need to prepare for the warranty cliff when the 2023 laptop models expire next quarter."
                },
                {
                    word: "safety stock",
                    meaning: "安全库存；为应对需求波动和供应不确定性而持有的额外库存",
                    example: "The procurement team increased safety stock levels ahead of the anticipated price hike."
                },
                {
                    word: "inventory exposure",
                    meaning: "库存敞口；因持有库存而面临的价格下跌或贬值风险",
                    example: "When spot prices are falling, minimizing inventory exposure becomes critical to avoid losses."
                }
            ],
            practice: [
                {
                    question: "According to the passage, what is the fundamental principle of inventory management?",
                    options: [
                        "Maximizing inventory levels to ensure availability",
                        "Balancing service levels against carrying costs",
                        "Minimizing all inventory regardless of service impact",
                        "Focusing only on procurement cost reduction"
                    ],
                    answer: 1
                },
                {
                    question: "What factors should be considered when forecasting demand for PC spare parts?",
                    options: [
                        "Only historical sales data",
                        "Failure rates, warranty expirations, and product lifecycle stages",
                        "Marketing campaigns and advertising spend",
                        "Competitor pricing strategies"
                    ],
                    answer: 1
                },
                {
                    question: "How should safety stock strategy adapt during periods of rapidly rising prices?",
                    options: [
                        "Reduce safety stock to minimize exposure",
                        "Increase safety stock before further price hikes",
                        "Keep safety stock constant regardless of market conditions",
                        "Eliminate safety stock entirely"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-13', label: '2026-04-13（今日）'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
