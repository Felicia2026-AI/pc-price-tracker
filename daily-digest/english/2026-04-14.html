<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 10:00:00';

        // 今日学习内容 - 供应商谈判策略与合同管理
        const todayContent = {
            english: "Strategic supplier negotiation is a critical competency for supply chain cost management professionals, particularly in volatile markets characterized by component shortages and price volatility. The foundation of effective negotiation lies in thorough preparation: understanding your organization's true requirements, analyzing market conditions, researching supplier alternatives, and establishing clear walk-away positions before entering discussions. In the current DRAM and NAND market environment, where prices have experienced unprecedented volatility, negotiation leverage often shifts between buyers and suppliers depending on inventory cycles and demand forecasts.\n\nOne powerful technique is the multi-year framework agreement with price adjustment mechanisms. Rather than fixing prices for the entire contract term, sophisticated agreements incorporate quarterly or semi-annual price reviews based on objective market indices such as TrendForce contract pricing or spot market averages. This approach provides suppliers with volume certainty while protecting buyers from extreme price spikes. Additionally, these agreements should include capacity reservation clauses, ensuring that suppliers allocate specific production capacity to your organization even during supply-constrained periods.\n\nAnother essential element is the strategic use of alternative suppliers and dual-sourcing strategies. While single-sourcing may offer short-term cost advantages through volume discounts, it creates significant supply risk. For critical components like DDR5 memory modules, maintaining relationships with at least two qualified suppliers provides negotiation leverage and supply continuity insurance. When engaging in supplier discussions, presenting credible alternative options—even if not immediately exercised—strengthens your negotiating position and often yields better terms without actually switching suppliers.",
            chinese: "战略供应商谈判是供应链成本管理专业人员的关键能力，特别是在以零部件短缺和价格波动为特征的不稳定市场中。有效谈判的基础在于充分准备：了解组织的真实需求、分析市场状况、研究替代供应商，并在进入讨论前建立明确的退出底线。在当前DRAM和NAND市场环境中，价格经历了前所未有的波动，谈判杠杆往往在买方和供应商之间转移，取决于库存周期和需求预测。\n\n一种强有力的技术是带有价格调整机制的多年框架协议。不是为整个合同期限固定价格，而是复杂的协议纳入基于客观市场指数的季度或半年度价格审查，如TrendForce合约价格或现货市场均价。这种方法为供应商提供销量确定性，同时保护买方免受极端价格飙升的影响。此外，这些协议应包括产能预留条款，确保供应商即使在供应受限期间也为您的组织分配特定生产能力。\n\n另一个关键要素是战略性地使用替代供应商和双源采购策略。虽然单一采购可能通过批量折扣提供短期成本优势，但它创造了重大供应风险。对于DDR5内存模块等关键零部件，与至少两家合格供应商保持关系可提供谈判杠杆和供应连续性保障。在与供应商讨论时，提出可信的替代方案——即使不立即执行——也能加强您的谈判地位，并经常在无需实际更换供应商的情况下获得更好的条款。",
            vocabulary: [
                {
                    word: "walk-away position",
                    meaning: "退出底线/ walk-away立场；谈判中可接受的最低条件，低于此条件则终止谈判",
                    example: "Before the negotiation, we established a clear walk-away position based on our budget constraints."
                },
                {
                    word: "framework agreement",
                    meaning: "框架协议；规定长期合作基本条款的协议，通常包含价格调整机制和产能预留条款",
                    example: "We signed a three-year framework agreement with quarterly price review mechanisms."
                },
                {
                    word: "capacity reservation clause",
                    meaning: "产能预留条款；合同中确保供应商在供应紧张期间为买方保留特定生产能力的条款",
                    example: "The capacity reservation clause ensured supply continuity even during the DRAM shortage."
                },
                {
                    word: "dual-sourcing strategy",
                    meaning: "双源采购策略；同时从两家或多家供应商采购同一零部件以降低供应风险的策略",
                    example: "Implementing a dual-sourcing strategy for critical components reduced our supply risk significantly."
                },
                {
                    word: "negotiation leverage",
                    meaning: "谈判杠杆/谈判筹码；在谈判中获得优势地位的能力或资源",
                    example: "Having qualified alternative suppliers gave us significant negotiation leverage during contract renewal."
                }
            ],
            practice: [
                {
                    question: "According to the passage, what is the foundation of effective supplier negotiation?",
                    options: [
                        "Aggressive bargaining tactics",
                        "Thorough preparation including market analysis and walk-away positions",
                        "Long-term personal relationships with suppliers",
                        "Accepting the first offer to maintain goodwill"
                    ],
                    answer: 1
                },
                {
                    question: "What type of price adjustment mechanism is recommended for multi-year framework agreements?",
                    options: [
                        "Fixed prices for the entire contract term",
                        "Quarterly or semi-annual reviews based on objective market indices",
                        "Annual increases tied to inflation only",
                        "No price adjustments allowed"
                    ],
                    answer: 1
                },
                {
                    question: "Why does the passage recommend dual-sourcing for critical components like DDR5 memory?",
                    options: [
                        "It always results in lower prices",
                        "It provides negotiation leverage and supply continuity insurance",
                        "It simplifies inventory management",
                        "It reduces the number of supplier relationships to manage"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
