<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习 2026-04-12</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date">2026年4月12日 星期日</div>
            <div class="update-time">快照存档版本</div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 今日学习内容 - 存储芯片涨价超级周期（4月12日存档）
        const todayContent = {
            english: "The memory chip industry is experiencing what analysts are calling a 'supercycle' not seen since the early 2000s. According to TrendForce's latest research released on April 12, 2026, DRAM contract prices are expected to surge another 58-63% in Q2, building on gains of over 300% for DDR4 and even more dramatic increases for DDR5 since the cycle began in late September 2025.\n\nThe primary driver behind this unprecedented price appreciation is the insatiable demand for AI computing infrastructure. Major cloud providers—Amazon Web Services, Microsoft Azure, Google Cloud, and Alibaba Cloud—are racing to build out AI data centers, each requiring massive quantities of high-bandwidth memory (HBM), server DRAM, and enterprise SSDs.\n\nFor supply chain professionals managing spare parts inventories, this creates both challenges and opportunities. The challenge lies in predicting demand accurately while managing procurement costs. The opportunity lies in developing more sophisticated inventory optimization strategies that account for price volatility. Leading companies are increasingly turning to AI-powered demand forecasting tools that analyze historical patterns, market signals, and supplier capacity data to make more accurate predictions.",
            chinese: "存储芯片行业正经历着分析师所说的自本世纪初以来从未见过的"超级周期"。根据TrendForce集邦咨询于2026年4月12日发布的最新研究，DRAM合约价预计将在第二季度再涨58-63%，延续自2025年9月末本轮周期启动以来DDR4涨幅超300%、DDR5涨幅更甚的强劲走势。\n\n这轮史无前例的价格上涨背后的主要驱动力是人工智能计算基础设施的无止境需求。大型云服务提供商——亚马逊AWS、微软Azure、谷歌云和阿里云——正在竞相建设人工智能数据中心，每个都需要大量的高带宽内存（HBM）、服务器DRAM和企业级SSD。\n\n对于管理备件库存的供应链专业人士而言，这既带来挑战也带来机遇。挑战在于准确预测需求的同时管理采购成本。机遇在于开发更复杂的库存优化策略以应对价格波动。领先企业正越来越多地转向AI驱动的需求预测工具，这些工具通过分析历史模式、市场信号和供应商产能数据来做出更准确的预测。",
            vocabulary: [
                {
                    word: "supercycle",
                    meaning: "超级周期；指某行业经历的超长时间范围的价格上涨或需求增长期",
                    example: "The current DRAM supercycle has driven prices up over 300% since September 2025."
                },
                {
                    word: "high-bandwidth memory (HBM)",
                    meaning: "高带宽内存；一种专为高性能计算设计的先进内存技术",
                    example: "AI data centers require massive quantities of HBM for GPU computing."
                },
                {
                    word: "contract price",
                    meaning: "合约价；供应商与客户之间长期合同约定的价格",
                    example: "DRAM contract prices are expected to surge 58-63% in Q2."
                },
                {
                    word: "demand forecasting",
                    meaning: "需求预测；基于历史数据和市场趋势预测未来需求的做法",
                    example: "AI-powered demand forecasting tools can improve inventory accuracy by 30%."
                },
                {
                    word: "inventory optimization",
                    meaning: "库存优化；在满足服务水平的同时最小化库存成本的策略",
                    example: "Advanced inventory optimization strategies are crucial during price volatility periods."
                }
            ],
            practice: [
                {
                    question: "What is driving the current DRAM price supercycle according to the passage?",
                    options: [
                        "Reduced supply from memory manufacturers",
                        "Insatiable demand for AI computing infrastructure",
                        "Government subsidies for semiconductor production",
                        "Increased consumer demand for gaming PCs"
                    ],
                    answer: 1
                },
                {
                    question: "How are leading companies responding to price volatility in spare parts inventory?",
                    options: [
                        "They are reducing inventory levels to cut costs",
                        "They are switching to cheaper substitute components",
                        "They are using AI-powered demand forecasting tools",
                        "They are negotiating longer payment terms with suppliers"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据（快照文件：去掉自身日期4月12日，链接加../前缀）
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
