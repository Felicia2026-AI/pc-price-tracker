<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 今日学习内容
        const todayContent = {
            english: "Global PC shipments in the first quarter of 2026 reached 65.6 million units, a 2.5% year-over-year increase, according to IDC's preliminary tracking report released on April 9. The modest growth came despite mounting headwinds, including memory shortages, rising logistics costs, and geopolitical disruptions affecting global supply chains.\n\nLenovo continued to dominate the market, shipping 16.5 million units — an 8.6% increase — and extending its market share to 25.2%, up 1.4 percentage points from the same period last year. The company's growth rate was approximately 3.4 times the industry average, underscoring its competitive resilience in a challenging environment.\n\nHowever, IDC warned that the PC industry may face stronger headwinds in the remaining quarters of 2026. Component prices — particularly DRAM and NAND Flash — remain elevated, with contract prices for DDR5 memory expected to rise 58–63% in Q2 on a quarterly basis. These cost pressures are being passed on to end users, with PC system prices projected to increase by 15–20% compared to 2025 levels.\n\nOn the AI front, AI-capable PCs now account for an estimated 35% of global shipments, with industry forecasts pointing to a breakthrough above 50% penetration by year-end. For service supply chain managers, this AI PC transition signals rising demand for higher-value components such as advanced memory modules and fast NVMe SSDs — factors that will directly influence spare parts cost structures going forward.",
            chinese: "据IDC于4月9日发布的初步追踪报告，2026年第一季度全球PC出货量达6560万台，同比增长2.5%。尽管面临内存短缺、物流成本上升以及地缘政治干扰等多重逆风，市场仍实现了温和增长。\n\n联想继续主导市场，出货1650万台（+8.6%），市场份额升至25.2%，较去年同期提升1.4个百分点。联想的增速约为行业均值的3.4倍，充分体现了其在困难环境下的竞争韧性。\n\n然而，IDC警告称，PC行业在2026年余下季度可能面临更大压力。零部件价格——尤其是DRAM和NAND闪存——仍居高位，DDR5内存合约价Q2预计环比上涨58-63%。这些成本压力正在传导至终端用户，PC整机价格预计较2025年水平上涨15-20%。\n\n在AI方面，具备AI能力的PC目前约占全球出货量的35%，行业预测显示年底前渗透率将突破50%。对于服务供应链经理而言，这一AI PC转型趋势意味着对高价值零部件（如先进内存模组和高速NVMe固态硬盘）的需求将持续上升，这将直接影响未来的备件成本结构。",
            vocabulary: [
                {
                    word: "preliminary tracking report",
                    meaning: "初步追踪报告；指研究机构在正式报告发布前提供的初步数据",
                    example: "IDC's preliminary tracking report showed a 2.5% year-over-year increase in PC shipments."
                },
                {
                    word: "mounting headwinds",
                    meaning: "不断加剧的逆风/阻力；指多种不利因素同时加重",
                    example: "The company maintained growth despite mounting headwinds in the supply chain."
                },
                {
                    word: "competitive resilience",
                    meaning: "竞争韧性；指在市场压力下保持竞争优势的能力",
                    example: "Lenovo's competitive resilience helped it outperform the market by 3.4 times."
                },
                {
                    word: "on a quarterly basis",
                    meaning: "按季度计；以季度为计算周期",
                    example: "Contract prices for DDR5 are expected to rise 58-63% on a quarterly basis."
                },
                {
                    word: "spare parts cost structure",
                    meaning: "备件成本结构；描述不同类型备件成本的构成与分布",
                    example: "The AI PC transition will reshape spare parts cost structures for service teams."
                }
            ],
            practice: [
                {
                    question: "According to the passage, what was Lenovo's market share in Q1 2026?",
                    options: [
                        "23.8%",
                        "25.2%",
                        "27.0%",
                        "22.5%"
                    ],
                    answer: 1
                },
                {
                    question: "What does IDC warn about for the rest of 2026?",
                    options: [
                        "AI PC demand will collapse",
                        "Lenovo will lose market share",
                        "PC industry may face stronger headwinds due to rising component costs",
                        "Supply chain disruptions will ease by Q3"
                    ],
                    answer: 2
                }
            ]
        };

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ 正确！</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ 错误，请再试试</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
