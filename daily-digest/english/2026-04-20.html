<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - 英文学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .text-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .english-text {
            font-size: 16px;
            color: #212529;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .chinese-translation {
            font-size: 15px;
            color: #6c757d;
            line-height: 1.8;
            border-top: 2px solid #dee2e6;
            padding-top: 15px;
        }

        .phrase-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .phrase-english {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .phrase-chinese {
            font-size: 15px;
            opacity: 0.9;
        }

        .phrase-example {
            font-size: 14px;
            font-style: italic;
            opacity: 0.85;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 8px;
        }

        .vocabulary-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .vocab-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .vocab-word {
            font-size: 18px;
            font-weight: 700;
            color: #11998e;
            min-width: 150px;
        }

        .vocab-meaning {
            font-size: 15px;
            color: #495057;
            flex: 1;
        }

        .vocab-example {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
            font-style: italic;
        }

        .practice-section {
            background: #fff3cd;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .practice-item {
            margin-bottom: 15px;
        }

        .practice-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #212529;
        }

        .practice-option {
            display: block;
            padding: 8px 12px;
            margin: 5px 0;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .practice-option:hover {
            background: #11998e;
            color: white;
            border-color: #11998e;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #11998e;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #11998e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .vocab-item {
                flex-direction: column;
            }

            .vocab-word {
                min-width: auto;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 英文学习</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">💬 Business English Phrase of the Day</div>
                <div class="phrase-section" id="phraseSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📖 今日阅读</div>
                <div class="text-container">
                    <div class="english-text" id="englishText"></div>
                    <div class="chinese-translation" id="chineseText"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">📝 重点词汇</div>
                <div class="vocabulary-section" id="vocabularySection"></div>
            </div>

            <div class="section">
                <div class="section-title">✍️ 理解练习</div>
                <div class="practice-section" id="practiceSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - 英文学习 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月20日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/20 10:00';

        // 今日短语
        const todayPhrase = {
            english: "\"SK Hynix's mass production of the 192GB SOCAMM2 marks a pivotal shift in the AI server memory landscape. As high-end DRAM capacity is increasingly allocated to AI infrastructure, PC component buyers must act swiftly to secure long-term agreements before the procurement window closes.\"",
            chinese: "SK海力士192GB SOCAMM2的量产标志着AI服务器内存格局的关键转变。随着高端DRAM产能越来越多地被分配给AI基础设施，PC零部件采购方必须迅速行动，在采购窗口关闭之前确保长期协议。",
            meaning: "pivotal shift：关键转变。DRAM capacity：DRAM产能。increasingly allocated to：越来越多地分配给。secure long-term agreements：锁定长期协议。procurement window：采购窗口。",
            example: "We need to secure long-term supply agreements now before the procurement window closes due to the SOCAMM2 capacity allocation shift."
        };

        // 今日学习内容 - AI驱动的供应链技术转型
        const todayContent = {
            english: "The announcement by SK Hynix of mass production of the 192GB SOCAMM2 module marks yet another milestone in the rapid transformation of the memory supply chain driven by artificial intelligence. This development is not merely a product launch—it is a signal of the deepening structural shift in how memory capacity is being allocated across different market segments.\n\nSOCAMM2, which stands for Small Outline Compression Attached Memory Module 2, is a memory form factor specifically designed for high-performance AI computing platforms. Unlike traditional DIMM modules used in conventional PCs and servers, SOCAMM2 uses LPDDR5X technology with a compressed connector interface, enabling thinner, more power-efficient designs that are critical for next-generation AI server architectures such as NVIDIA's Vera Rubin platform.\n\nThe strategic significance of this mass production announcement cannot be overstated. SK Hynix is positioning itself at the forefront of the AI memory race, competing directly with Samsung and Micron. All three major DRAM manufacturers are now in either mass production or advanced validation stages for SOCAMM2, indicating that this technology will become the dominant memory interface for AI servers in the near term.\n\nFor supply chain professionals in the PC components space, this development carries important implications. When leading-edge memory capacity is preferentially allocated to high-margin, high-demand products like SOCAMM2 and HBM, the available supply for conventional PC memory products—DDR5, LPDDR5X for notebooks—becomes relatively constrained. This supply reallocation dynamic is a key driver of the current upward price pressure on PC components.\n\nUnderstanding this structural shift requires familiarity with how semiconductor manufacturers make capacity allocation decisions. Foundry economics dictate that manufacturers will prioritize products that generate the highest return per wafer. HBM and SOCAMM2 both command significant price premiums over standard PC DRAM, making them highly attractive from a margin perspective. As a result, major DRAM manufacturers have been gradually reducing their allocation to standard PC memory in favor of these AI-oriented products.\n\nThis capacity reallocation is not a temporary phenomenon. Analysts at TrendForce and IDC consistently project that AI-related memory demand—encompassing HBM, SOCAMM2, and high-capacity LPDDR5X modules—will continue to grow substantially through at least 2028. The supply-demand imbalance for conventional PC components is therefore likely to persist, if not intensify, over this period.\n\nFor organizations managing large-scale PC parts inventories, such as Lenovo's Service Supply Chain (SSC), these dynamics translate into concrete operational challenges. Cost predictability becomes more difficult when component prices are influenced not just by PC market conditions, but by AI infrastructure investment cycles that operate on different timelines and with different demand elasticity characteristics.\n\nProactive procurement strategies become essential in this environment. Long-term agreements (LTAs) with key memory suppliers can provide price certainty and supply security, but require committing to volume forecasts that may be difficult to pin down given the uncertainty in PC demand forecasting. The trade-off between price certainty and volume flexibility is a central tension in supply chain management during volatile periods.\n\nTechnology transition planning is another critical dimension. The shift from current-generation PC platforms to AI PC configurations—with higher memory capacities, faster PCIe storage, and dedicated NPU hardware—changes the component mix that procurement teams need to manage. Parts that are standard today may become obsolete faster than historical cycles would suggest, creating inventory risk alongside cost risk.\n\nThe broader lesson from the SOCAMM2 moment is that supply chain professionals in the PC industry can no longer operate with a purely PC-centric view of the market. The memory supply chain is now deeply integrated with AI infrastructure investment, and understanding AI industry dynamics—server deployment cycles, hyperscaler capex plans, chip platform transitions—is becoming a prerequisite for effective PC component cost management.\n\nThis integration of AI awareness into PC supply chain strategy represents a meaningful evolution in the skill set required of modern supply chain finance professionals. The ability to synthesize insights from multiple market segments—AI servers, cloud infrastructure, and consumer electronics—and translate them into actionable procurement strategies is increasingly the differentiator between average and exceptional supply chain cost management.",
            chinese: "SK海力士宣布量产192GB SOCAMM2模组，标志着人工智能驱动的内存供应链快速转型中的又一个里程碑。这一进展不仅仅是产品发布，更是内存产能在不同细分市场分配方式深层结构性转变的信号。\n\nSOCAMM2全称为小型轮廓压缩连接内存模组2，是专为高性能AI计算平台设计的内存规格。与传统PC和服务器中使用的DIMM模组不同，SOCAMM2采用LPDDR5X技术和压缩连接器接口，能够实现对英伟达Vera Rubin等下一代AI服务器架构至关重要的更薄、更高能效设计。\n\n这次量产公告的战略意义不可低估。SK海力士正将自己定位在AI内存竞赛的前沿，与三星和美光直接竞争。三大DRAM厂商现在都处于SOCAMM2的量产或高级验证阶段，表明这项技术将在近期成为AI服务器的主流内存接口。\n\n对于PC零部件供应链专业人员而言，这一进展具有重要含义。当前沿内存产能被优先分配给SOCAMM2和HBM等高利润、高需求产品时，用于传统PC内存产品的可用供应——笔记本的DDR5、LPDDR5X——相对受限。这种供应重新分配动态是PC零部件当前上行价格压力的关键驱动力。\n\n了解这一结构性转变需要熟悉半导体制造商如何做出产能分配决策。晶圆厂经济学要求制造商优先考虑每片晶圆产生最高回报的产品。HBM和SOCAMM2都比标准PC DRAM具有显著的价格溢价，从利润角度来看非常有吸引力。因此，主要DRAM制造商一直在逐步减少对标准PC内存的分配，转而支持这些面向AI的产品。\n\n这种产能重新分配不是暂时现象。TrendForce和IDC的分析师一致预测，AI相关内存需求——涵盖HBM、SOCAMM2和大容量LPDDR5X模组——至少到2028年将继续大幅增长。因此，传统PC零部件的供需失衡可能在此期间持续甚至加剧。\n\n对于管理大规模PC零部件库存的组织，如联想服务供应链（SSC），这些动态转化为具体的运营挑战。成本可预测性变得更加困难，因为零部件价格不仅受PC市场条件影响，还受到以不同时间线和需求弹性特征运作的AI基础设施投资周期影响。\n\n在这种环境中，主动采购策略变得至关重要。与关键内存供应商签订长期协议（LTA）可以提供价格确定性和供应安全，但需要承诺可能难以确定的数量预测。鉴于PC需求预测的不确定性，价格确定性与数量灵活性之间的权衡是动荡时期供应链管理的核心张力。\n\n技术过渡规划是另一个关键维度。从当前代PC平台向AI PC配置的转变——更高的内存容量、更快的PCIe存储和专用NPU硬件——改变了采购团队需要管理的零部件组合。今天标准的零部件可能比历史周期所暗示的更快过时，在成本风险之外产生库存风险。\n\nSOCAMM2时刻的更广泛启示是，PC行业的供应链专业人员不能再以纯粹以PC为中心的视角看待市场。内存供应链现在与AI基础设施投资深度整合，了解AI行业动态——服务器部署周期、超大规模云服务商资本支出计划、芯片平台转型——正在成为有效管理PC零部件成本的先决条件。\n\n将AI意识整合到PC供应链策略中，代表着现代供应链金融专业人员所需技能组合的有意义演变。从多个市场细分——AI服务器、云基础设施和消费电子产品——综合洞察，并将其转化为可执行采购策略的能力，正日益成为平均水平和卓越供应链成本管理之间的差异化因素。",
            vocabulary: [
                {
                    word: "SOCAMM2",
                    meaning: "小型轮廓压缩连接内存模组2（Small Outline Compression Attached Memory Module 2）；面向AI服务器的新一代内存接口规格",
                    example: "SK Hynix's SOCAMM2 mass production signals a major shift in AI server memory architecture."
                },
                {
                    word: "capacity reallocation",
                    meaning: "产能重新分配；制造商将生产资源从低利润产品转向高利润产品的过程",
                    example: "Capacity reallocation from PC DRAM to HBM and SOCAMM2 is tightening supply for conventional components."
                },
                {
                    word: "long-term agreement (LTA)",
                    meaning: "长期采购协议；买卖双方锁定价格和数量的中长期合同安排",
                    example: "Securing an LTA before the procurement window closes can protect our parts budget from further price volatility."
                },
                {
                    word: "demand elasticity",
                    meaning: "需求弹性；价格变化对需求量影响程度的衡量指标",
                    example: "AI infrastructure demand has low price elasticity, meaning buyers will pay premium prices to secure supply."
                },
                {
                    word: "technology transition risk",
                    meaning: "技术过渡风险；产品代际更替带来的库存贬值和供应链调整风险",
                    example: "The rapid shift to AI PC platforms creates technology transition risk for existing parts inventory."
                }
            ],
            practice: [
                {
                    question: "What is the primary reason SK Hynix's SOCAMM2 production affects PC component prices?",
                    options: [
                        "SOCAMM2 is used directly in PC notebooks and replaces DDR5",
                        "High-end DRAM capacity is reallocated from PC memory to AI server products, reducing PC supply",
                        "SOCAMM2 production uses different raw materials that compete with PC components",
                        "SK Hynix has stopped producing PC DRAM entirely to focus on SOCAMM2"
                    ],
                    answer: 1
                },
                {
                    question: "What is the main trade-off when signing a long-term agreement (LTA) with memory suppliers?",
                    options: [
                        "Higher quality versus lower cost",
                        "Price certainty versus volume flexibility",
                        "Faster delivery versus better payment terms",
                        "Single-sourcing versus dual-sourcing"
                    ],
                    answer: 1
                },
                {
                    question: "Why do supply chain professionals in PC need to understand AI infrastructure investment cycles?",
                    options: [
                        "PC companies are investing directly in AI server manufacturing",
                        "AI demand cycles now directly influence memory supply allocation and PC component prices",
                        "AI infrastructure uses the same logistics networks as PC supply chains",
                        "Regulatory requirements mandate cross-industry supply chain reporting"
                    ],
                    answer: 1
                }
            ]
        };

        // 渲染短语
        document.getElementById('phraseSection').innerHTML = `
            <div class="phrase-english">${todayPhrase.english}</div>
            <div class="phrase-chinese">${todayPhrase.chinese}</div>
            <div class="phrase-example">💡 含义：${todayPhrase.meaning}</div>
        `;

        // 渲染学习内容
        document.getElementById('englishText').textContent = todayContent.english;
        document.getElementById('chineseText').textContent = todayContent.chinese;

        // 渲染词汇
        const vocabSection = document.getElementById('vocabularySection');
        vocabSection.innerHTML = todayContent.vocabulary.map(item => `
            <div class="vocab-item">
                <div class="vocab-word">${item.word}</div>
                <div class="vocab-meaning">${item.meaning}</div>
                <div class="vocab-example">${item.example}</div>
            </div>
        `).join('');

        // 渲染练习
        const practiceSection = document.getElementById('practiceSection');
        practiceSection.innerHTML = todayContent.practice.map((item, index) => `
            <div class="practice-item">
                <div class="practice-question">${index + 1}. ${item.question}</div>
                ${item.options.map((opt, optIndex) => `
                    <div class="practice-option" onclick="checkAnswer(${index}, ${optIndex}, ${item.answer})">${opt}</div>
                `).join('')}
                <div id="answer-${index}" style="margin-top: 10px; font-weight: bold;"></div>
            </div>
        `).join('');

        // 检查答案
        function checkAnswer(questionIndex, selectedOption, correctAnswer) {
            const resultDiv = document.getElementById(`answer-${questionIndex}`);
            if (selectedOption === correctAnswer) {
                resultDiv.innerHTML = '<span style="color: #28a745;">✓ Correct!</span>';
            } else {
                resultDiv.innerHTML = '<span style="color: #dc3545;">✗ Try again</span>';
            }
        }

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../english/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
