<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 510.00,
                change: 10,
                trend: 'down',
                date: '2026-04-17',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 820,
                change: 16,
                trend: 'up',
                date: '2026-04-17',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.35,
                change: 0.05,
                trend: 'down',
                date: '2026-04-16',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 三星Q2 DRAM再涨30%，连续两季累计涨幅超130%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND持续紧张，国产替代机遇显现</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股收盘报HK$9.35，市值约$170.0亿</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: '三星Q2 DRAM再涨30%，连续两季累计涨幅超130%',
                    source: '新浪财经',
                    date: '2026-04-17',
                    summary: '三星电子在2026年Q1 DRAM涨价100%的基础上，Q2再次宣布全系列DRAM产品平均涨价30%，涵盖AI芯片所需的高带宽内存(HBM)及通用DRAM。这是存储超级周期以来最激进的涨价节奏，连续两季累计涨幅已超过130%。对联想SSC参考：备件成本压力持续攀升，Q2锁单窗口期即将关闭，建议立即启动锁单流程。'
                },
                {
                    tag: '国产替代',
                    title: '存储涨价不停歇：AI吞噬产能，国产力量崛起',
                    source: '搜狐科技',
                    date: '2026-04-13',
                    summary: '2026年Q2，全球存储芯片因AI需求爆发，DRAM、NAND Flash价格持续上涨，高端产能向AI内存倾斜，为国产存储带来替代机遇。国产长江存储、合肥长鑫等在部分细分市场开始获得更多份额。对联想SSC启示：需评估国产替代可行性，同时关注国产颗粒在PC备件场景的兼容性验证。'
                },
                {
                    tag: '市场趋势',
                    title: 'PC市场Q1短暂增长后或进入下行周期',
                    source: 'PConline / IDC',
                    date: '2026-04-10',
                    summary: 'IDC与Omdia发布报告称，Q1全球PC出货量小幅增长，但受内存和CPU成本上涨推动整机价格继续上涨，预计Q2起市场将进入下行周期。涨价压力已开始抑制消费需求。对联想SSC启示：关注需求端变化，备件库存策略需平衡成本上涨与需求下行风险。'
                }
            ],
            ai: [
                {
                    tag: 'AI大模型',
                    title: 'DeepSeek V4即将发布，AI竞争格局生变',
                    source: '腾讯新闻',
                    date: '2026-04-10',
                    summary: 'DeepSeek V4将于4月发布，国产AI大模型持续迭代。AI PC赛道竞争加剧，各家厂商加速AI生态布局。DeepSeek的低成本高性能路线可能改变AI PC的定价策略和用户体验预期。对联想天禧AI生态参考：需关注V4的性能表现和生态适配情况，竞品动态可能影响ThinkPad新品定位。'
                },
                {
                    tag: 'AI PC',
                    title: 'AI PC涨价风暴加剧，DDR5现货回调能否扭转颓势？',
                    source: '搜狐科技',
                    date: '2026-03-31',
                    summary: 'AI本该是PC行业破局的关键，推着整个产业向智能终端迭代，可眼下这场席卷全产业链的硬件涨价潮，彻底打乱了AI PC的普及节奏。DDR5现货价小幅回调，但Q2合约价涨幅已成定局。整机涨价压力将持续传导至消费市场。对联想SSC影响：需关注消费市场反馈，适时调整备件成本预期。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: 'ThinkPad 2026发布会倒计时5天：天禧AI生态即将揭晓',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-17',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布活动将于4月22日举行，主题"我·即我们"。X1 Carbon、X9-15p、X14等新品即将亮相，搭载全新天禧AI生态。对SSC参考：新品发布后备件SKU将全面更新，建议提前完成新机型LCD/MB/SSD关键备件的采购认证。'
                },
                {
                    tag: '市场份额',
                    title: 'IDC：Q1全球PC出货6560万台，联想市占25.2%领跑',
                    source: 'IDC / 每经网',
                    date: '2026-04-16',
                    summary: 'IDC最新数据显示，2026年Q1全球PC出货约6560万台，同比增长3%。联想出货1650万台，市占突破25.2%继续领跑全球。惠普、戴尔分列二三位。分析师指出：虽然Q1增长低于预期，但AI PC渗透率提升将推动下半年换机潮。对联想SSC启示：全年出货前高后低态势确立，Q2起备件成本压力加大。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】三星Q2涨价30%下的紧急应对策略',
                    source: '联想SSC成本团队',
                    date: '2026-04-17',
                    summary: '基于三星最新Q2 DRAM涨价30%公告的紧急评估：1）连续两季累计涨幅超130%，备件成本压力前所未有；2）Q2锁单窗口期仅剩2周，建议立即启动锁单；3）ThinkPad 4月22日发布会倒计时5天，新品备件认证需加速；4）国产替代评估可作为长期降本选项；5）需求端可能承压，备件库存策略需更加谨慎。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
