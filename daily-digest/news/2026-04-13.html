<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 532.00,
                change: -3,
                trend: 'down',
                date: '2026-04-14',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 795,
                change: 3,
                trend: 'up',
                date: '2026-04-14',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5继续松动',
                    title: 'DDR5现货再跌3元至532元：GPT-6发布后算力需求转向，存储短期承压',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-14',
                    summary: '2026年4月14日当周，DDR5 16GB模组现货价格继续回落至532元（↓3元），连续两周下跌。TrendForce分析：GPT-6发布后，部分AI算力需求从训练端转向推理端，对HBM和高端DRAM的短期需求出现结构性调整；同时渠道商在Q1涨价周期中囤积的库存开始释放，导致现货价格持续松动。但中长期看，Q2 DRAM合约价环比再涨58-63%的预测不变，HBM挤占通用DRAM产能态势持续。对SSC启示：现货端松动是短期采购窗口，建议适度增加即期采购。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 795元续涨3元：NAND原厂5月涨价15-20%计划获渠道确认',
                    source: '上海证券报 / IT之家',
                    date: '2026-04-14',
                    summary: '2026年4月14日当周，企业级1TB SSD渠道价续涨3元至795元。三星、SK海力士、美光三大原厂已向渠道正式确认5月新一轮涨价计划，幅度15-20%，主要针对高密度QLC NAND和大容量企业级SSD。供应链人士透露：AI服务器需求持续爆发，QLC晶圆产能紧张局面短期无解；PLC商业化推迟至2027年，NAND供应紧张将延续至2026年底。对联想SSC参考：5月涨价前是最后采购窗口期，建议立即启动Q2末补货计划。'
                },
                {
                    tag: 'AI PC预测',
                    title: 'Canalys维持AI PC渗透率38%预测：GPT-6生态落地速度或超预期',
                    source: 'Canalys / IDC',
                    date: '2026-04-14',
                    summary: 'Canalys于4月14日发布报告，维持2026年全球AI PC渗透率38%的预测。报告指出：GPT-6发布后24小时内即获得Microsoft、Google、Meta三大巨头接入，AI应用生态落地速度或超预期；企业级AI应用（Copilot、Gemini for Workspace等）的快速普及将加速AI PC换机潮；2026下半年NPU性能再翻倍，AI PC将从"尝鲜"走向"刚需"。对中国市场影响：本土AI应用与GPT-6 API的整合将加速，AI PC普及速度有望领先全球。对SSC启示：AI PC备件需求将呈指数级增长，需提前规划产能。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6生态',
                    title: 'GPT-6发布48小时：Microsoft/Google/Meta全面接入，全球AI生态重构加速',
                    source: 'OpenAI / The Verge / TechCrunch',
                    date: '2026-04-14',
                    summary: 'GPT-6发布后48小时内，全球AI生态重构已全面启动。Microsoft宣布Copilot全面升级为GPT-6架构；Google Gemini宣布支持GPT-6 API兼容模式；Meta AI接入GPT-6用于社交场景智能回复。OpenAI CEO Altman称这是"人类最后需要记住的API"，意味着未来所有AI应用都将基于GPT-6构建。对企业影响：本地+云端混合AI架构成为主流，AI PC换机需求将呈爆发式增长；预计2026下半年企业AI PC采购量将同比增长200%以上。'
                },
                {
                    tag: '国产芯片',
                    title: '华为昇腾950PR产能爬坡：DeepSeek/文心一言/通义千问全面适配完成',
                    source: '36氪 / 知乎 / 华为官方',
                    date: '2026-04-14',
                    summary: '华为昇腾950PR芯片产能正在快速爬坡，预计Q2末月产能将达10万片。DeepSeek V4、百度文心一言、阿里通义千问已完成与昇腾950PR的全面适配，在多个基准测试中性能与英伟达H100相当。业内分析：昇腾950PR采用国产7nm工艺，性能功耗比显著提升，标志着国产AI芯片在大模型推理领域正式具备竞争力。对国内企业影响：昇腾生态快速成熟，本地AI部署成本有望下降30-40%，AI PC和服务器需求将进一步上行。'
                }
            ],
            lenovo: [
                {
                    tag: 'ThinkPad倒计时',
                    title: '联想ThinkPad发布会倒计时8天：X1 Carbon 2026定价15999元起，零部件成本上涨20%',
                    source: '联想官网 / IT之家 / 格隆汇',
                    date: '2026-04-14',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，倒计时8天。据悉，新一代ThinkPad X1 Carbon将搭载英特尔Panther Lake Core Ultra 300系列和AMD Zen 5 Ryzen AI 400系列双平台，起售价15999元（较上代上浮约2000元）。零部件成本上涨主要来自：DDR5内存涨价、1TB SSD涨价、以及新一代NPU芯片成本。对SSC启示：新品上市后旧款零部件清仓需求将增加，建议提前规划库存结构调整；高端备件采购预算需上调15-20%。'
                },
                {
                    tag: '供应链动态',
                    title: '联想天禧AI生态接入GPT-6 API：DingOS智能助手将迎来重大升级',
                    source: '联想官方 / 36氪',
                    date: '2026-04-14',
                    summary: '联想天禧AI生态（DingOS）宣布正式接入GPT-6 API，旗下智能助手"小天"将迎来重大升级。升级后的DingOS将支持200万Token超长上下文，可实现跨文档智能分析、多轮复杂对话、以及本地化AI推理+云端GPT-6混合架构。联想表示：天禧生态与GPT-6的深度整合，将使ThinkPad 2026系列成为"最懂企业用户"的AI PC。对SSC启示：天禧生态的升级将带动AI PC软件服务收入增长，但硬件成本压力同步上升，需关注新品毛利率走势。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
