<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:06';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 495.00,
                change: -15,
                trend: 'down',
                date: '2026-04-17',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 822,
                change: 7,
                trend: 'up',
                date: '2026-04-17',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 跌破500心理关口，渠道加速去库存</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND合约Q2涨幅锁定50-55%</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5破500',
                    title: 'TrendForce：DDR5现货495元跌破500关口，渠道加速去库存',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-17',
                    summary: 'TrendForce集邦咨询最新数据（4月17日）：DDR5 16GB模组现货价格跌破500元至495元，七周来首次。分析：1）消费市场需求持续低迷；2）渠道商库存压力达到峰值，开始恐慌性抛售；3）618电商大促备货提前完成，预计5月初库存恢复正常水平。合约市场价格仍坚挺，Q2合约价涨幅锁定8-12%。对SSC启示：现货市场出现难得窗口期，非关键零部件可考虑适量补货，但需控制库存周期在8周内。'
                },
                {
                    tag: 'NAND涨价',
                    title: '企业级SSD 822元续涨7元：NAND合约价Q2最终涨幅锁定50-55%',
                    source: '上海有色网 / Tom\'s Hardware',
                    date: '2026-04-17',
                    summary: '行业监测数据（4月17日）：企业级1TB SSD渠道价续涨7元至822元。供应链确认：NAND合约价Q2最终涨幅锁定50-55%，较此前预期（45-50%）上调5个百分点，主因是企业级需求超预期。三星和SK海力士已开始限制对非战略客户的消费级NAND供应。对联想SSC参考：企业级SSD采购成本压力加大，建议Q2锁定3个月用量，Q3视市场情况调整。'
                },
                {
                    tag: '库存管理',
                    title: 'Gartner：Q2全球PC库存周期拉长至6周，Q3市场走势存疑',
                    source: 'Gartner / 第一财经',
                    date: '2026-04-17',
                    summary: 'Gartner于4月16日发布最新PC市场报告：2026年Q2全球PC平均库存周期从5周拉长至6周，主要受AI PC新品上市延迟和消费需求疲软影响。分渠道看：企业采购周期缩短至4周（IT预算执行压力），消费渠道拉长至8周（换机意愿低迷）。Gartner预测Q3市场走势存疑，取决于AI PC实际应用场景落地情况。对SSC参考：库存周期拉长意味着呆滞风险上升，建议加强渠道库存监控，将安全库存周期从8周压缩至6周。'
                }
            ],
            ai: [
                {
                    tag: 'ThinkPad发布',
                    title: '联想ThinkPad 2026发布会：X1 Carbon Gen 13正式发布，AI PC战略全面升级',
                    source: '联想官方 / IT之家',
                    date: '2026-04-17',
                    summary: '联想今日正式发布ThinkPad X1 Carbon Gen 13（搭载Intel Core Ultra 9处理器）和ThinkPad X1 Yoga Gen 9。核心亮点：1）NPU算力提升至48 TOPS，总AI算力120 TOPS；2）全新散热架构，续航提升至18小时；3）搭载本地GPT-6模型，支持离线AI协作。BOM成本结构：DDR5占比17%（略有下降），SSD占比16%（+1%），新增Wi-Fi 7模组占比4%。对SSC参考：新机发布后旧款零部件将进入清仓周期，关注X1 Carbon G12备件价格波动。'
                },
                {
                    tag: 'HBM4量产',
                    title: '三星宣布HBM4量产计划：2026下半年产能分配曝光，AI内存格局生变',
                    source: '三星半导体 / 电子工程世界',
                    date: '2026-04-17',
                    summary: '三星半导体今日宣布HBM4将于2026年下半年正式量产，首批产能已被NVIDIA和AMD锁定。HBM4较HBM3E带宽提升50%，功耗降低30%，主要面向AI服务器和高端PC。供应链消息：HBM4量产初期将对DDR5产能形成挤压，预计Q4消费级DDR5供应将减少15-20%。对联想SSC参考：关注HBM4对DDR5产能的间接影响，提前规划Q4备件采购窗口，建议在8-9月前完成DDR5备货。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: 'ThinkPad X1 Carbon Gen 13 BOM解析：成本结构变化与SSC备件策略调整',
                    source: '联想供应链管理 / 格隆汇',
                    date: '2026-04-17',
                    summary: '根据今日发布会信息，ThinkPad X1 Carbon Gen 13 BOM成本结构：DDR5模组占比17%（较Gen 12的18%略降），SSD占比16%（+1%），新增Wi-Fi 7模组4%，NPU芯片22%（不变），屏幕占比12%（-2%）。整体BOM成本上涨约18%，终端定价上调10%。联想通过规格微调（屏幕分辨率从4K降为3K）控制成本。对SSC启示：旧款Gen 12备件清仓加速，关注G12库存消化周期。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】DDR5破500后的采购窗口分析与库存策略建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-17',
                    summary: 'SSC成本团队今日内部建议：1）DDR5现货跌破500元，为近半年最低点，建议对非关键零部件（如备件包中的DDR5模组）进行适量补货；2）HBM4量产预期可能导致Q4 DDR5供应收紧，建议在8-9月前完成Q4用量的采购锁单；3）当前库存周期偏长（6周），需警惕呆滞风险，安全库存周期控制在6周以内；4）企业级SSD成本压力持续，建议Q2锁定3个月用量。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
