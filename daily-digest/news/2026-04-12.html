<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 235.00,
                change: -2.1,
                trend: 'down',
                date: '2026-04-12',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 792,
                change: 0.3,
                trend: 'up',
                date: '2026-04-12',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '开源系统',
                    title: 'Linux 7.0内核今日正式发布：AI工具致补丁激增，GPU驱动与AI调度全面升级',
                    source: 'IT之家 / Linux内核邮件列表',
                    date: '2026-04-12',
                    summary: '2026年4月12日，Linus Torvalds正式发布Linux 7.0稳定版。本次RC7补丁量偏大，主因AI编码工具（GitHub Copilot、Claude Code等）广泛使用导致代码提交激增。Linux 7.0核心更新：全新GPU驱动框架（支持NVIDIA H200/AMD MI350）、AI工作负载优先调度、内核级内存压缩优化。对SSC影响：数据中心及服务器备件升级需求将随Linux 7.0推进而前置，需关注相关硬件兼容采购。'
                },
                {
                    tag: '算力成本',
                    title: '云计算20年降价史终结：阿里/百度/腾讯三巨头集体AI算力大幅涨价（最高456%）',
                    source: '界面新闻 / IT168 / 北京日报',
                    date: '2026-04-09~12',
                    summary: '继阿里云、百度智能云之后，腾讯云4月9日宣布自5月9日起对AI算力等产品刊例价上调5%，三大云厂商集体打破20年只降不升惯例。涨价核心集中于GPU训练/推理实例、大模型API，部分规格涨幅高达456%。背后原因：HBM供应持续紧张、英伟达GPU缺货、数据中心运营成本攀升。对SSC影响：AI辅助成本分析工具使用成本上升，企业需合理规划云资源预算，探索自建算力可行性。'
                },
                {
                    tag: '市场分析',
                    title: '摩根士丹利：AI"能力突变"将导致算力需求系统性超越供给，PC硬件承压加剧',
                    source: '摩根士丹利研究报告 / 163财经',
                    date: '2026-04-12',
                    summary: '摩根士丹利最新报告指出，以GPT-6为代表的新一代顶尖模型在推理、多模态等能力上出现"突变式跃升"，将导致企业AI部署算力需求在2026年下半年系统性超越供给。大摩预计AI相关硬件（GPU、HBM、高速存储）紧缺态势2026年难以缓解，PC整机及服务器价格将继续承压上行。对SSC启示：高价值AI备件（内存、SSD、特种芯片）库存策略需提前布局，防止Q3、Q4采购成本大幅上涨。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6',
                    title: 'GPT-6后天发布倒计时：代号Spud预训练3月完成，性能较GPT-5.4提升40%',
                    source: '腾讯新闻 / 量子位 / 钛媒体',
                    date: '2026-04-09~12',
                    summary: '4月14日（周二），OpenAI将全球同步发布代号"Spud（土豆）"的GPT-6，预训练已于3月17日完成，耗时18个月研发。核心参数：性能较GPT-5.4提升40%，支持200万Token超长上下文，原生多模态（文字/图像/音频/视频），支持长时记忆与个性化伙伴功能。36氪分析：AI行业正在从"跟OpenAI玩"转向各自生态布局，GPT-6发布或加速这一趋势。对SSC：企业AI部署热潮将推动服务器及AI PC整机需求上行，存储备件价格获新支撑。'
                },
                {
                    tag: '算力格局',
                    title: '中国AI大模型调用量连续五周超美，阿里千问登顶全球调用榜',
                    source: '新浪财经 / OpenRouter',
                    date: '2026-04-06~12',
                    summary: '根据OpenRouter最新数据，上周（3/30-4/5）全球AI大模型总调用量中，中国模型占比首次连续五周超过美国，其中阿里千问（Qwen）系列登顶全球调用排行榜。这一趋势反映国产AI在推理成本、本土化适配上的竞争优势日益凸显。对SSC：国内AI算力基础设施需求持续旺盛，服务器端高端内存（HBM、企业级DDR5）采购压力不减。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: 'ThinkPad 2026发布会倒计时10天，天禧AI生态搭档全新X1 Carbon亮相在即',
                    source: 'IT之家 / ZOL中关村在线 / PChome',
                    date: '2026-04-12',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布会将于4月22日在北京举行，主题"我·即我们"。预告机型含ThinkPad X1 Carbon 2026、X9-15p、X14等旗舰，均搭载天禧AI生态（DingOS）。本周荣耀WIN游戏本定档4月23日发布，正面迎战联想。对SSC启示：关注新品发布后备件规格变化（DDR5 LPDDR5X、PCIe 5.0 SSD），提前评估新品备件采购策略。'
                },
                {
                    tag: '市场地位',
                    title: '联想YOGA Pro 16 Aura首发天禧Claw，AI PC生态布局加速落地',
                    source: 'PCOnline太平洋科技',
                    date: '2026-04-12',
                    summary: '联想在YOGA Pro16 Aura 2025款AI元启版笔记本上首发集成天禧Claw，标志着联想天禧AI生态向消费端加速渗透。天禧Claw支持本地AI任务（文档摘要、图像处理、编程辅助），无需云端连接。IDC数据显示联想Q1出货+8.6%，AI PC占比已达35%。对SSC：AI PC普及推动高规格内存（LPDDR5X）和大容量SSD备件需求持续增长，SSC需提前准备对应备件库存。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
