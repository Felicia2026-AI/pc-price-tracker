<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月11日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/11 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 515.00,
                change: -1.0,
                trend: 'down',
                date: '2026-04-12',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 795,
                change: 3,
                trend: 'up',
                date: '2026-04-12',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'HBM4',
                    title: '三星HBM4通过英伟达认证测试，打破SK海力士垄断格局第一步',
                    source: '21世纪经济报道 / 新浪财经',
                    date: '2026-03-04~04-12',
                    summary: '三星电子在HBM4领域取得关键突破，其12层堆叠HBM4已通过英伟达量产准备认证（PRA），正式进入英伟达供应链候选名单。此前英伟达AI芯片的HBM供应几乎由SK海力士垄断（三星份额不足5%）。业内人士透露，三星HBM4采用自家先进制程，在功耗和带宽密度上优于SK海力士产品。若三星正式供货，将打破SK海力士在英伟达HBM4供应链中的垄断地位，HBM市场格局面临重塑。对SSC启示：HBM供应格局变化将影响服务器内存备件采购策略，需密切关注三星与SK海力士的市场份额变化。'
                },
                {
                    tag: 'HBM竞争',
                    title: 'SK海力士巩固英伟达核心供应商地位：已小批量供货HBM4，份额70%',
                    source: 'EET-China / 韩联社',
                    date: '2026-04-12',
                    summary: 'SK海力士已正式向英伟达小批量供应第六代HBM（HBM4），标志着其作为英伟达AI芯片核心内存供应商的地位进一步巩固。尽管三星正在追赶，但SK海力士凭借先发优势和成熟的生产工艺，仍将在2026年保持对英伟达HBM4的主要供货份额（约70%）。SK海力士预计2026年HBM4营收占比将超过整体DRAM业务的40%。对SSC启示：SK海力士在HBM市场的主导地位短期内不会改变，相关备件采购需提前布局。'
                },
                {
                    tag: '市场分析',
                    title: 'DDR5终于回调但别高兴太早：当前价格仍是正常水平的4倍以上',
                    source: '新浪财经 / 知乎',
                    date: '2026-04-01~12',
                    summary: 'DDR5内存价格在经历2025年末至2026年初的暴涨后终于出现回调态势。分析指出本次回调原因包括：国产替代预期升温、关税采购退潮、AI需求短期降温等。然而业内专家警告，当前DDR5价格仍是正常水平的4倍以上，"崩盘论"为时尚早。预计2026年将持续缓慢回调，但受HBM产能挤占影响，服务器级DDR5仍将维持高位。对SSC成本管控建议：观望消费级市场，优先锁定服务器备件长期合约。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6',
                    title: 'OpenAI CEO最新采访：GPT-6将是"人类最后需要记住的API"',
                    source: '36氪 / OpenAI官方博客',
                    date: '2026-04-11~12',
                    summary: 'OpenAI CEO Sam Altman在4月11日深夜采访中透露，GPT-6将成为"人类最后需要记住的API"，强调其将实现真正的个人AI助理体验，支持跨设备、跨应用的统一记忆。Altman还暗示GPT-6将彻底改变API定价模式，"按价值收费而非按Token计费"。GPT-6发布后48小时内，全球AI应用生态可能迎来重构。对企业影响：本地+云端混合架构或成主流，需重新评估AI部署策略。'
                },
                {
                    tag: 'AI算力',
                    title: 'GPT-6发布倒计时2天：原生多模态+200万上下文，AGI竞赛升温',
                    source: '量子位 / 知乎',
                    date: '2026-04-05~12',
                    summary: '4月14日，OpenAI将正式发布GPT-6（代号Spud）。这颗备受期待的AI旗舰将带来两大杀手锏：原生多模态支持和200万Token超长上下文。业内分析指出，GPT-6的发布将重新定义AGI竞赛的规则，Anthropic、Google DeepMind、xAI等竞争对手将面临更大压力。AIbase数据显示，GPT-6相关资讯在过去一周占据全球科技新闻头条的67%。对SSC影响：AI PC和服务器需求将进一步上行，存储备件价格获新支撑。'
                }
            ],
            lenovo: [
                {
                    tag: '存储竞争',
                    title: '三星VS SK海力士HBM4竞赛白热化：谁能拿下英伟达订单成关键',
                    source: '雪球 / 21世纪经济报道',
                    date: '2026-04-12',
                    summary: '2026年HBM4已成为AI算力存储的核心战场。SK海力士暂时以约70%的英伟达HBM4订单份额领跑，但三星正凭借全产业链优势和最新技术突破发起强力反击。SK海力士采用Advanced MR-MUF工艺，而三星则押注于自家制程。两家韩企的竞争将决定未来AI数据中心成本结构。对联想SSC启示：关注上游存储供应商格局变化，选择最优备件采购策略。'
                },
                {
                    tag: '供应链',
                    title: 'HBM供应格局影响深远：联想服务器备件成本管控面临新挑战',
                    source: 'IDC中国 / Gartner',
                    date: '2026-04-12',
                    summary: 'HBM市场的韩双雄格局正在经历结构性变化，对下游服务器和PC厂商的备件成本管控带来深远影响。IDC中国数据显示，2026年Q1中国AI服务器出货量同比增长45%，其中HBM内存成本占比已超整机成本的30%。Gartner建议企业供应链团队密切跟踪HBM供应商动态，通过多元化采购和长期合约锁定成本。对联想SSC：建议建立HBM供应商评估矩阵，优化备件库存策略。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
