<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月12日星期日';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/12 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 535.00,
                change: 7,
                trend: 'up',
                date: '2026-04-12',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 790,
                change: 3,
                trend: 'up',
                date: '2026-04-12',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5涨价',
                    title: 'DDR5现货价格突破530元关键阻力位：TrendForce维持Q2 DRAM合约价预测不变',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-05~12',
                    summary: '2026年4月11日当周，DDR5 16GB模组现货价格突破530元关键阻力位，单周上涨7元或1.3%。TrendForce集邦咨询维持此前预测：Q2 DRAM合约价将环比再涨58-63%，存储超级周期至少持续到2026年底。本轮涨价由AI算力需求驱动，原厂产能持续向HBM和服务器DRAM倾斜，PC和通用型DRAM供应紧张短期难缓解。对SSC启示：Q2备件采购预算需上调10-15%，优先锁定长期合约价。'
                },
                {
                    tag: '企业级SSD',
                    title: '企业级SSD 790元续涨3%：AI服务器需求爆发，QLC/PLC NAND供应趋紧',
                    source: '上海证券报 / IT之家',
                    date: '2026-04-05~12',
                    summary: '2026年4月第二周（4/7-4/11），企业级1TB SSD渠道价续涨3%至790元，继续刷新年内高点。分析师指出：AI服务器采购爆发式增长导致高密度QLC NAND晶圆产能持续紧张，PLC（五层单元）NAND商业化进程加快但尚未形成规模。主要供应商三星和SK海力士优先保障企业级订单，消费级SSD供应进一步收缩。对联想SSC参考：关注AI服务器备件需求变化，Q2采购价预计继续上行。'
                },
                {
                    tag: '三强扩产',
                    title: '存储三强扩产竞赛白热化：三星/海力士/美光策略分化，HBM格局重塑',
                    source: '雪球 / 21世纪经济报道',
                    date: '2026-04-10~12',
                    summary: '截至2026年4月，三星、SK海力士、美光三大存储巨头围绕AI驱动的HBM需求展开全面扩产竞赛，策略分化显著：三星以平泽P4为短期主力、P5与德州泰勒厂为长期储备；SK海力士加速利川M15X扩产；美光也在扩大台湾产能。三星与SK海力士双双入围英伟达Rubin HBM4供应商名单，打破SK海力士垄断格局第一步。对联想SSC启示：HBM供应格局变化将影响服务器备件采购策略。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6倒计时',
                    title: 'GPT-6重磅发布倒计时2天：代号Spud、训练成本20亿美元、4月14日揭幕',
                    source: 'DevPress / 量子位',
                    date: '2026-04-12',
                    summary: 'OpenAI宣布GPT-6将于4月14日正式发布（代号Spud/土豆），训练成本超20亿美元，动用约10万张H100 GPU在德克萨斯Stargate数据中心完成。核心参数：Symphony架构+200万Token超长上下文，原生多模态，性能较GPT-5.4暴涨40%。OpenAI CEO Altman称之为"人类最后需要记住的API"。发布后48小时内，全球AI应用生态将迎来重构。对企业影响：本地+云端混合架构或成主流，需重新评估AI部署策略。'
                },
                {
                    tag: 'DeepSeek V4',
                    title: 'DeepSeek V4全面换装华为昇腾950PR：国产大模型算力自主化提速',
                    source: '知乎 / 36氪',
                    date: '2026-04-05~12',
                    summary: 'DeepSeek V4已完成与华为昇腾950PR芯片的深度适配，在多个基准测试中表现与英伟达H100相当。业内人士分析，昇腾950PR采用国产7nm工艺，性能功耗比显著提升。这标志着国产AI芯片在大模型训练领域正式具备竞争力。对国内企业影响：昇腾生态快速成熟，本地AI部署成本有望下降，AI PC和服务器需求将进一步上行。'
                }
            ],
            lenovo: [
                {
                    tag: 'Q1出货',
                    title: 'IDC数据：联想Q1 PC出货量增速超市场平均水平3倍，份额25.2%稳居第一',
                    source: 'IDC中国 / 雪球',
                    date: '2026-04-09~12',
                    summary: 'IDC数据显示，2026年一季度联想集团PC出货量同比增长8.6%，增速远超市场平均水平（约2.5%），市场份额达25.2%，稳居全球PC出货量第一。受益于AI PC新品推出和ThinkPad 2026产品线更新，联想在全球PC市场复苏中占据领先地位。4月22日ThinkPad发布会渐近，新品定价和供应链策略值得持续关注。'
                },
                {
                    tag: 'ThinkPad发布会',
                    title: '联想4月22日ThinkPad发布会倒计时10天：AI PC新品+天禧生态双线出击',
                    source: '格隆汇 / IT之家',
                    date: '2026-04-12',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，届时将发布搭载最新AI功能的新一代ThinkPad产品线。结合天禧AI生态（DingOS）和新处理器平台，联想欲在AI PC赛道抢占先机。供应链消息显示，新品零部件成本有所上升，预计售价将高于上一代产品15-20%。对SSC启示：关注新品零部件规格变化，提前调整备件库存结构。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接（加../前缀回到父目录）
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
