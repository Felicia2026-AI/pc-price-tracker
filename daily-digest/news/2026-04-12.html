<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 240.00,
                change: -1.0,
                trend: 'down',
                date: '2026-04-11',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 789,
                change: 0.3,
                trend: 'up',
                date: '2026-04-11',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: '存储涨价潮凶猛：OPPO/vivo/小米相继宣布涨价，PC产业链集体承压',
                    source: '上海证券报 / 腾讯新闻',
                    date: '2026-04-03~11',
                    summary: '存储芯片涨价潮凶猛，继OPPO、vivo之后，小米4月3日宣布受全球存储芯片涨价影响手机涨价。全球存储芯片等关键零部件价格持续走高，成本压力正沿消费电子产业链快速传导。上海证券报记者采访了解到，面板、镜头等零部件也在酝酿涨价，PC整机价格2026年下半年预计再涨15-20%。对SSC启示：备件采购需提前锁定合约价，关注DDR5等关键料的库存策略。'
                },
                {
                    tag: '内存市场',
                    title: '消费级DDR4半月跌34%：华强北进入理性回归期，合约价仍看涨58-63%',
                    source: '观察者网 / 深圳商报',
                    date: '2026-04-11',
                    summary: '继3月中下旬消费级内存断崖式暴跌后，市场进入理性回归期。华强北数据：金士顿16GB DDR4从¥1,100跌至¥720（-34.5%），威刚等品牌跟进降价。但TrendForce Q2 DRAM合约价仍预涨58-63%，现货/合约双轨分歧持续。SSD价格变动相对较小，机械硬盘保持高位。对SSC影响：消费级备件采购成本回落，企业级/服务器存储成本仍承压，需分类管理。'
                },
                {
                    tag: '零部件',
                    title: '内存/金属/电池涨价共振：供应链打响成本"防御战"',
                    source: '证券时报 / 新浪财经',
                    date: '2026-04-10~11',
                    summary: '2026年供应链成本压力全面升级：存储芯片、车身轻量化金属、动力电池等关键零部件价格共振上涨。主机厂面临"涨价传导消费者"或"利润承压"的两难选择。对SSC影响：备件采购需提前锁定合约价，关注内存、面板等高价值料的库存策略。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6',
                    title: 'GPT-6定档4月14日倒计时3天：Symphony架构+200万Token，冲刺AGI"最后20%"',
                    source: '多课网 / GitCode',
                    date: '2026-04-11',
                    summary: '4月11日AI圈最新：GPT-6代号Symphogy，正式定档4月14日发布。核心参数：性能较GPT-5.4暴涨40%，支持200万Token超长上下文，原生多模态（文本+图像+音频+视频）。内部定位为冲刺AGI的"最后20%"。同时DeepSeek V4全面换装华为昇腾950PR芯片，Anthropic发布Claude Mythos Preview可自主发现数学定理。'
                },
                {
                    tag: 'AI编程',
                    title: 'Claude Code领跑SWE-bench 80.8%：2026年4月AI编程工具终极横评',
                    source: 'CSDN / 知乎',
                    date: '2026-04-10~11',
                    summary: '2026年AI编程工具进入"自主Agent"时代：Claude Code以SWE-bench 80.8%登顶编程能力榜首；Cursor 3发布Glass界面，支持多Agent并行协作；GitHub Copilot依托微软生态保持最大用户群。AI编程助手使开发者效率提升5-10倍。对SSC启示：AI工具可辅助备件需求预测和成本分析，如构建自动化的成本分析脚本。'
                }
            ],
            lenovo: [
                {
                    tag: '战略',
                    title: 'ThinkPad 2026新品发布会倒计时11天，4月22日天禧AI生态全面亮相',
                    source: 'IT之家 / ZOL中关村在线',
                    date: '2026-04-11',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布会将于4月22日在北京举行，主题"我·即我们"。预告机型含ThinkPad X1 Carbon 2026、X9-15p、X14等旗舰，均搭载天禧AI生态（DingOS）。结合4月1日誓师大会"混合式AI战略交付年"定位，ThinkPad新品将全面拥抱AI PC时代。'
                },
                {
                    tag: '股价',
                    title: '联想集团4月至今涨幅近12%：IDC Q1数据+AI战略双重催化',
                    source: '格隆汇 / 雪球',
                    date: '2026-04-09~11',
                    summary: '联想集团4月以来涨幅近12%，受益于外围环境回暖与风险偏好修复。IDC Q1数据显示联想出货+8.6%、份额25.2%稳居第一；天禧AI生态（DingOS）+ ThinkPad 2026新品双重催化；高盛维持亚太买入名单，目标营收突破千亿美元。4月22日发布会倒计时11天，需关注新品定价对备件供应链的影响。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
