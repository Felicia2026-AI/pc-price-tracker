<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月20日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/20 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 512.00,
                change: 7,
                trend: 'up',
                date: '2026-04-20',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 848,
                change: 13,
                trend: 'up',
                date: '2026-04-20',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 11.46,
                change: 1.4,
                trend: 'up',
                date: '2026-04-18',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 入门级DDR4 Q1涨幅+110%，DDR5续涨，Q2再涨60%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | 1TB NVMe SSD（无DRAM版）Q1涨幅+147%，Q2再涨50%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股HK$11.46，4月以来累涨约12%，AI战略驱动估值修复</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '史诗级涨价',
                    title: '入门级PC配件价格暴涨超100%！Q2 DRAM再涨60%、SSD再涨50%',
                    source: '快科技 / 振华网',
                    date: '2026-04-20',
                    summary: '2026年Q1全球存储市场迎来"史诗级涨价潮"——8GB SoDIMM DDR4内存涨幅高达+110%，1TB NVMe SSD（无DRAM版）涨幅达+147%，即便入门级产品也创下历史涨幅纪录。Q2涨势进一步加剧：DRAM预计再涨约60%，SSD再涨约50%。根本驱动是三星、SK海力士将先进产能优先分配给高毛利HBM/SOCAMM2，消费级存储产品供给被结构性挤压。对联想SSC参考：DDR4/DDR5和NVMe SSD双线承压，Q2前必须完成核心SKU锁价，否则将直面更大幅度的价格冲击。'
                },
                {
                    tag: 'CPU短缺',
                    title: 'Intel/AMD处理器涨价10-15%，晶圆厂产能被AI芯片挤占',
                    source: 'aitalo科技 / 快科技',
                    date: '2026-04-20',
                    summary: '存储危机向处理器蔓延：Intel和AMD客户端处理器价格近期上涨10%-15%，晶圆代工厂将产能优先分配给AI芯片（GPU、NPU、ASIC），客户端CPU排产空间被严重压缩。这意味着PC成本链条在存储之外又新增了CPU端压力，主板（含CPU）备件成本双重承压。对联想SSC参考：MB类备件BOM成本需同步重新核算，含CPU集成模组的SKU尤须重点关注，建议将CPU价格纳入Q2-Q3成本预测模型。'
                },
                {
                    tag: '出货警示',
                    title: 'Q1全球PC出货量+3.2%为"虚增"，厂商囤货非真实需求',
                    source: '快科技 / 振华网',
                    date: '2026-04-20',
                    summary: '2026年Q1全球PC出货约6330万台，同比增长3.2%，联想+9%、华硕+20%领跑。但分析师警告：此轮增长具有明显人为推动特征——PC厂商普遍预判存储价格将持续上涨，提前大量备货，真实终端需求并未同步改善。预计2026年底至2027年初出货量将出现回落。对联想SSC参考：备件库存规划须区分"前置备货需求"与"真实消耗需求"，避免跟随主机厂节奏错误扩大备件库存，引发后期滞销风险。'
                }
            ],
            ai: [
                {
                    tag: 'AI存储竞争',
                    title: 'SOCAMM2量产全面铺开：三星/SK海力士/美光三强争霸，HBM4地位动摇',
                    source: 'OFweek电子工程 / EET',
                    date: '2026-04-18',
                    summary: 'SK海力士已正式量产192GB SOCAMM2（1c LPDDR5X），三星和美光同步推进量产或验证。SOCAMM2热度已超越HBM4，成为2026年AI服务器存储赛道核心竞争点，英伟达Vera Rubin平台是最大需求方。SOCAMM2采用LPDDR5X架构，具备比HBM更低功耗和更高集成度优势。三大DRAM原厂同步将先进产能向SOCAMM2/HBM倾斜，消费级PC内存产能分配持续承压，这是Q1入门级存储价格暴涨的深层结构原因。'
                },
                {
                    tag: 'AI PC战略',
                    title: '联想天禧AI生态：端云一体化的下一代AI PC架构解析',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-07',
                    summary: '明日（4月22日）即将发布的ThinkPad 2026+天禧AI生态，是联想AI PC战略的核心交付物。天禧AI整合端侧NPU推理、云侧大模型调度和跨设备协同三层架构，X1 Carbon Gen 13将成为旗舰验证平台。新架构意味着备件规格全面升级：高算力NPU板载/独立模块、大容量LPDDR5X（最高64GB）、PCIe 5.0 NVMe SSD。对SSC备件规划：发布后72小时内须完成新机型关键备件SKU识别和采购锁价启动，否则将面临"发布即断货"风险。'
                }
            ],
            lenovo: [
                {
                    tag: '战略收购',
                    title: '联想完成收购Infinidat，十年存储短板补齐，AI基础设施版图完整',
                    source: '格隆汇 / 联想官方',
                    date: '2026-04-10',
                    summary: '2026年4月10日，联想集团正式完成对高端存储公司Infinidat的收购交割。Infinidat专注企业级高端存储解决方案，这一里程碑补齐了联想历时近十年的"存储短板"，在AI基础设施存储赛道上与Dell EMC、HPE形成正面竞争。格隆汇分析：联想4月以来股价累涨约12%，背后是市场对AI战略完整性的重新定价。对联想SSC参考：企业级存储产品纳入联想体系后，相关备件管理范围将在6个月内扩大，SSC可能需要对接Infinidat产品线的备件服务体系。'
                },
                {
                    tag: '明日发布',
                    title: '【明日见】ThinkPad 2026+天禧AI生态发布会（4月22日），X1 Carbon等旗舰登场',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-07',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布活动将于明日（2026年4月22日）举行，主题"我·即我们"。X1 Carbon Gen 13、X9-15p、X14三款旗舰，以及E/T/P系列新品预计同期亮相，全系深度整合天禧AI生态。这是联想年度最重要的PC战略发布节点，也是AI PC从"概念"走向"主流化"的关键时刻。对SSC建议：发布后72小时内须：①获取新机型BOM，②识别关键备件变更，③启动优先SKU采购锁价，④评估现有库存兼容性。'
                },
                {
                    tag: '成本管控',
                    title: '【SSC内部参考】Q2备件成本风险矩阵（4月20日更新）',
                    source: '联想SSC成本团队',
                    date: '2026-04-20',
                    summary: '基于今日最新市场数据综合评估：①DDR5现货¥512（+¥7/周），入门级DDR4 Q1已涨+110%，Q2预计再涨60%；②企业级SSD ¥848（+¥13/周），无DRAM NVMe Q1涨+147%，Q2再涨50%；③CPU价格上涨10-15%，MB类备件成本双重承压；④联想Q1出货+9%但系厂商备货驱动，备件真实消耗节奏需重新测算；⑤明日ThinkPad 2026发布，新机型备件SKU即将切换。建议本周内完成Q3备件采购计划修订，Q2锁价窗口极为紧迫。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
