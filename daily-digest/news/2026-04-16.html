<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月16日星期四';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/16 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 515.00,
                change: 5,
                trend: 'down',
                date: '2026-04-16',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 815,
                change: 5,
                trend: 'up',
                date: '2026-04-16',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.20,
                change: 1.55,
                trend: 'up',
                date: '2026-04-15',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 现货继续小幅回落，128GB套条海外报价¥2.8万引发关注</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND合约Q2涨幅45-50%确认，现货1TB维持950-1100元</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股收盘报HK$9.20，市值约$167.6亿</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '重磅·存储格局',
                    title: '三星/SK海力士全面转向3-5年长期合约：存储行业"周期魔咒"或被打破',
                    source: 'DIGITIMES Asia / 快科技',
                    date: '2026-04-10',
                    summary: '据韩媒及DIGITIMES Asia报道，三星电子与SK海力士于4月9日宣布全面调整存储供应合作模式，终止沿用多年的年度/季度短期合约机制，转而面向全球核心科技客户推行3至5年期长期供应协议（LTA）。此举标志着存储行业从传统的"周期波动"模式向"长期稳定供应"模式转型。背景：AI服务器对HBM的持续饥渴需求使两大厂商确信，供给结构性短缺将持续至2027年底甚至更久。对联想SSC参考：长协模式对SSC备件采购是重大利好，意味着Q2之后存储合约价可能趋于稳定而非持续暴涨，建议尽快与代理商洽谈加入长协框架，锁定中长期价格。'
                },
                {
                    tag: 'DDR5现货',
                    title: 'DDR5 128GB套条海外报价飙至¥2.8万：AI算力虹吸效应持续发酵',
                    source: '网易 / 什么值得买',
                    date: '2026-04-11',
                    summary: '4月11日海外社交平台出现一组引发广泛关注的硬件报价：海盗船128GB DDR5内存套装标价4199美元（折合人民币约2.8万元）。DDR5 16GB模组虽较年初高点回落7.2%，但均价仍高达4500元以上，是2025年7月低点的4.1倍。1TB PCIe 4.0 SSD主流售价维持在950-1100元区间。涨价核心逻辑不变：AI服务器单台存储需求为传统PC的8-10倍，HBM吞噬70%以上DRAM先进产能。对联想SSC参考：消费级现货价格回落不代表合约价下行，SSC采购仍应以合约价为基准，短期现货可少量机会性补充。'
                },
                {
                    tag: 'Q1出货',
                    title: 'Q1 PC出货仅增2.5-3.2%：机构将全年预期大幅下调至下滑11.3%',
                    source: 'IDC/Omdia / 36氪',
                    date: '2026-04-13',
                    summary: 'Q1全球PC出货约6480-6560万台，同比增长2.5%-3.2%，连续多季度正增长但增速低于预期。关键警示：需求被此前预测透支，机构将2026年全年预期大幅下调至同比下滑11.3%。区域分化：EMEA增7.4%、亚太增4.3%；美洲唯一负增长市场。联想Q1出货1650万台增9%，市占超25%领跑全球。对联想SSC参考：全年出货前高后低态势确立，需动态调整备件库存规划。'
                }
            ],
            ai: [
                {
                    tag: 'AI模型',
                    title: 'GPT-6预训练完成+DeepSeek V4发布+Claude Opus 4.6升级：AI大模型进入"三国杀"格局',
                    source: 'CSDN / AI Hub',
                    date: '2026-04-12',
                    summary: '2026年4月AI大模型迎来爆发式更新：OpenAI宣布GPT-6预训练完成、DeepSeek V4全流程采用华为昇腾950芯片+自研HBM、Claude Opus 4.6在中文写作和长文处理上超越GPT-5.4。国产模型密集发布：阿里HappyHorse、智谱GLM-5.1取得关键技术突破。全球监管加速落地：中国出台AI拟人化互动管理办法，欧盟拟将ChatGPT列为高风险AI系统。对联想影响：AI大模型算力需求持续驱动服务器存储采购，间接支撑联想ISS业务增长。'
                },
                {
                    tag: 'AI PC渗透',
                    title: 'Gartner预计2026年AI PC出货1.43亿台：渗透率达55%，企业采购成最大变量',
                    source: 'Gartner / ESM China',
                    date: '2026-04-07',
                    summary: 'Gartner预计2026年AI PC出货约1.43亿台，渗透率将达55%左右。需求分化明显：消费端买单主要是重度生产力创作者和早期尝鲜者；美国大企业倾向云端/SaaS；中国AI原生公司和中小软件设计团队更积极，将AI PC视为标配。对联想SSC影响：AI PC机型已占出货三成以上，备件规划需重点关注Copilot+标准配置（16GB+256GB起）对应的存储备件成本上升问题。ThinkPad 4月22日发布会将发布搭载天禧AI生态的全系新品。'
                }
            ],
            lenovo: [
                {
                    tag: '供应链排名',
                    title: 'Gartner 2026供应链榜单：联想升至第8，连续三年领跑中国科技企业',
                    source: 'Gartner / 21世纪经济报道',
                    date: '2026-04-15',
                    summary: '联想位列第8位，较2025年上升2位。核心优势：智能排产系统覆盖全球40+工厂、端到端数字化覆盖率超90%、供应商协同平台连接1200+合作伙伴。对SSC启示：供应链排名提升意味着成本管控能力得到全球认可，需持续优化备件库存周转效率。'
                },
                {
                    tag: 'ThinkPad发布',
                    title: 'ThinkPad 2026新品暨天禧AI生态发布定档4月22日：X1 Carbon/X9等全系亮相',
                    source: 'IT之家 / 新浪财经',
                    date: '2026-04-07',
                    summary: '联想ThinkPad官方确认，2026年度新品暨天禧AI生态发布会将于4月22日举行，主题"我·即我们"。ThinkPad 2026款X1 Carbon、X9-15p、X14等多款新品已完成线上上架。聚焦超级个体与AI生态融合创新，预计搭载全新NPU和Copilot+ PC认证。对SSC参考：新品发布意味着对应机型备件SKU将更新，需提前准备新机型关键备件（LCD/MB/SSD）的采购计划。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】存储长协时代来临：备件采购策略调整建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-16',
                    summary: '基于最新市场动态的SSC成本团队建议：1）三星/海力士转向3-5年长协，存储合约价Q2后有望趋稳，建议尽快加入长协框架；2）联想港股HK$9.20（+1.55%），市值约$167.6亿；3）ThinkPad 4月22日发布会即将举行，提前准备新机型备件SKU；4）Q1出货全年预期下调至-11.3%，Q3备件需求或低于此前预期；5）DDR5现货继续回落，可少量机会性采购但核心仍以合约为主。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-16', label: '2026-04-16（今日）'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
