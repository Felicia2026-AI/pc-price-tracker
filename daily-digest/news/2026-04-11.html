<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 242.50,
                change: 4.3,
                trend: 'up',
                date: '2026-04-11',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 787,
                change: 1,
                trend: 'up',
                date: '2026-04-11',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${priceData.ddr5.change}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'PC市场',
                    title: '全球PC市场"最后的狂欢"：上游涨价倒逼行业洗牌，中小品牌博弈求生',
                    source: '腾讯新闻 / 每日经济新闻',
                    date: '2026-04-10~11',
                    summary: '2026年存储芯片、CPU等上游元器件持续涨价（内存较年初涨331%、SSD涨56%），叠加AI转型成本压力，全球PC市场进入深度洗牌期。头部厂商（联想、惠普、戴尔）凭借供应链议价能力和AI产品布局抢占份额，中小品牌面临利润压缩与出货萎缩双重挑战。行业共识：2026年下半年出货量可能承压，但AI PC渗透率突破50%将成为新的增长引擎。'
                },
                {
                    tag: '存储',
                    title: 'SSD价格持续飙升：2TB消费级SSD高达649美元，AI内存短缺引发存储连锁涨价',
                    source: 'aitoolly / 全球半导体观察',
                    date: '2026-04-09~11',
                    summary: '受AI相关内存短缺连锁反应影响，SSD存储市场剧烈波动。以WD Black SN850X 2TB为例，价格从2024年的173美元飙升至649美元（+275%）。企业级SSD涨幅更甚，NAND Flash合约价TrendForce预测Q2季增70-75%。对SSC影响：存储类备件采购成本持续攀升，需关注替代方案和合约锁价窗口。'
                },
                {
                    tag: 'GPT-6',
                    title: 'GPT-6定档4月14日发布！性能暴涨40%，原生多模态+200万Token上下文',
                    source: '腾讯新闻 / 知乎',
                    date: '2026-04-09~11',
                    summary: 'OpenAI正式确认，代号"Spud（土豆）"的GPT-6将于4月14日全球同步发布。核心升级：性能较GPT-5.4提升40%，支持200万Token超长上下文窗口，原生多模态能力（文本+图像+音频+视频），被内部定义为冲刺AGI的"最后20%"。该发布将对AI应用开发、企业级AI部署产生深远影响。'
                }
            ],
            ai: [
                {
                    tag: 'AI工具',
                    title: '2026年4月AI编程工具终极横评：Cursor 3、Claude Code、GitHub Copilot三足鼎立',
                    source: 'CSDN AI编程频道',
                    date: '2026-04-10~11',
                    summary: '2026年AI编程工具已进入"自主Agent"时代。Cursor 3发布Glass界面与多Agent并行协作；Claude Code以SWE-bench 80.8%登顶编程能力榜首；GitHub Copilot依托微软生态优势保持最大用户群。三款工具在代码补全→Bug修复→自主开发全链条上的能力持续进化，开发者效率提升5-10倍。'
                },
                {
                    tag: '开源模型',
                    title: 'Google Gemma 4发布：Apache 2.0许可，四款开源模型覆盖移动端到数据中心',
                    source: 'Google DeepMind / CSDN',
                    date: '2026-04-08~11',
                    summary: 'Google DeepMind发布Gemma 4系列开源模型（4月2日正式上线），共四款规格：1B（移动端）、4B、9B、27B（数据中心级）。基于Gemini 3同源技术构建，全系列原生支持多模态（文本+图像），专为多步骤规划和自主Agent工作流设计。许可从Gemma License切换为Apache 2.0，商业使用零限制，对开发者生态意义重大。'
                }
            ],
            lenovo: [
                {
                    tag: '战略',
                    title: '联想2026/27财年誓师大会：混合式AI战略交付年，推进向AI原生公司转型',
                    source: '新华网',
                    date: '2026-04-01~11',
                    summary: '联想集团4月1日在北京举行2026/27财年誓师大会中国站，明确新财年为"混合式AI战略交付年"。核心战略：从硬件厂商向AI原生公司转型，依托天禧个人超级智能体（DingOS）打造AI PC生态，中国方案服务业务持续发力企业级。杨元庆设定未来两年营收突破千亿美元目标。'
                },
                {
                    tag: '行业地位',
                    title: 'IDC Q1数据夯实联想龙头地位：出货增速为行业均值3.4倍，AI PC份额42.8%历史峰值',
                    source: 'IDC / 新浪财经',
                    date: '2026-04-09~11',
                    summary: '联想AI赋能PC行业成效显著：IDC Q1全球PC出货6560万台（+2.5%），联想以1650万台（+8.6%）、25.2%份额蝉联第一，增速为行业均值的3.4倍。AI PC出货253万台（FY2025/26），全球市场份额42.8%创历史峰值。高盛将联想纳入亚太买入名单，ThinkPad 2026新品发布会定档4月22日。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `../news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
