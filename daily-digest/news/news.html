<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报 2026-04-13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date">2026年4月13日 星期一</div>
            <div class="update-time">每日10:00自动更新</div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 238.00,
                change: -0.8,
                trend: 'down',
                date: '2026-04-13',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 790,
                change: 0.1,
                trend: 'up',
                date: '2026-04-13',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: 'TrendForce预测Q2 DRAM合约价再涨58-63%：存储超级周期至少火到2026年底',
                    source: 'TrendForce / 上海证券报',
                    date: '2026-04-07~13',
                    summary: 'TrendForce集邦咨询最新预测：2026年Q2存储器市场将迎来更剧烈涨价。AI算力军备竞赛驱动下，原厂产能大幅向HBM、Server DRAM及企业级SSD倾斜，通用型DRAM合约价预计环比再涨58-63%。自2025年9月末本轮涨价行情启动至2026年3月底，DDR4涨幅已超300%，DDR5涨幅更甚。存储涨价潮已从服务器蔓延至PC、手机全产业链。对SSC启示：备件采购需提前锁定合约价，关注DDR5等关键料的库存策略。'
                },
                {
                    tag: '消费级内存',
                    title: '海盗船128GB DDR5套装飙至2.8万元：AI产能倾斜致消费级硬件持续涨价',
                    source: '网易科技 / 新浪财经',
                    date: '2026-04-11~13',
                    summary: '2026年4月11日，海盗船128GB DDR5内存套装（Corsair Vengeance）标价高达4199美元（约2.8万人民币），再度刷新消费级内存价格天花板。分析指出：AI算力需求导致HBM产能挤占标准DRAM产能，DDR5供应持续紧张。128GB套装涨价幅度远超16GB/32GB，暗示PC发烧友和专业工作站市场正在承受最大压力。对SSC参考：高端PC备件涨价压力将持续，建议提前规划Q2采购预算。'
                },
                {
                    tag: 'HBM竞争',
                    title: '存储三强扩产竞赛白热化：三星/海力士/美光策略分化，HBM格局重塑',
                    source: '雪球 / 21世纪经济报道',
                    date: '2026-04-10~13',
                    summary: '截至2026年4月，三星、SK海力士、美光三大存储巨头围绕AI驱动的HBM需求展开全面扩产竞赛。三星以平泽P4为短期主力、P5与德州泰勒厂为长期储备；SK海力士加速利川M15X扩产；美光也在扩大台湾产能。三星与SK海力士双双入围英伟达Rubin HBM4供应商名单，打破SK海力士垄断格局第一步。对联想SSC启示：HBM供应格局变化将影响服务器备件采购策略。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6',
                    title: 'GPT-6明日重磅发布倒计时1天：代号Spud、训练成本20亿美元、10万张H100',
                    source: 'IT之家 / 量子位',
                    date: '2026-04-13',
                    summary: 'OpenAI宣布GPT-6将于4月14日正式发布（代号Spud/土豆），训练成本超20亿美元，动用约10万张H100 GPU在德克萨斯Stargate数据中心完成。核心参数：Symphony架构+200万Token超长上下文，原生多模态，性能较GPT-5.4暴涨40%。OpenAI CEO Altman称之为"人类最后需要记住的API"。发布后48小时内，全球AI应用生态将迎来重构。对SSC启示：AI PC需求将进一步上行，存储备件价格获新支撑。'
                },
                {
                    tag: 'AI PC',
                    title: 'AI PC硬件涨价风暴加剧：DDR5降价能否扭转颓势？整机涨价15-20%成定局',
                    source: '搜狐科技 / IT之家',
                    date: '2026-03-31~04-13',
                    summary: '2025年年末至今，存储芯片引发的AI PC硬件涨价潮席卷全产业链。尽管消费级DDR5出现小幅回调，但服务器级DDR5、企业级SSD、显卡、CPU几乎所有核心硬件仍维持高位。面板、镜头等非存储零部件也在酝酿涨价，PC整机价格2026年下半年预计再涨15-20%。对SSC启示：零部件涨价传导路径需持续跟踪，备件成本管控压力加大。'
                }
            ],
            lenovo: [
                {
                    tag: 'IDC数据',
                    title: 'IDC数据：联想Q1 PC出货量1650万台同比+8.6%，份额25.2%蝉联全球第一',
                    source: 'IDC / 199it',
                    date: '2026-04-08~13',
                    summary: 'IDC最新数据显示，2026年Q1联想PC出货量1650万台，同比+8.6%（远超市场平均2.5%），以25.2%市场份额蝉联全球第一。分析认为：Windows换机周期+AI PC预期驱动Q1需求；零部件涨价预期促使品牌提前拉货。对SSC启示：联想PC出货增长利好备件需求，但成本管控压力同步上升。'
                },
                {
                    tag: '新品发布',
                    title: 'ThinkPad 2026发布会倒计时9天：4月22日天禧AI生态全面亮相',
                    source: 'IT之家 / ZOL中关村在线',
                    date: '2026-04-13',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布会将于4月22日在北京举行，主题"我·即我们"。预告机型含ThinkPad X1 Carbon 2026、X9-15p、X14等旗舰，均搭载天禧AI生态（DingOS）。结合4月1日誓师大会"混合式AI战略交付年"定位，ThinkPad新品将全面拥抱AI PC时代。关注新品发布对备件供应链的影响。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-13', label: '2026-04-13（今日）'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
