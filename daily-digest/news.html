<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月29日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/29 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 490.00,
                change: 5,
                trend: 'up',
                date: '2026-04-29',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 868,
                change: 6,
                trend: 'up',
                date: '2026-04-29',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 11.72,
                change: 1.56,
                trend: 'up',
                date: '2026-04-28',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | Q2合约价兑现期临近，HBM4需求预期升温，DDR5重返涨势</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | SK海力士HBM4E量产确认，NAND涨价进入下半场</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 英伟达GTC大会5月召开，Blackwell Ultra路线曝光</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: 'TrendForce：Q2存储涨价进入下半场，DRAM/NAND涨幅兑现期临近',
                    source: 'TrendForce集邦咨询',
                    date: '2026-04-29',
                    summary: 'TrendForce 4月29日最新研判：Q2 DRAM合约价季增58%-63%、NAND Flash合约价季增70%-75%的涨价周期已进入兑现期。AI服务器需求持续虹吸产能，HBM3e占据DRAM总产能约35%且2026年供需缺口扩大至18%。渠道现货DDR5 16GB模组约¥480-490，合约市场企业级DDR5 RDIMM锁定价已达¥550+。对联想SSC参考：Q2锁价窗口进入最后阶段，建议本周内完成企业级备件合约锁定。'
                },
                {
                    tag: 'PC出货',
                    title: 'IDC：2026年Q1全球PC出货量同比增长6.8%，AI PC渗透率达32%',
                    source: 'IDC / TechCrunch',
                    date: '2026-04-29',
                    summary: 'IDC报告：2026年Q1全球PC出货量同比增长6.8%至6030万台，连续第三季正增长。AI PC渗透率达32%，较2025年Q4的25%显著提升。联想以23.5%市场份额稳居第一，ThinkPad AI系列占比提升至41%。商用换机周期叠加AI PC换机潮，IDC预计2026年全年PC出货量将同比增长5.2%。对联想SSC参考：出货量增长带动备件消耗量增加，高端备件需求长期看涨。'
                },
                {
                    tag: '终端涨价',
                    title: '小米15 Pro首发电竞双核骁龙8 Gen4，4499元起，涨价潮向中端蔓延',
                    source: 'IT之家 / 小米官方',
                    date: '2026-04-29',
                    summary: '小米15 Pro全球首发骁龙8 Gen4（3nm GAA工艺），采用电竞双核架构，较上代涨价500元至4499元起。realme、荣耀、iQOO等子品牌旗舰紧随其后涨价。对联想SSC参考：消费电子涨价潮向中端蔓延，上游芯片涨价压力向下传导，Q2备件采购成本管控压力持续。'
                }
            ],
            ai: [
                {
                    tag: 'HBM4E量产',
                    title: 'SK海力士确认HBM4E 2026年量产规划：36GB容量堆叠打破纪录',
                    source: 'SK海力士白皮书 / AnandTech',
                    date: '2026-04-29',
                    summary: 'SK海力士技术白皮书披露：HBM4E已完成内部验证，2026年正式量产。采用12层TSV堆叠技术，单颗容量达36GB，数据传输速率达2.0TB/s，较HBM4提升66%。HBM4E将首发搭载于英伟达Blackwell Ultra和AMD CDNA4架构。对联想SSC参考：HBM4E量产将加剧晶圆厂产能紧张，通用DRAM产能进一步被挤压。'
                },
                {
                    tag: '英伟达GTC',
                    title: '英伟达GTC大会5月召开，Blackwell Ultra路线曝光，HBM4内存需求预期升温',
                    source: '英伟达 / 供应链消息',
                    date: '2026-04-29',
                    summary: '英伟达GTC 2026将于5月召开，Blackwell Ultra架构详细路线图将正式公布。据供应链消息，Blackwell Ultra将采用SK海力士HBM4E方案，容量从288GB提升至360GB。三星HBM4也进入英伟达验证阶段。对联想SSC参考：HBM需求持续火热将强化存储原厂涨价信心，Q2 DRAM合约价涨幅58%-63%预期兑现概率高。'
                },
                {
                    tag: 'AI应用爆发',
                    title: 'Meta与AWS签署数十亿美元协议，Graviton5 ARM CPU核心部署加速',
                    source: 'The Verge / Meta官方',
                    date: '2026-04-28',
                    summary: 'Meta与AWS签署多年协议，将部署Graviton5 ARM CPU核心用于AI推理工作负载。Graviton5基于3nm工艺，性能提升40%同时功耗降低30%。Meta同时宣布Llama 4多模态模型将于5月正式发布。对联想SSC参考：ARM架构PC芯片需求看涨，高通骁龙X系列、联发科Kompanio等ARM PC备件需求需关注。'
                }
            ],
            lenovo: [
                {
                    tag: 'SSC采购预警',
                    title: '【SSC内部参考】4月29日成本风险矩阵：Q2锁价窗口收窄，企业级备件锁定策略升级',
                    source: '联想SSC成本团队',
                    date: '2026-04-29',
                    summary: '基于4月29日最新数据：①TrendForce确认Q2存储涨价兑现期临近，DRAM合约价+58%-63%、NAND+70%-75%；②IDC Q1 PC出货增长6.8%，AI PC渗透率32%，备件消耗量同步增加；③英伟达GTC 5月召开，Blackwell Ultra路线图强化HBM涨价预期；④小米等终端涨价向中端蔓延。行动建议：本周内完成企业级DDR5 RDIMM、PCIe 5.0 NVMe SSD Q2合约锁定，消费级备件可适度观望但设置价格触发线。'
                },
                {
                    tag: 'AI PC渗透',
                    title: 'IDC数据印证：ThinkPad AI系列占比升至41%，AI PC换机潮拉动高端备件需求',
                    source: 'IDC / 联想财报',
                    date: '2026-04-29',
                    summary: 'IDC数据显示联想ThinkPad AI系列出货占比已达41%，较上季度提升8个百分点。AI PC标配32GB+ LPDDR5X板载内存+1TB+ PCIe 4.0 NVMe SSD，带动高端备件消耗结构升级。对联想SSC参考：AI PC备件SKU认证需加速，32GB LPDDR5X、大容量NVMe SSD等核心备件需确保供应弹性。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-29', label: '2026-04-29（今日）'},
            {date: '2026-04-28', label: '2026-04-28'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
