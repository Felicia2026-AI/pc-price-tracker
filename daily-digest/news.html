<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 518.00,
                change: 2,
                trend: 'down',
                date: '2026-04-17',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 815,
                change: 11,
                trend: 'up',
                date: '2026-04-17',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.35,
                change: 0.05,
                trend: 'down',
                date: '2026-04-16',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | TrendForce全面上修Q1 DRAM涨幅至90-95%，现货小幅回落</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | 三星Q1 NAND涨价100%已执行，Q2或继续涨</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股小幅回调，市场观望情绪浓厚</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'TrendForce',
                    title: 'TrendForce全面上修Q1 DRAM涨幅至90-95%、NAND至55-60%',
                    source: 'TrendForce集邦咨询 / 佰维存储财报',
                    date: '2026-04-17',
                    summary: 'TrendForce集邦咨询最新数据显示，2026年Q1 DRAM合约价涨幅从初估的55-60%全面上修至90-95%，NAND Flash合约价从33-38%上修至55-60%，不排除进一步上修空间。AI与数据中心需求持续加剧全球存储器供需失衡，原厂议价能力有增无减。对联想SSC参考：备件成本压力超预期，建议立即启动Q2锁单谈判。'
                },
                {
                    tag: '三星涨价',
                    title: '三星NAND闪存Q1涨价100%已执行，Q2或继续上涨',
                    source: '新浪财经 / 韩国媒体',
                    date: '2026-04-17',
                    summary: '据韩国媒体报道，三星电子在2026年Q1已将NAND闪存供应价格上调100%以上，涨幅远超市场预期。这是继DRAM内存价格上调近70%之后，存储市场的又一重磅调价信号。三星已开始与客户就Q2 NAND价格进行新一轮谈判，市场普遍预计Q2涨价势头将延续。对SSC参考：NAND成本翻倍直接影响SSD备件采购，需加速锁单。'
                },
                {
                    tag: '内存厂',
                    title: '内存厂盈利暴涨却担忧扩产：HBM吞噬通用产能格局难改',
                    source: '36氪 / 行业分析',
                    date: '2026-04-17',
                    summary: '36氪深度报道：三星半导体Q4利润同比暴涨250%，SK海力士营业利润率逼近56%。但高管们反而担忧扩产——内存行业历史教训让管理层对扩产保持克制。AI服务器持续吞噬HBM产能，通用DRAM/NAND排产表已延后一年半以上。对联想SSC启示：供应紧张格局3-5年内难以改变，必须建立长期锁价机制。'
                }
            ],
            ai: [
                {
                    tag: 'AI服务器',
                    title: 'AI服务器需求持续吞噬HBM产能，通用芯片供应持续收紧',
                    source: '行业分析 / 36氪',
                    date: '2026-04-17',
                    summary: 'AI数据中心需求激增导致HBM先进制程产能被AI服务器牢牢占据，通用DRAM/NAND排产计划已延后一年半以上。据渠道反馈，部分消费级存储产品需提前50万保证金才能获得工厂配额，货期已排至2027年。对联想SSC影响：关键备件必须提前锁量锁价，不能依赖正常供应周期。'
                },
                {
                    tag: '涨价传导',
                    title: '存储涨价传导至整机：主流笔记本可能涨价40%',
                    source: 'TrendForce / 快科技',
                    date: '2026-04-17',
                    summary: 'TrendForce警告：2026年主流笔记本电脑型号可能涨价40%。戴尔12月已提价15-20%，联想像涨5-20%。涨价主要受内存通胀(memflation)推动，DRAM/NAND组件成本快速上涨，对低利润率产品影响尤为明显。对联想SSC启示：成本管控需更加精细化，锁价周期要覆盖到整机定价周期。'
                }
            ],
            lenovo: [
                {
                    tag: 'Gartner',
                    title: 'Gartner：2026 Q1全球PC出货增4%，联想稳居第一',
                    source: 'Gartner / 中国产业经济信息网',
                    date: '2026-04-17',
                    summary: 'Gartner最新数据显示，2026年Q1全球PC出货增长4%至约6480万台。联想市占超25%稳坐第一，华硕超越宏碁升至第五。但涨价主要受内存通胀推动，对低利润率产品影响尤为明显。分析师指出：存储涨价传导至整机已成定局，Q2起各厂商将面临更大的成本压力与定价挑战。'
                },
                {
                    tag: 'Omdia数据',
                    title: 'Omdia：Q1联想PC占比超1/4，出货1650万台继续领跑',
                    source: '快科技 / Omdia',
                    date: '2026-04-17',
                    summary: 'Omdia数据显示2026年Q1全球PC出货达6480万台，同比涨3.2%。联想出货约1650万台，市占超25%继续领跑。分析师指出：存储涨价传导至整机已成定局，Q2起各厂商将面临更大的成本压力与定价挑战。对SSC参考：出货领先意味着备件需求量大，更需做好锁价与库存管理。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】TrendForce全面上修后的备件采购紧急建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-17',
                    summary: '基于TrendForce最新上修数据的SSC成本团队紧急建议：1）Q1 DRAM涨幅上修至90-95%、NAND至55-60%，成本压力超预期；2）三星NAND涨价100%已执行，Q2或继续涨；3）联想Q1出货1650万台市占25%+稳居第一，备件需求量维持高位；4）内存厂盈利暴涨但担忧扩产，供应紧张格局3-5年难改；5）建议立即启动Q2-Q3锁单，锁定3-6个月用量。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
