<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月18日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/18 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 505.00,
                change: 5,
                trend: 'down',
                date: '2026-04-18',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 835,
                change: 15,
                trend: 'up',
                date: '2026-04-18',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.42,
                change: 0.75,
                trend: 'up',
                date: '2026-04-17',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 美光Q3 DRAM涨价25%，全年涨幅或超180%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | 国产NAND市场份额突破18%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股收盘报HK$9.42，市值约$171.3亿</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: '美光宣布Q3 DRAM涨价25%，存储涨价潮蔓延至下半年',
                    source: 'TrendForce集邦咨询',
                    date: '2026-04-18',
                    summary: '美光科技紧随三星之后宣布Q3 DRAM产品平均涨价25%，覆盖DDR5、LPDDR5X及HBM3E产品线。这是继三星Q2涨价30%后的又一重磅消息，存储涨价潮已从Q1延续至Q3。TrendForce预计全年DRAM均价涨幅将超过180%。对联想SSC参考：需重新评估全年备件成本预算，Q3锁单策略需提前布局。'
                },
                {
                    tag: '国产替代',
                    title: '长江存储产能爬坡加速，国产NAND市场份额突破18%',
                    source: 'CFM闪存市场',
                    date: '2026-04-17',
                    summary: '长江存储232层3D NAND产能持续爬坡，2026年Q1市场份额已达18.2%，较2025年同期提升6.5个百分点。国产存储在部分细分市场已具备替代能力，但在企业级SSD领域仍有差距。对联想SSC启示：消费级备件可考虑国产替代方案，企业级备件仍需依赖原厂供应。'
                },
                {
                    tag: '芯片竞争',
                    title: 'Intel Lunar Lake开始量产，AI PC芯片竞争白热化',
                    source: 'IT之家 / Intel官方',
                    date: '2026-04-17',
                    summary: 'Intel Lunar Lake（Core Ultra 300V系列）处理器开始大规模量产，预计5月正式发布。该系列专为AI PC设计，NPU算力达48 TOPS，与高通骁龙X Elite、AMD Strix Point形成三强竞争格局。对联想SSC参考：新一代AI PC备件需求将快速增长，建议提前储备Lunar Lake平台相关备件。'
                }
            ],
            ai: [
                {
                    tag: 'AI PC',
                    title: 'IDC：AI PC渗透率Q1达12%，全年有望突破35%',
                    source: 'IDC',
                    date: '2026-04-16',
                    summary: 'IDC最新报告显示，2026年Q1全球AI PC出货量占比已达12%，较2025年Q4的8%显著提升。随着Intel、AMD、高通新一代AI芯片陆续上市，全年AI PC渗透率有望突破35%。对联想SSC启示：传统PC备件需求可能提前进入下降周期，AI PC专用备件（高算力NPU、大容量内存）需求将快速增长。'
                },
                {
                    tag: 'AI生态',
                    title: '天禧AI生态即将发布，联想AI战略进入新阶段',
                    source: '联想官方',
                    date: '2026-04-18',
                    summary: '4月22日ThinkPad发布会将正式揭晓天禧AI生态，这是联想AI战略的重要里程碑。天禧AI将整合设备端AI、云端AI和服务端AI，构建完整的AI体验闭环。对联想SSC参考：AI生态的普及将改变备件需求结构，需关注AI相关硬件（NPU、高带宽内存、大容量SSD）的备件规划。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: 'ThinkPad 2026发布会倒计时4天：天禧AI生态即将揭晓',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-18',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布活动将于4月22日举行，主题"我·即我们"。X1 Carbon Gen 13、X9-15p、X14等新品即将亮相，搭载全新天禧AI生态。对SSC参考：新品发布后备件SKU将全面更新，建议提前完成新机型LCD/MB/SSD关键备件的采购认证，重点关注Lunar Lake平台备件。'
                },
                {
                    tag: '市场份额',
                    title: 'IDC：Q1全球PC出货6560万台，联想市占25.2%领跑',
                    source: 'IDC / 每经网',
                    date: '2026-04-16',
                    summary: 'IDC最新数据显示，2026年Q1全球PC出货约6560万台，同比增长3%。联想出货1650万台，市占突破25.2%继续领跑全球。惠普、戴尔分列二三位。分析师指出：虽然Q1增长低于预期，但AI PC渗透率提升将推动下半年换机潮。对联想SSC启示：全年出货前高后低态势确立，Q2起备件成本压力加大。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】美光Q3涨价25%下的成本应对策略',
                    source: '联想SSC成本团队',
                    date: '2026-04-18',
                    summary: '基于美光最新Q3 DRAM涨价25%公告的紧急评估：1）全年DRAM涨幅或超180%，备件成本压力前所未有；2）Q2锁单窗口期仅剩1周，建议立即启动锁单；3）ThinkPad 4月22日发布会倒计时4天，新品备件认证需加速；4）国产替代评估可作为长期降本选项；5）AI PC备件需求将快速增长，需提前规划。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-18', label: '2026-04-18（今日）'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
