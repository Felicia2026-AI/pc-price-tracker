<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 533.00,
                change: -2,
                trend: 'down',
                date: '2026-04-14',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 795,
                change: 3,
                trend: 'up',
                date: '2026-04-14',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5回调',
                    title: 'DDR5现货530元再跌5元，连续三周回调：渠道库存持续释放',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-14',
                    summary: '2026年4月14日当周，DDR5 16GB模组现货价格继续回落至530元（↓5元），连续三周小幅回调。TrendForce分析：渠道商Q1囤积库存持续释放，现货价格短期承压；但Q2 DRAM合约价环比再涨58-63%的预测维持不变，HBM挤占通用DRAM产能态势持续。消费级DRAM淡出市场速度超预期。对SSC启示：现货端回调是短期采购窗口，建议适度增加即期采购。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 795元续涨3元：NAND原厂5月涨价15-20%正式敲定',
                    source: '上海证券报 / IT之家',
                    date: '2026-04-14',
                    summary: '2026年4月14日当周，企业级1TB SSD渠道价续涨3元至795元。三星、SK海力士、美光三大原厂5月新一轮涨价计划正式敲定，幅度15-20%，主要针对高密度QLC NAND和大容量企业级SSD。供应链消息：AI服务器需求持续爆发，QLC晶圆产能紧张局面短期无解。对联想SSC参考：立即启动5月前锁量锁价计划。'
                },
                {
                    tag: '存储周期',
                    title: 'TrendForce上调Q2 NAND涨幅至75-80%：AI服务器QLC需求超预期',
                    source: '雪球 / 21世纪经济报道',
                    date: '2026-04-14',
                    summary: 'TrendForce最新预测（4月14日）：鉴于AI服务器对高密度QLC NAND需求超预期，2026年Q2 TLC/QLC NAND价格涨幅从30-35%大幅上调至75-80%。分析指出：PLC（五层单元）商业化因良率问题推迟至2027年，短期无法缓解供应。本轮涨价周期预计至少持续至2026年底。对SSC启示：Q2-Q3采购预算需持续上调，建议签订长期框架协议锁定价格。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6发布',
                    title: 'GPT-6正式发布：代号Spud、200万Token、Altman称"新纪元开始"',
                    source: 'OpenAI / The Verge / TechCrunch',
                    date: '2026-04-14',
                    summary: 'OpenAI于4月14日正式发布GPT-6（代号Spud），训练成本超20亿美元，动用约10万张H100 GPU。核心参数：Symphony架构+200万Token超长上下文（支持一次性处理整本书），原生多模态，性能较GPT-5.4暴涨40%。CEO Altman称之为"新纪元的开始"。对企业影响：本地+云端混合架构或成主流，AI PC换机需求将呈爆发式增长。'
                },
                {
                    tag: '国产AI',
                    title: 'DeepSeek V4全面适配华为昇腾950PR：国产AI芯片推理能力追平H100',
                    source: '36氪 / 知乎 / 华为官方',
                    date: '2026-04-14',
                    summary: 'DeepSeek V4已完成与华为昇腾950PR的全面适配，多个基准测试显示推理性能与英伟达H100相当。华为昇腾950PR采用国产7nm工艺，Q2末月产能预计达10万片。业内分析：昇腾950PR的突破标志着国产AI芯片在大模型推理领域正式具备竞争力，将推动国内企业本地AI部署成本下降30-40%。'
                }
            ],
            lenovo: [
                {
                    tag: 'Omdia Q1数据',
                    title: 'Omdia：联想Q1份额25%+蝉联全球第一，PC出货量同比增长3.2%',
                    source: 'Omdia / 快科技 / 新浪科技',
                    date: '2026-04-14',
                    summary: 'Omdia最新数据显示，2026年Q1全球PC出货量6484万台，同比增长3.2%。联想以超过25%市场份额蝉联全球第一，出货量增速持续跑赢大市。受益于AI PC新品推出和ThinkPad产品线更新，联想在全球PC市场复苏中持续领跑。'
                },
                {
                    tag: 'ThinkPad倒计时',
                    title: '联想ThinkPad发布会倒计时8天：X1 Carbon 2026成本上涨20-25%',
                    source: '格隆汇 / IT之家',
                    date: '2026-04-14',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，倒计时8天。新一代ThinkPad X1 Carbon将搭载英特尔Panther Lake Core Ultra 300系列和AMD Zen 5 Ryzen AI 400系列双平台。供应链最新消息：新品零部件成本上涨主要来自DDR5涨价、SSD涨价、新一代NPU芯片成本，预计起售价将达16499元。对SSC启示：关注新品上市后旧款零部件清仓需求。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
