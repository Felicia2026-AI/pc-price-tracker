<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI PC前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月18日星期六';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/18 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 508.00,
                change: 7,
                trend: 'down',
                date: '2026-04-18',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 845,
                change: 10,
                trend: 'up',
                date: '2026-04-18',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.42,
                change: 0.75,
                trend: 'up',
                date: '2026-04-17',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | TrendForce上调Q2 DRAM涨幅预估至58-63%，现货市场观望</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND涨价持续，Q2合约价预计再涨70-75%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股反弹，ThinkPad发布会预期提振</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'TrendForce',
                    title: 'TrendForce大幅上调Q2 DRAM涨幅预估至58-63%',
                    source: 'TrendForce集邦咨询 / 金融界',
                    date: '2026-04-17',
                    summary: 'TrendForce集邦咨询最新报告显示，Q2一般型DRAM合约价环比涨幅预估上调至58-63%，远超此前预期。Q1已涨90-100%，两季累计涨幅超200%。云服务商愿意支付更高价格并签多季协议抢货。对联想SSC参考：备件成本管控窗口期急剧收窄，建议立即启动Q2锁单；国产替代评估需提速。'
                },
                {
                    tag: '现货市场',
                    title: '存储现货市场观望加剧：DDR4小幅下跌0.48%',
                    source: 'TrendForce / 腾讯新闻',
                    date: '2026-04-16',
                    summary: 'TrendForce最新现货价格追踪显示，主流DDR4 1Gx8 3200MT/s现货均价本周小幅下滑0.48%，由上周33.56美元降至33.40美元。市场观望情绪加重，部分贸易商开始小幅让利出货。对联想SSC启示：现货价回调不改合约价大涨趋势，Q2 DRAM采购仍以合约锁定为主。'
                },
                {
                    tag: 'NAND涨价',
                    title: 'Q2 NAND合约价预计再涨70-75%，SSD成本压力持续',
                    source: 'TrendForce集邦咨询',
                    date: '2026-04-17',
                    summary: 'TrendForce预测Q2 NAND Flash合约价涨幅将达70-75%，延续强劲上涨态势。AI服务器需求爆发导致HBM产出占比提升，通用NAND产能持续收紧。对联想SSC启示：1TB+ SSD备件采购需加快锁单节奏，国产长江存储颗粒替代方案评估需提速。'
                }
            ],
            ai: [
                {
                    tag: 'AI PC新品',
                    title: '荣耀"养虾本"MagicBook 4/16全球首发，AI PC家族全面爆发',
                    source: 'PConline / 荣耀官方',
                    date: '2026-04-16',
                    summary: '荣耀于4月16日全球首发"养虾本"MagicBook，搭载自研AI助手YOYO。4月荣耀PC家族密集发布：MagicBook 14/16、数字系列、Pro系列、WIN旗舰游戏本全系登场。对联想ThinkPad参考：需关注差异化竞争策略，新品发布会（4/22）至关重要。'
                },
                {
                    tag: '鸿蒙PC',
                    title: '华为首款鸿蒙PC MateBook 14将于4月20日发布',
                    source: '中关村在线 / 华为官方',
                    date: '2026-04-14',
                    summary: '华为宣布MateBook 14鸿蒙版将于4月20日14:30发布，搭载麒麟芯片。这是鸿蒙OS首次落地PC领域，标志着华为"1+8+N"生态战略PC环节补全。对联想参考：鸿蒙PC入局将改变PC市场格局，天禧AI生态需加快差异化布局。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: 'ThinkPad 2026发布会倒计时4天：天禧AI生态即将揭晓',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-18',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，主题"我·即我们"。X1 Carbon、X9-15p、X14等重磅新品将亮相，搭载全新天禧AI生态。对SSC参考：新品发布后备件SKU将全面更新，需提前完成新机型LCD/MB/SSD关键备件的采购认证和库存规划。'
                },
                {
                    tag: '预约开启',
                    title: 'ThinkPad 2026新品1元预约开启，4/22首发权益揭晓',
                    source: '中关村在线 / 联想官方',
                    date: '2026-04-15',
                    summary: 'ThinkPad 2026新品预约权益已开启，1元预约可享首发专属优惠。首发期购买ThinkPad 2026新品，可尊享更多专属首发权益。对SSC参考：关注预约数据，预估新品出货节奏，提前备件规划。'
                },
                {
                    tag: 'SSC建议',
                    title: '【周末参考】存储涨价季的SSC应对策略要点',
                    source: '联想SSC成本团队',
                    date: '2026-04-18',
                    summary: '周末策略要点：1）TrendForce上调Q2 DRAM涨幅超预期，锁单窗口急剧收窄；2）ThinkPad 4/22发布会前完成新品备件认证；3）关注荣耀MagicBook、华为鸿蒙MateBook竞品动态；4）国产替代方案评估可作为长期降本选项；5）周末关注港股走势，评估市场情绪。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-18', label: '2026-04-18（今日）'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
