<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月14日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/14 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 530.00,
                change: -5,
                trend: 'down',
                date: '2026-04-14',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 798,
                change: 6,
                trend: 'up',
                date: '2026-04-14',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '长期合约锁定',
                    title: '三星与SK海力士全面转向DRAM长期合约策略，现货流动性收紧',
                    source: '腾讯新闻 / DIGITIMES Asia',
                    date: '2026-04-14',
                    summary: '三星电子与SK海力士两大全球内存巨头已正式全面转向长期合约锁定策略。核心动因：HBM产能扩张持续挤占通用DRAM产能，三星已停止DDR4接单，SK海力士4月全面停产DDR4。分析指出：DDR5现货市场流动性将进一步收紧，短期回调结束后合约价仍将上行。对SSC启示：现货端回调窗口正在收窄，建议加快Q2末采购锁定。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 798元续涨6元：NAND原厂5月涨价15-20%正式确认',
                    source: '上海有色网 / Tom\'s Hardware',
                    date: '2026-04-14',
                    summary: '2026年4月14日当周，企业级1TB SSD渠道价续涨6元至798元。三星、SK海力士、美光三大NAND原厂5月涨价计划正式确认，幅度15-20%，主要针对企业级QLC和大容量SSD。供应链消息：AI服务器需求持续爆发，QLC晶圆产能紧张局面至少持续至Q3。对联想SSC参考：5月涨价前最后窗口期，建议本周内完成Q2末补货计划。'
                },
                {
                    tag: '英伟达动态',
                    title: '英伟达Blackwell Ultra B300供应链升温：HBM3e需求超预期，存储涨价周期延长',
                    source: 'Nasdaq / 电子工程专辑',
                    date: '2026-04-14',
                    summary: '英伟达Blackwell Ultra B300 GPU将于Q3量产，供应链消息：HBM3e需求超预期，三星和SK海力士已锁定2026年全部HBM产能。分析指出：HBM产能争夺将通用DRAM和NAND供应进一步收紧，PC和服务器零部件涨价周期或延长至2027年。对联想SSC参考：长期框架协议锁定价量是应对涨价周期的关键策略。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6发布',
                    title: 'GPT-6正式发布：Symphony架构+200万Token，Altman称"AI时代新纪元"',
                    source: 'OpenAI官网 / The Verge / TechCrunch',
                    date: '2026-04-14',
                    summary: 'OpenAI于4月14日正式发布GPT-6（代号Spud），训练成本超20亿美元。核心参数：Symphony架构+200万Token超长上下文，原生多模态，性能较GPT-5.4暴涨40%。CEO Altman称之为"AI时代新纪元的开始"。首批API已开放，企业用户可通过Azure和OpenAI官方获取。对SSC启示：AI PC换机需求加速确认，零部件供应链将持续承压至2026年底。'
                },
                {
                    tag: 'DeepSeek',
                    title: 'DeepSeek V4正式支持GPT-6 API：成本降低90%，企业AI部署进入新阶段',
                    source: 'DeepSeek官网 / 36氪',
                    date: '2026-04-14',
                    summary: 'DeepSeek V4在GPT-6发布当天即宣布全面支持GPT-6 API接入，企业用户可通过DeepSeek平台以更低成本调用GPT-6能力。DeepSeek CEO透露：基于GPT-6的推理成本较GPT-5下降90%，中小企业AI应用门槛大幅降低。业内分析：本地AI+云端GPT-6的混合架构将成为企业主流选择。'
                }
            ],
            lenovo: [
                {
                    tag: 'ThinkPad发布',
                    title: '联想ThinkPad发布会倒计时8天：X1 Carbon 2026定价15999元起',
                    source: '联想官网 / 格隆汇',
                    date: '2026-04-14',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，倒计时8天。新一代ThinkPad X1 Carbon定价15999元起，搭载英特尔Panther Lake Core Ultra 300系列和AMD Zen 5双平台。供应链消息：新品零部件成本上涨约22%，主要来自DDR5内存、SSD和新一代NPU芯片涨价。对SSC启示：新品上市后旧款零部件清仓需求增加，关注库存结构调整窗口期。'
                },
                {
                    tag: '供应链策略',
                    title: '联想应对零部件涨价：长单锁价+国产替代双轨并行',
                    source: '经济观察报 / 雪球',
                    date: '2026-04-14',
                    summary: '面对持续上涨的零部件成本，联想供应链策略浮出水面：1）与三星、SK海力士签订2年长单锁价协议；2）加速导入长江存储SSD和合肥长鑫DRAM作为备选方案。分析师指出：国产替代比例有望从2025年的15%提升至2026年的30%。对SSC参考：关注国产备件的质量认证进度和成本节约空间。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
