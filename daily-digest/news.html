<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 16GB 内存（渠道现货）',
                price: 170,
                change: 0,
                trend: 'flat',
                date: '2026-04-08'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 787,
                change: 2,
                trend: 'up',
                date: '2026-04-08'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">¥${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${priceData.ddr5.change}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">¥${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储',
                    title: 'TrendForce（4月7日）：DDR5现货$37稳守，DDR4合约/现货两端分歧持续扩大',
                    source: 'TrendForce集邦咨询',
                    date: '2026-04-08',
                    summary: 'TrendForce最新数据显示，DDR5 16Gb现货维持$37，DDR4 16Gb颗粒现货小幅回落（-0.08%至$73）。但合约端Q2预涨58-63%预期未变，原厂持续优先供货品牌大厂，渠道满足率偏低。合约价与现货价结构性分歧是当前市场最大特征，对SSC备件采购成本影响需持续追踪。'
                },
                {
                    tag: '渠道',
                    title: 'CFM（4月7日）：DDR5 16GB渠道本周$170持平，消费级松动但供给仍偏紧',
                    source: 'CFM闪存市场',
                    date: '2026-04-08',
                    summary: 'CFM闪存市场4月7日报价：DDR5 UDIMM 16GB 5600维持$170/周持平，DDR5 32GB维持$290，DDR4 16GB维持$90。整体渠道价格本周横盘，但较3月初上涨约50%高位运行。消费级局部降价，企业级产品仍抢手，整体供给偏紧格局短期难以改变。'
                },
                {
                    tag: '市场',
                    title: '每经网：消费级内存降价，企业级仍抢手，供给结构分化加剧',
                    source: '每经网 / CFM',
                    date: '2026-04-08',
                    summary: 'AI需求爆发后，原厂优先保障HBM、DDR5企业级、企业级SSD产能，消费级NAND与DRAM相对充裕，已出现局部降价。Q1原厂服务器及PC NAND/DRAM合约价翻倍增长，消费级涨幅明显偏小。这一分化趋势对PC备件成本管控有重要参考价值。'
                }
            ],
            ai: [
                {
                    tag: 'AI大模型',
                    title: 'DeepSeek V4本月上线，长期记忆+多模态全面升级；GPT-5发布会预告',
                    source: '太平洋科技 / 腾讯科技',
                    date: '2026-04-08',
                    summary: 'DeepSeek V4由创始人梁文锋亲自带队研发，确定4月上线，长期记忆、编程与多模态能力全面升级；OpenAI宣布4月下旬春季发布会推出GPT-5；阿里Qwen3.6-Plus（4/2发布）编程能力国产最强，100万token超长上下文；谷歌Gemma 4（4/5）以310亿参数超越千亿级对手，引爆开源社区。'
                },
                {
                    tag: 'AI趋势',
                    title: '中国大模型周调用量连续三周超越美国，AI智能体从"工具"升级为"数字伙伴"',
                    source: '腾讯云 / 36氪',
                    date: '2026-04-08',
                    summary: '中国大模型周调用量已突破7.359万亿Token，连续三周超越美国，标志国产AI进入集群式超越阶段。AI智能体进化加速：从单任务执行工具升级为能自主拆解任务、调用多工具、持续优化的"数字伙伴"。联想已将AI原生操作系统DingOS部署至Think AI Tiny企业PC，支持OpenClaw一键部署。'
                }
            ],
            lenovo: [
                {
                    tag: '股价',
                    title: '联想集团(0992.HK) 4/8开盘HK$1.24，+0.52%；市值约153亿美元',
                    source: 'MarketCapWatch / 同花顺',
                    date: '2026-04-08',
                    summary: '联想港股（0992.HK）4月8日最新股价HK$1.24，涨幅+0.52%，交易量约1,115万股，总市值约153.42亿美元。5月21日将发布下一季度财报。FY2025/26财年为联想历史最好一年：AI PC出货253万台，市场份额42.8%历史峰值，非PC业务占营收近50%。'
                },
                {
                    tag: '战略',
                    title: '联想发布ThinkPad AI PC新品预告，4月22日发布会；杨元庆：冲击5%净利率',
                    source: '新浪财经 / 中国财富网',
                    date: '2026-04-08',
                    summary: 'ThinkPad AI PC新品暨天禧AI生态发布会定于4月22日举行。联想新财年战略核心：从规模扩张转向盈利质量，目标冲击5%净利率。已推出YOGA AI Mini（个人）和Think AI Tiny（企业）两款"龙虾终端"，搭载DingOS，支持AI原生操作。杨元庆个人捐2亿元回馈上海交大。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
            {date: '2026-04-05', label: '2026-04-05'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
