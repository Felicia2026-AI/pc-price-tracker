<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 520.00,
                change: -1.5,
                trend: 'down',
                date: '2026-04-12',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 795,
                change: 5,
                trend: 'up',
                date: '2026-04-12',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'GPT-6',
                    title: 'GPT-6明日发布倒计时2天：代号Spud（土豆），性能暴涨40%冲刺AGI',
                    source: '腾讯新闻 / 36氪',
                    date: '2026-04-12',
                    summary: '4月14日OpenAI将正式发布GPT-6（代号Spud）。核心参数：性能较GPT-5.4暴涨40%，支持200万Token超长上下文，原生多模态（文本+图像+音频+视频）。Sam Altman最新采访称GPT-6将成为"人类最后需要记住的API"，将彻底改变API定价模式。GPT-6发布后48小时内，全球AI应用生态可能迎来重构。对企业影响：本地+云端混合架构或成主流，需重新评估AI部署策略。'
                },
                {
                    tag: '市场数据',
                    title: 'Omdia Q1确认：全球PC出货+3.2%达6480万台，联想份额25%+稳居第一',
                    source: 'Omdia / IT之家',
                    date: '2026-04-10~12',
                    summary: '4月10日Omdia最新数据确认：2026年Q1全球台式机、笔记本和工作站总出货量6480万台，同比增长3.2%。联想以25%以上份额稳居第一宝座，惠普、戴尔分列二三位。分析师指出：内存SSD涨价已开始传导至PC整机成本，Q2价格压力将更加明显。IDC数据同步显示联想份额25.2%，Q1总出货6560万台。对SSC启示：关注涨价传导对备件成本的影响。'
                },
                {
                    tag: '存储市场',
                    title: 'DDR5终于回调但别高兴太早：当前价格仍是正常水平的4倍以上',
                    source: '上海证券报 / 中关村在线',
                    date: '2026-04-08~12',
                    summary: 'DDR5内存在2026年3月经历断崖式下跌后，4月进入震荡整理期。消费级DDR5持续回调，但服务器级DDR5因HBM产能挤占仍维持高位。当前DDR5价格仍是正常水平的4倍以上，"崩盘论"为时尚早。渠道数据显示DDR5 16GB模组价格约¥505-520，SSD 1TB约¥790-800。对SSC启示：观望消费级市场，优先锁定服务器备件长期合约。'
                },
                {
                    tag: '高端内存',
                    title: '海盗船128GB DDR5套装标价2.8万元：AI PC时代高端需求爆发',
                    source: '中关村在线',
                    date: '2026-04-11',
                    summary: '4月11日海外平台出现海盗船Vengeance 128GB DDR5套装标价4199美元（约2.8万人民币）。这一极端案例折射出AI PC时代高端内存需求的爆发式增长。消费级市场虽出现回调，但高端游戏和工作站市场需求依旧旺盛。对SSC启示：关注AI PC备件（高端内存、SSD）的价格走势，提前布局高价值备件库存。'
                }
            ],
            ai: [
                {
                    tag: 'AI发布',
                    title: 'GPT-6即将发布：原生多模态+200万Token，AGI竞赛白热化',
                    source: '钛媒体 / 量子位',
                    date: '2026-04-10~12',
                    summary: 'GPT-6代号Spud（意为土豆），将于4月14日正式发布。经过两年秘密研发，预训练已于3月17日完成。核心亮点：200万Token超长上下文、原生多模态支持、性能较上代暴涨40%。业内分析指出，GPT-6的发布将重新定义AGI竞赛规则，Anthropic、Google DeepMind、xAI等竞争对手将面临更大压力。对SSC影响：AI PC和服务器需求将进一步上行，存储备件价格获新支撑。'
                },
                {
                    tag: 'AI生态',
                    title: 'GPT-6将成"人类最后需要记住的API"：Sam Altman最新采访透露定价变革',
                    source: '36氪 / OpenAI官方',
                    date: '2026-04-12',
                    summary: 'OpenAI CEO Sam Altman在4月11日深夜采访中透露，GPT-6将成为"人类最后需要记住的API"，强调其将实现真正的个人AI助理体验，支持跨设备、跨应用的统一记忆。Altman还暗示GPT-6将彻底改变API定价模式，从"按Token计费"转向"按价值收费"。企业AI部署策略需重新评估：本地+云端混合架构或成主流。'
                }
            ],
            lenovo: [
                {
                    tag: '市场地位',
                    title: '联想Q1份额25%+稳居全球PC第一：Omdia/IDC双数据确认',
                    source: 'IDC / Omdia / 新浪科技',
                    date: '2026-04-09~12',
                    summary: '4月9日IDC、4月10日Omdia先后发布Q1数据，双双确认联想以25%以上份额稳居全球PC第一。IDC数据显示联想Q1出货6560万台，份额25.2%；Omdia数据显示出货6480万台，份额约25.3%。尽管宏观经济承压、内存短缺，联想凭借AI战略（天禧生态+DingOS）和ThinkPad 2026新品保持领先。4月22日ThinkPad发布会倒计时10天，需关注新品定价对备件供应链的影响。'
                },
                {
                    tag: '供应链',
                    title: '存储涨价传导PC整机：Q2价格压力加大，SSC需提前锁定关键备件合约',
                    source: 'TrendForce / Gartner',
                    date: '2026-04-12',
                    summary: 'TrendForce数据显示，存储涨价潮已开始传导至PC整机市场。Q1内存成本占PC整机BOM成本比例已从12%升至18%，预计Q2将进一步攀升至22%。Gartner建议企业供应链团队密切跟踪存储价格走势，通过长期合约锁定关键备件成本。对联想SSC：建议重点关注DDR5服务器内存、enterprise SSD的合约价格，提前布局采购策略。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
