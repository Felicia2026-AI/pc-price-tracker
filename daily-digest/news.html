<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 16GB 内存（渠道现货）',
                price: 170,
                change: -20,
                trend: 'down',
                date: '2026-04-08'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 785,
                change: 3,
                trend: 'up',
                date: '2026-04-08'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">¥${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${priceData.ddr5.change}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">¥${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '市场',
                    title: 'IDC将2026年PC出货预测下调至-11.3%，创十年最大跌幅',
                    source: 'IDC / Tom\'s Hardware',
                    date: '2026-04-08',
                    summary: 'IDC大幅下调2026年全球PC出货量预测，从-2.4%调至-11.3%，全年预计出货2.53亿台，净减3217万台。主因：DRAM/NAND价格暴涨、供应链压力与地缘政治风险。但因均价上涨，市场总价值反增至2740亿美元（+1.6%）。内存短缺预计延续至2027年，高价将成新常态。'
                },
                {
                    tag: '存储',
                    title: 'TrendForce Q2报告：DRAM合约价季增58-63%，NAND Flash季增70-75%',
                    source: 'TrendForce集邦咨询',
                    date: '2026-04-08',
                    summary: 'TrendForce最新Q2存储价格预测：一般型DRAM合约价季增58%-63%，PC DRAM原厂压缩OEM供货量，满足率低的厂商需溢价采购。NAND Flash Q2季增70-75%，企业级SSD因AI服务器需求明显缺货，新产能最早2027年底才能开出。Client SSD买方出现库存回补需求。'
                }
            ],
            ai: [
                {
                    tag: 'AI模型',
                    title: '48小时连发5款大模型：Qwen3.6-Plus、Gemma 4领衔，GPT-5春季发布会预告',
                    source: '腾讯云开发者社区',
                    date: '2026-04-08',
                    summary: '4月初AI大模型密集发布：阿里Qwen3.6-Plus（4月2日）编程能力超同规模模型2-3倍，智能体编程能力突出；谷歌Gemma 4（4月5日）以310亿参数打败20倍体量对手，引爆开源社区；OpenAI预告4月下旬春季发布会将推出GPT-5。MoE架构普及、端侧部署加速成为三大趋势。'
                },
                {
                    tag: '趋势',
                    title: 'AI工具军备竞赛：覆盖视频生成、办公助手、代码辅助全场景',
                    source: '中新网 / AI资讯',
                    date: '2026-04-08',
                    summary: '2026年AI大模型竞争白热化，三大趋势明确：MoE架构普及（降本增效）、端侧部署加速（本地推理）、多模态融合（图文视频一体）。各大厂商在视频生成、智能办公助手、代码辅助等场景展开全面竞争，企业AI落地加速。'
                }
            ],
            lenovo: [
                {
                    tag: '股价',
                    title: '联想集团(0992.HK) 4/7港股收约HK$9.89，+2.06%；美股ADR $24.89，-0.28%',
                    source: 'CNBC / StockAnalysis',
                    date: '2026-04-08',
                    summary: '联想港股（0992.HK）4月7日收盘约HK$9.89，涨幅+2.06%，当日波动区间9.80-10.08；美股ADR（LNVGY）4月7日收盘$24.89，跌幅-0.28%，延续4月初整体上行趋势（4月累计涨约2.3%）。股息率约3.94%，市盈率约10.53。'
                },
                {
                    tag: '供应链',
                    title: 'Gartner：内存成本上涨将使基础PC/手机用户退出速度达高端市场5倍',
                    source: 'Gartner',
                    date: '2026-04-08',
                    summary: 'Gartner分析师警示：2026年内存成本暴涨将冲击低端PC/平板市场，预计基础机型用户退出速度是高端市场的5倍。高端机型因利润率较高受冲击相对较小。内存价格关键定价窗口在2026年上半年，建议企业采购部门抓紧锁定Q2合约价格。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
            {date: '2026-04-05', label: '2026-04-05'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `history/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
