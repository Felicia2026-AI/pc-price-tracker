<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月15日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/15 10:28';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 520.00,
                change: 10,
                trend: 'up',
                date: '2026-04-15',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 810,
                change: 6,
                trend: 'up',
                date: '2026-04-15',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 小幅回升，渠道去库存接近尾声</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND合约Q2涨幅45-50%确认</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'Q1数据',
                    title: 'Q1 PC出货仅增2.5-3.2%：机构将全年预期大幅下调至下滑11.3%',
                    source: 'IDC/Omdia / 36氪',
                    date: '2026-04-13',
                    summary: '36氪4月13日综合报道：Q1全球PC出货约6480-6560万台，同比增长2.5%-3.2%，实现连续多季度正增长但增速低于此前预期。关键警示：需求被此前预测透支，机构将2026年全年预期大幅下调至同比下滑11.3%。区域分化明显：EMEA增7.4%、亚太增4.3%；美洲唯一负增长市场。对联想SSC启示：全年出货前高后低态势确立，Q2-Q3换机需求或低于此前预期，需动态调整备件库存规划，避免Q3库存积压风险。'
                },
                {
                    tag: '联想领跑',
                    title: '联想Q1出货1650万台增9%领跑：市占突破25%再创新高',
                    source: 'IDC/Omdia / 36氪',
                    date: '2026-04-13',
                    summary: '36氪4月13日五大厂商Q1表现：联想出货约1650万台，同比增9%，市占超25%，增速领跑全球；戴尔出货1030万台增7.8%；苹果出货711万台；惠普出货1210万台（同比下滑4.9%，前五中唯一负增长）；华硕出货460万台（增速最快）。联想增长主因：供应链优势显著+商用市场布局早+AI机型占出货三成以上。对SSC启示：联想份额持续扩大，ThinkPad T/X1系列核心备件需求有支撑，建议维持稳定库存水平。'
                },
                {
                    tag: '存储大涨',
                    title: '存储Q2合约价大涨58-75%：HBM吞噬产能，AI服务器需求持续推涨',
                    source: 'Omdia/供应链 / 大数跨境10100',
                    date: '2026-04-06',
                    summary: '大数跨境4月6日行业监测：Q2存储合约价全面暴涨——DRAM涨58%-63%，NAND Flash涨70%-75%，HBM环比涨40%-100%。近期现货急跌25%属于渠道短期抛货，不改Q2合约价大涨主趋势。涨价逻辑：AI服务器存储需求是传统服务器8-10倍，HBM吞噬全球70%以上DRAM先进产能。对联想SSC参考：强烈建议锁定长协价格，优先保障AI PC主力机型备件供应，对非核心备件适当控制库存以控制成本敞口。'
                }
            ],
            ai: [
                {
                    tag: 'AI PC渗透',
                    title: 'Gartner预计2026年AI PC出货1.43亿台：渗透率将达55%，增速趋缓',
                    source: 'Gartner / ESM China',
                    date: '2026-04-07',
                    summary: 'ESM China 4月7日综合报道：AI PC渗透率2024年全球约15-16%，2025年涨至31%，Gartner预计2026年出货约1.43亿台，渗透率将达55%左右。需求分化明显：消费端买单主要是重度生产力创作者和早期尝鲜者；美国大企业倾向云端/SaaS；中国AI原生公司、中小软件和设计团队采购更积极，将AI PC视为标配升级。对联想影响：AI PC机型已占出货三成以上，备件规划需重点关注Copilot+标准配置（16GB+256GB起）对应的存储备件成本上升问题。'
                },
                {
                    tag: '国产AI算力',
                    title: 'DeepSeek V4采用华为昇腾950：国产AI算力从"兼容适配"走向"原生首选"',
                    source: '大数跨境10100',
                    date: '2026-04-06',
                    summary: '大数跨境4月6日行业监测：DeepSeek V4全流程采用华为昇腾950系列芯片+自研HBM高带宽内存，标志着国产AI算力从"兼容适配"走向"原生首选"。这一突破将推动国产HBM、先进封装、AI服务器整机进入规模化商用阶段。国际侧：英伟达Blackwell Ultra供微软/Meta万亿参数大模型训练；Intel 14A制程（1.4nm）良率突破70%，重启晶圆代工价格战。对联想ISS业务：国产AI服务器份额上升或影响商用PC采购预算分配，需持续关注企业IT采购优先级变化。'
                }
            ],
            lenovo: [
                {
                    tag: '供应链排名',
                    title: 'Gartner 2026供应链榜单：联想升至第8，连续三年领跑中国科技企业',
                    source: 'Gartner / 21世纪经济报道',
                    date: '2026-04-15',
                    summary: 'Gartner今日公布2026年度全球供应链25强榜单，联想位列第8位，较2025年上升2位，连续三年蝉联中国科技企业榜首。联想供应链核心优势：1）智能排产系统覆盖全球40+工厂；2）端到端数字化覆盖率超90%；3）供应商协同平台连接1200+合作伙伴。对SSC启示：供应链排名提升意味着成本管控能力得到全球认可，需持续优化备件库存周转效率，在成本压力上升周期中保持领先优势。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】双重涨价压力下的备件成本管控策略调整建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-15',
                    summary: 'SSC成本团队今日内部建议（基于最新市场数据）：1）CPU 4月起涨价10-15%（Intel/AMD全系），建议与CPU代理商提前锁定Q3长协；2）存储Q2合约大涨58-75%，强烈建议锁定长协价格，对非核心备件控制库存；3）Q1出货数据低于预期，全年预测下调，Q3换机潮规模可能不及此前预期，动态调整备件规划；4）联想Q1表现强劲（+9%），核心机型备件需求有支撑；5）联想供应链排名升至全球第8，继续保持成本领先优势。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-15', label: '2026-04-15（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
