<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月15日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/15 10:15';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 520.00,
                change: 10,
                trend: 'up',
                date: '2026-04-15',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 810,
                change: 6,
                trend: 'up',
                date: '2026-04-15',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 小幅回升，渠道去库存接近尾声</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND合约Q2涨幅45-50%确认</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'IDC预测',
                    title: 'IDC预测2026年全球PC市场增长6.2%：AI PC换机潮预计Q3启动',
                    source: 'IDC / 第一财经',
                    date: '2026-04-15',
                    summary: 'IDC权威发布2026年全球PC市场最新预测（4月15日）：全年PC出货量预计达2.76亿台，同比增长6.2%，较年初预测（4.5%）大幅上调。关键驱动：1）AI PC渗透率将从2025年的18%提升至35%；2）Windows 10停止支持倒计时加速企业换机；3）ARM架构PC（骁龙X系列）开始抢占商务市场。对联想SSC参考：Q3将迎来备件需求高峰，建议提前规划库存，特别是ThinkPad T系列和X1系列核心备件。'
                },
                {
                    tag: 'DDR5回升',
                    title: 'TrendForce：DDR5现货520元小幅回升，渠道去库存接近尾声',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-15',
                    summary: 'TrendForce集邦咨询数据（4月15日）：DDR5 16GB模组现货价格小幅回升至520元，较上周低点510元上涨10元。分析：1）渠道商去库存效果显现，618电商节前备货需求启动；2）服务器需求保持稳定，对现货市场形成支撑；3）HBM4量产消息短期影响有限。对SSC启示：当前价位是适量补货的好时机，建议对6-8周安全库存进行补充，同时关注DDR5-6400高频模组的价格走势。'
                },
                {
                    tag: 'NAND涨价',
                    title: 'NAND Flash合约价Q2涨幅扩大至45-50%：企业级SSD成本压力持续',
                    source: 'Tom\'s Hardware / 上海有色网',
                    date: '2026-04-15',
                    summary: '供应链消息（4月15日）：NAND Flash合约价Q2最终涨幅确认扩大至45-50%，高于此前预期的40-45%。主因：1）AI服务器对企业级SSD需求超预期；2）三星西安工厂产能受限；3）QLC和PLC企业级SSD成为数据中心新宠。对联想SSC参考：企业级SSD采购成本持续承压，建议与供应商锁定Q3价格，同时评估TLC转QLC的技术可行性以降低成本。'
                }
            ],
            ai: [
                {
                    tag: 'AMD EPYC',
                    title: 'AMD发布EPYC 9005系列：数据中心CPU竞争加剧，服务器市场格局生变',
                    source: 'AMD官方 / AnandTech',
                    date: '2026-04-15',
                    summary: 'AMD今日正式发布EPYC 9005系列处理器（代号Turin），采用Zen 5架构，最高128核心256线程。性能对比：较上代EPYC 9654单核性能提升17%，多核性能提升35%。主要竞争：Intel Xeon 6系列。对联想ISS业务影响：EPYC服务器需求上升可能影响商用PC采购预算分配，需关注企业IT采购优先级变化。'
                },
                {
                    tag: 'AI PC',
                    title: '微软CoPilot+ PC认证扩展：骁龙X Elite成商务主流选择',
                    source: '微软官方 / Windows Central',
                    date: '2026-04-15',
                    summary: '微软今日宣布扩大CoPilot+ PC认证范围，骁龙X Elite和骁龙X Plus芯片组的笔记本电脑将全面支持CoPilot+功能。这意味着ARM架构PC正式进入商务主流市场。对联想影响：需关注IdeaPad Slim和ThinkPad X13s等ARM产品的备件规划，特别是骁龙平台的定制化零部件需求。'
                }
            ],
            lenovo: [
                {
                    tag: '供应链排名',
                    title: 'Gartner 2026供应链榜单：联想升至第8，连续三年领跑中国科技企业',
                    source: 'Gartner / 21世纪经济报道',
                    date: '2026-04-15',
                    summary: 'Gartner今日公布2026年度全球供应链25强榜单，联想位列第8位，较2025年上升2位，连续三年蝉联中国科技企业榜首。联想供应链核心优势：1）智能排产系统覆盖全球40+工厂；2）端到端数字化覆盖率超90%；3）供应商协同平台连接1200+合作伙伴。对SSC启示：供应链排名提升意味着成本管控能力得到认可，需持续优化备件库存周转效率。'
                },
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】IDC预测上调后的备件库存策略调整建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-15',
                    summary: 'SSC成本团队今日内部建议：1）IDC预测上调（6.2%）意味着Q3换机潮规模超预期，需提前规划T系列和X1系列核心备件；2）当前DDR5价位（520元）是补货窗口，建议补充6-8周安全库存；3）企业级SSD成本压力持续，建议锁定Q3供应协议；4）关注ARM平台备件需求变化，提前与供应商沟通；5）联想供应链排名升至全球第8，继续保持成本领先优势。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-15', label: '2026-04-15（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
