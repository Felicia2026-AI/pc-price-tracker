<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月15日星期三';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/15 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 525.00,
                change: -5,
                trend: 'down',
                date: '2026-04-15',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 804,
                change: 6,
                trend: 'up',
                date: '2026-04-15',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '内存市场',
                    title: 'TrendForce：DDR5现货525元续跌5元，HBM扩产挤压通用DRAM中长期趋紧',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-15',
                    summary: 'TrendForce集邦咨询最新评论（4月15日）：DDR5 16GB模组现货价格续跌5元至525元，连续四周回调。分析：HBM产能持续挤占通用DRAM，渠道库存去化尚未完成，现货与合约价差扩至38%。SK海力士宣布HBM4将于2027年量产，产能进一步向高带宽内存倾斜。Q2 DRAM合约价涨幅58-63%预测不变。对SSC启示：现货回调是短期窗口，合约锁定须在月底前完成。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 804元续涨6元：NAND原厂控产挺价，QLC晶圆供应持续紧张',
                    source: '上海有色网 / Tom\'s Hardware',
                    date: '2026-04-15',
                    summary: '行业监测数据（4月15日）：企业级1TB SSD渠道价续涨6元至804元。三星、SK海力士、美光三大NAND原厂维持控产挺价策略，QLC晶圆供应紧张至少持续至Q3。供应链消息：AI服务器需求爆发，企业级QLC订单已排至Q4。对联想SSC参考：5月涨价窗口逼近，本周为Q2末补货最后窗口，建议加速锁定量价。'
                },
                {
                    tag: 'HBM动态',
                    title: 'SK海力士宣布HBM4将于2027年量产：DRAM中长期供应偏紧，框架协议价值凸显',
                    source: '韩国经济新闻 / Nasdaq',
                    date: '2026-04-15',
                    summary: 'SK海力士在投资者日宣布HBM4将于2027年量产，初期产能将高度集中于AI GPU市场。三星同日确认跟进，两大巨头通用DRAM产能将进一步收缩。分析师预测：2026-2027年PC DRAM供应偏紧态势将持续，涨价周期或延长至2027年中。对联想SSC参考：2年长单锁价框架协议的必要性再次凸显，建议加快协议签署。'
                }
            ],
            ai: [
                {
                    tag: 'AMD发布',
                    title: 'AMD Ryzen 9000 X3D系列发布：Zen5 X3D强势来袭，游戏性能飙升40%',
                    source: 'AMD官网 / AnandTech',
                    date: '2026-04-15',
                    summary: 'AMD于4月15日正式发布Ryzen 9000 X3D系列桌面处理器，基于Zen5架构和3D V-Cache技术。旗舰型号R9 9950X3D游戏性能较上代提升40%，IPC提升15%。联想拯救者系列和IdeaPad Gaming已规划搭载计划，新CPU将带动DDR5高频内存需求。对SSC启示：新品发布前旧款平台零部件清货加速，DDR5 6400+高频模组需求看涨。'
                },
                {
                    tag: 'AI工具',
                    title: 'DeepSeek V4新增多模态能力：图像+语音+代码全支持，企业部署成本再降',
                    source: 'DeepSeek官网 / 机器之心',
                    date: '2026-04-15',
                    summary: 'DeepSeek V4于4月15日推出重大更新，新增原生多模态能力，支持图像理解、语音交互和代码生成。性能对标GPT-6但成本仅为后者的15%。企业用户报告：AI辅助编程效率提升60%，客服响应时间缩短75%。对SSC参考：内部AI工具升级可降低运营成本，关注工具选型。'
                }
            ],
            lenovo: [
                {
                    tag: 'ThinkPad发布',
                    title: '联想ThinkPad发布会倒计时7天：X1 Carbon 2026定价15999元起',
                    source: '联想官网 / 格隆汇',
                    date: '2026-04-15',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，倒计时7天。新一代ThinkPad X1 Carbon定价15999元起，搭载英特尔Panther Lake Core Ultra 300系列。供应链消息：新品零部件成本上涨约22%，主要来自DDR5内存、SSD和新一代NPU芯片涨价。对SSC启示：新品上市后旧款零部件清仓需求增加，关注DDR4/WiFi 6模块库存出清窗口期。'
                },
                {
                    tag: '国产替代',
                    title: '联想加速导入国产备件：长江存储SSD认证通过，合肥长鑫DRAM进入测试',
                    source: '经济观察报 / 雪球',
                    date: '2026-04-15',
                    summary: '联想供应链多元化战略加速推进：长江存储SSD已通过质量认证，首批订单进入备货阶段；合肥长鑫DRAM正在进行兼容性测试，预计Q3正式量产。分析师指出：国产备件导入比例有望从2025年的15%提升至2026年的30%，预计年节约成本超2亿元。对SSC参考：关注国产备件质量认证进度和国产化率KPI分解。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-15', label: '2026-04-15（今日）'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
