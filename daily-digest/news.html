<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月13日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/13 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 535.00,
                change: -3,
                trend: 'down',
                date: '2026-04-13',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 792,
                change: 2,
                trend: 'up',
                date: '2026-04-13',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5松动',
                    title: 'DDR5现货微幅松动3元至535元：TrendForce称属技术回调，Q2合约价续涨逻辑不变',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-13',
                    summary: '2026年4月13日当周，DDR5 16GB模组现货价格小幅回落至535元（↓3元），为近8周以来首次下跌。TrendForce分析：此次回调属于正常技术性调整——GPT-6发布前的观望情绪导致部分渠道商提前释放库存，短期供需关系边际缓和。但中期逻辑不变：Q2 DRAM合约价环比再涨58-63%，HBM挤占通用DRAM产能态势持续。对SSC启示：现货端短期松动是采购窗口期，建议适度增加即期采购比例，同时锁定Q2-Q3长期合约价。'
                },
                {
                    tag: '企业级SSD涨价',
                    title: '企业级SSD 792元再涨2元：NAND原厂5月涨价计划流出，幅度15-20%',
                    source: '上海证券报 / IT之家',
                    date: '2026-04-13',
                    summary: '2026年4月13日当周，企业级1TB SSD渠道价再涨2元至792元。三星、SK海力士、美光三大原厂已向渠道透露5月新一轮涨价计划，幅度15-20%，主要针对高密度QLC NAND和大容量企业级SSD。供应链人士透露：AI服务器需求爆发导致QLC晶圆产能持续紧张，PLC商业化推迟至2027年，短期无替代方案。对联想SSC参考：5月涨价前是备件采购窗口期，建议Q2末提前补货。'
                },
                {
                    tag: 'AI PC渗透率',
                    title: 'Canalys大幅上调2026年AI PC渗透率至38%：GPT-6发布后企业换机潮加速',
                    source: 'Canalys / IT之家',
                    date: '2026-04-13',
                    summary: 'Canalys于4月13日将2026年全球AI PC渗透率预测从28%大幅上调至38%。报告指出：GPT-6的发布将使本地AI推理成为PC刚需；Windows 10停止支持引发的换机周期与AI需求形成叠加；2026下半年NPU性能有望再翻倍，AI PC将从"可选"变为"必选"。对中国市场影响：本土AI应用（文心一言、通义千问等）的PC端普及将加速，本地化AI生态日趋成熟。对SSC启示：AI PC备件需求长期看好，但高端存储供应持续紧张。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6发布',
                    title: 'GPT-6正式发布：Symphony架构+200万Token，性能暴涨40%，全球AI生态重构启动',
                    source: 'OpenAI / The Verge',
                    date: '2026-04-14',
                    summary: 'OpenAI于4月14日正式发布GPT-6，代号Spud（土豆），训练成本超20亿美元，采用全新Symphony架构，支持200万Token超长上下文，原生多模态，性能较GPT-5.4暴涨40%。CEO Altman称之为"人类最后需要记住的API"。发布后24小时内，Microsoft、Google、Meta相继宣布接入GPT-6 API，全球AI应用生态面临重构。对企业影响：本地+云端混合AI架构成为主流，AI PC换机需求有望加速。'
                },
                {
                    tag: '昇腾适配',
                    title: 'DeepSeek V4与昇腾950PR深度适配完成：国产AI生态加速成熟',
                    source: '知乎 / 36氪',
                    date: '2026-04-05~13',
                    summary: 'DeepSeek V4已完成与华为昇腾950PR的深度适配，在多个基准测试中性能与英伟达H100相当。业内分析：昇腾950PR采用国产7nm工艺，性能功耗比显著提升，标志着国产AI芯片在大模型训练领域正式具备竞争力。对国内企业影响：昇腾生态快速成熟，本地AI部署成本有望下降，AI PC和服务器需求将进一步上行。联想天禧AI生态（DingOS）已接入昇腾生态链，值得持续关注。'
                }
            ],
            lenovo: [
                {
                    tag: 'ThinkPad发布会',
                    title: '联想4月22日ThinkPad发布会倒计时9天：X1 Carbon 2026将搭载双平台AI处理器',
                    source: '联想官网 / IT之家 / 格隆汇',
                    date: '2026-04-13',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，届时将发布搭载英特尔Panther Lake Core Ultra 300系列和AMD Zen 5 Ryzen AI 400系列双平台的新一代ThinkPad X1 Carbon。供应链消息：新品零部件成本上涨18-22%，预计X1 Carbon 2026起售价将达15999元（较上代上浮约2000元）。对SSC启示：关注新品零部件规格变化，提前调整备件库存结构，旧款零部件清仓需求将增加。'
                },
                {
                    tag: 'Q1财报前瞻',
                    title: '联想Q4 FY25财报将于5月发布：Q1 PC出货增长+AI PC布局成关注焦点',
                    source: '港交所公告 / 雪球',
                    date: '2026-04-13',
                    summary: '联想集团将于5月发布2024/25财年Q4及全年财报。Q3 FY25（截至2025年12月）营收171亿美元，同比+20%；IDG智能设备业务营收同比+23%表现亮眼。Q4 FY25（截至2026年3月）预期：Q1 PC出货量同比增长8.6%为IDG业务提供支撑，AI PC新品备货成本压力或对利润率形成一定压制。市场关注重点：AI PC业务毛利率走向、ThinkPad 2026新品定价策略及天禧生态商业化进展。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-14', label: '2026-04-14（今日）'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
