<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月13日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/13 10:00:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 535.00,
                change: -3,
                trend: 'down',
                date: '2026-04-13',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 792,
                change: 3,
                trend: 'up',
                date: '2026-04-13',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5回调',
                    title: 'DDR5现货535元连续两周回调：渠道库存释放，Q2合约价预测维持不变',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-13',
                    summary: '2026年4月13日当周，DDR5 16GB模组现货价格继续回落至535元（↓3元），连续两周技术性回调。TrendForce分析：渠道商在Q1涨价周期中囤积的库存开始释放，导致现货价格短期承压；但Q2 DRAM合约价环比再涨58-63%的预测维持不变，HBM挤占通用DRAM产能态势持续。对SSC启示：现货端回调是短期采购窗口，建议适度增加即期采购。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 792元续涨3元：NAND原厂5月涨价15-20%计划基本确定',
                    source: '上海证券报 / IT之家',
                    date: '2026-04-13',
                    summary: '2026年4月13日当周，企业级1TB SSD渠道价续涨3元至792元。三星、SK海力士、美光三大原厂5月新一轮涨价计划已基本确定，幅度15-20%，主要针对高密度QLC NAND和大容量企业级SSD。供应链人士透露：AI服务器需求持续爆发，QLC晶圆产能紧张局面短期无解。对联想SSC参考：5月涨价前是最后采购窗口期，建议立即启动Q2末补货计划。'
                },
                {
                    tag: '存储周期',
                    title: '2026存储超级周期持续：HBM产能争夺加剧，通用DRAM供应紧张难缓解',
                    source: '雪球 / 21世纪经济报道',
                    date: '2026-04-13',
                    summary: '截至2026年4月，全球存储器市场正处于由AI驱动的"超级周期"之中。三星、SK海力士、美光三大存储巨头围绕HBM需求展开全面扩产竞赛，导致通用DRAM产能持续被挤占。分析指出：本轮涨价周期至少持续至2026年底，PC和服务器DRAM供应紧张短期难缓解。对SSC启示：Q2-Q3采购预算需持续上调，建议与供应商签订长期框架协议锁定价格。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6倒计时',
                    title: 'GPT-6发布倒计时1天：代号Spud、训练成本20亿美元、4月14日揭幕',
                    source: 'OpenAI / The Verge / TechCrunch',
                    date: '2026-04-13',
                    summary: 'OpenAI将于4月14日正式发布GPT-6（代号Spud/土豆），训练成本超20亿美元，动用约10万张H100 GPU在德克萨斯Stargate数据中心完成。核心参数：Symphony架构+200万Token超长上下文，原生多模态，性能较GPT-5.4暴涨40%。OpenAI CEO Altman称之为"人类最后需要记住的API"。对企业影响：本地+云端混合架构或成主流，AI PC换机需求将呈爆发式增长。'
                },
                {
                    tag: '国产芯片',
                    title: '华为昇腾950PR产能爬坡：DeepSeek V4全面适配，国产AI芯片竞争力提升',
                    source: '36氪 / 知乎 / 华为官方',
                    date: '2026-04-13',
                    summary: '华为昇腾950PR芯片产能正在快速爬坡，预计Q2末月产能将达10万片。DeepSeek V4已完成与昇腾950PR的全面适配，在多个基准测试中性能与英伟达H100相当。业内分析：昇腾950PR采用国产7nm工艺，性能功耗比显著提升，标志着国产AI芯片在大模型推理领域正式具备竞争力。对国内企业影响：本地AI部署成本有望下降30-40%。'
                }
            ],
            lenovo: [
                {
                    tag: 'IDC Q1数据',
                    title: 'IDC：联想Q1 PC出货量同比增长8.6%，份额25.2%稳居全球第一',
                    source: 'IDC中国 / 雪球',
                    date: '2026-04-13',
                    summary: 'IDC发布2026年第一季度全球PC市场追踪报告，联想集团以25.2%市场份额蝉联全球第一，出货量同比增长8.6%，增速超市场平均水平3倍以上。受益于AI PC新品推出和ThinkPad产品线更新，联想在全球PC市场复苏中占据领先地位。4月22日ThinkPad发布会渐近，新品定价和供应链策略值得持续关注。'
                },
                {
                    tag: 'ThinkPad倒计时',
                    title: '联想ThinkPad发布会倒计时9天：X1 Carbon 2026零部件成本上涨18-22%',
                    source: '格隆汇 / IT之家',
                    date: '2026-04-13',
                    summary: '联想ThinkPad 2026新品发布会将于4月22日举行，倒计时9天。据悉，新一代ThinkPad X1 Carbon将搭载英特尔Panther Lake Core Ultra 300系列和AMD Zen 5 Ryzen AI 400系列双平台。供应链消息：新品零部件成本上涨主要来自DDR5内存涨价、1TB SSD涨价、以及新一代NPU芯片成本，预计起售价将达15999元。对SSC启示：关注新品零部件规格变化，提前调整备件库存结构。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-13', label: '2026-04-13（今日）'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
