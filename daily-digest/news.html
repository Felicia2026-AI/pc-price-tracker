<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月28日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/28 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 485.00,
                change: 23,
                trend: 'down',
                date: '2026-04-28',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 862,
                change: 7,
                trend: 'up',
                date: '2026-04-28',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 11.54,
                change: 0.7,
                trend: 'up',
                date: '2026-04-25',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 国内DDR5首次大降价！联想16G DDR5笔记本内存从¥1759降至¥1159，降幅34%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | 企业级SSD持续上行，Q2合约价预计再涨70%-75%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 费城半导体指数连涨18交易日</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5首降',
                    title: '国内DDR5首次大降价！联想16G笔记本内存从1759元降至1159元，降幅34%',
                    source: '新浪科技 / 孤城Hardware',
                    date: '2026-04-27',
                    summary: '据数码博主孤城Hardware发布，联想16G DDR5-5600笔记本内存售价从1759元下调至1159元，单次降幅600元，整体降价34%，创今年价格新低。这是国内DDR5内存首次出现大幅降价信号。然而TrendForce同步预警Q2 DRAM合约价仍将环比再涨58%-63%，显示渠道现货与合约价分化：消费级DDR5现货跌，服务器DDR5合约涨。对联想SSC参考：渠道现货回落提供采购窗口，密切关注是否向备件成本传导。'
                },
                {
                    tag: 'PC涨价',
                    title: '五大PC品牌正式涨价：联想/惠普/戴尔/华硕/宏碁涨幅1000~2000元',
                    source: '新浪科技',
                    date: '2026-04-27',
                    summary: '4月27日起，五大PC品牌正式执行新一轮涨价。惠普门店店员透露"27日以后会大幅涨价，幅度在1000元到2000元不等"。拯救者R9000P AI元启 RTX5070版从年初9379元涨至10893元，累计涨1514元涨幅16.1%。TrendForce预警Q2 DRAM合约价仍将环比再涨58%-63%，NAND闪存涨幅70%-75%。对联想SSC参考：终端整机正式涨价，备件BOM基准价同步上修。'
                },
                {
                    tag: 'Q2涨价预警',
                    title: 'TrendForce预警：Q2 NAND Flash合约价再涨70%-75%，存储超级周期中场不休息',
                    source: 'TrendForce / 新浪财经',
                    date: '2026-04-26',
                    summary: 'TrendForce最新预估：Q2 NAND Flash合约价将环比再增70%-75%，DRAM合约价季增58%-63%。AI服务器需求虹吸产能，HBM/企业级SSD供给紧张预计延续至2027年。对联想SSC参考：企业级SSD备件采购成本Q2继续上行，PCIe 5.0 NVMe SSD锁价窗口紧迫。'
                }
            ],
            ai: [
                {
                    tag: 'API降价',
                    title: 'DeepSeek击穿大模型底价：百万Tokens降至2分钱，"Agent便宜"时代加速',
                    source: '21经济网 / DeepSeek官方',
                    date: '2026-04-28',
                    summary: '4月26日DeepSeek发布API价格调整公告，全系API输入缓存命中价格降至首发价的十分之一，V4 Flash每百万Tokens仅0.02元。GPT-5.5与DeepSeek-V4均强调推理成本极致压缩，单次成本下降将诱发Token消耗量指数级增长。对联想SSC参考：天禧AI 3.7"垂域专属智能体"定位契合Agent化趋势，推理成本持续压缩有利于AI PC端侧应用普及。'
                },
                {
                    tag: 'AI算力',
                    title: '中信建投：看好AI应用落地与算力需求增长，维持北美算力产业链长期看好',
                    source: '人民财讯 / 中信建投',
                    date: '2026-04-28',
                    summary: '中信建投研报称GPT-5.5与DeepSeek-V4均强调推理成本极致压缩，但单次成本下降并非算力需求见顶——Token消耗量指数级增长将带来更大推理算力需求。DeepSeek-V4拥抱华为CANN、摩尔线程MUSA等国产生态，"发布即跑通"证明国产算力足以支撑万亿参数大模型。对联想SSC参考：AI PC渗透率提升带动高端备件需求长期看涨。'
                },
                {
                    tag: '具身智能',
                    title: 'AI初创Sereact获1.1亿美元融资，机器人软件赛道加速',
                    source: '财联社 / 新浪AI',
                    date: '2026-04-28',
                    summary: '德国机器人软件公司Sereact获1.1亿美元融资，旨在提升机器人适应性。具身智能成AI落地新方向：人形机器人首破人类半马世界纪录、华为AI眼镜正式开售。Meta与AWS签署数十亿美元协议部署Graviton5 ARM CPU核心。对联想SSC参考：具身智能带动伺服电机、精密传感器、边缘计算模组等新类别备件需求，SSC需关注新兴备件品类。'
                }
            ],
            lenovo: [
                {
                    tag: 'SSC成本风险',
                    title: '【SSC内部参考】4月28日成本风险矩阵：DDR5现货首降 vs 合约价续涨，采购策略需动态调整',
                    source: '联想SSC成本团队',
                    date: '2026-04-28',
                    summary: '基于4月28日最新数据：①五大品牌整机涨价1000-2000元，备件BOM基准价同步上修；②DDR5现货¥485（大幅回落¥23），联想笔记本内存降价34%，但TrendForce预警Q2合约价仍涨58%-63%；③企业级SSD ¥862（+¥7/周），持续上行；④DeepSeek-V4 API降价，AI PC推理成本持续压缩。行动建议：区分消费级备件（享受现货降价）与企业级备件（合约价锁定）采购策略，关注AI PC换机潮带来的高端备件需求增长。'
                },
                {
                    tag: 'AI PC旗舰',
                    title: 'ThinkPad X1 Carbon Aura AI 2026正式发布：984g超轻、14999元起，天禧AI 3.7加持',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-22',
                    summary: '4月22日联想发布ThinkPad X1 Carbon Aura AI 2026，搭载英特尔酷睿Ultra X7 358H（Panther Lake架构），机身仅984g，配置32GB LPDDR5X板载内存+1TB PCIe NVMe固态，整合天禧AI 3.7，售价14999元起。对联想SSC参考：X1 Carbon Aura AI 2026已正式量产，须立即启动关键备件SKU认证，Q2锁价窗口需尽快完成。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-28', label: '2026-04-28（今日）'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
