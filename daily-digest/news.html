<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月16日星期四';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/16 09:58';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 510.00,
                change: -10,
                trend: 'down',
                date: '2026-04-16',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 815,
                change: 5,
                trend: 'up',
                date: '2026-04-16',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 连续六周回调，渠道库存去化压力增大</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | QLC晶圆供应持续紧张，订单排至Q4</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'DDR5续跌',
                    title: 'TrendForce：DDR5现货510元再跌10元，渠道库存去化压力增大',
                    source: 'TrendForce集邦咨询 / CFM闪存市场',
                    date: '2026-04-16',
                    summary: 'TrendForce集邦咨询最新数据（4月16日）：DDR5 16GB模组现货价格再跌10元至510元，连续六周回调。分析：消费市场需求持续疲软，渠道商库存去化压力增大，部分贸易商开始抛货变现。合约市场依然坚挺，Q2合约价涨幅预测维持58-63%，但部分小厂商已开始松动报价。对SSC启示：关注非一级供应商的低价出货窗口，但需严格把控质量风险。'
                },
                {
                    tag: 'SSD涨价',
                    title: '企业级SSD 815元续涨5元：NAND合约价Q2预期涨幅收窄至45-50%',
                    source: '上海有色网 / Tom\'s Hardware',
                    date: '2026-04-16',
                    summary: '行业监测数据（4月16日）：企业级1TB SSD渠道价续涨5元至815元。三星、SK海力士维持控产策略，但QLC晶圆产能开始向数据中心倾斜，消费级QLC供应略有缓解。供应链消息：NAND合约价Q2预期涨幅从55-65%收窄至45-50%，主因是智能手机需求不及预期。对联想SSC参考：消费级SSD采购成本压力边际改善，但企业级订单仍需尽早锁定。'
                },
                {
                    tag: '市场预测',
                    title: 'IDC预测修正：2026年PC市场温和复苏，出货量增长4-6%',
                    source: 'IDC / 新浪科技',
                    date: '2026-04-16',
                    summary: 'IDC于4月15日发布修正后的2026年PC市场预测：受AI PC换机潮拉动，全球PC出货量预计增长4-6%（原预测2-4%），总量约6800-6900万台。分区域看，中国市场增速领先（6-8%），受益于政府教育采购和信创替代加速。联想份额预计稳定在25-26%，继续领跑全球。对SSC参考：出货量增长将带动备件需求上升，关注B类件（消耗件）的需求弹性。'
                }
            ],
            ai: [
                {
                    tag: 'Claude升级',
                    title: 'Claude 4.6紧急更新：长上下文推理能力升级，与GPT-6正面交锋',
                    source: 'Anthropic官网 / 机器之心',
                    date: '2026-04-16',
                    summary: 'Anthropic于4月15日深夜紧急发布Claude 4.6版本更新，重点强化长上下文推理能力，支持150万Token上下文窗口（较前版提升50%）。新增"深度推理模式"，可处理复杂的多步骤分析任务。性能对标GPT-6，定价却低30%。开发者社区反馈：Claude 4.6在中文理解和代码解释方面优势明显。对SSC参考：关注Claude企业版在内部文档分析和流程优化中的应用场景。'
                },
                {
                    tag: 'Gemini更新',
                    title: 'Google Gemini 3发布：多模态能力突破，原生支持视频理解',
                    source: 'Google AI博客 / 我是人PM',
                    date: '2026-04-16',
                    summary: 'Google于4月15日发布Gemini 3，宣称在多模态理解方面实现重大突破，原生支持视频理解与分析。Gemini 3新增"供应链分析模式"，可自动解析PDF、表格和图表，适合企业级数据处理场景。Google同步推出Gemini Enterprise for Supply Chain。对联想SSC参考：多模态AI在合同分析、发票处理等场景的应用潜力值得关注。'
                }
            ],
            lenovo: [
                {
                    tag: 'ThinkPad发布',
                    title: 'ThinkPad发布会倒计时6天：X1 Carbon 2026物料清单曝光，BOM成本结构深度解析',
                    source: '联想供应链 / 格隆汇',
                    date: '2026-04-16',
                    summary: '联想ThinkPad 2026新品发布会倒计时6天（4月22日）。供应链消息：新一代X1 Carbon BOM成本结构曝光，DDR5模组占比18%（较去年+5%），NPU芯片占比22%（全新导入），SSD占比15%（+3%）。整体BOM成本上涨约22%，但终端定价仅上调12%，意味着联想需自行消化10%的成本压力。对SSC启示：成本管控压力将进一步传导至备件和服务供应链，关注旧款零部件清仓出清节奏。'
                },
                {
                    tag: '成本管控',
                    title: '联想SSC成本团队Q1复盘：框架协议节约成本¥2.3M，E&O损失同比下降18%',
                    source: '联想内部 / SSC团队',
                    date: '2026-04-16',
                    summary: '联想SSC成本团队发布Q1复盘报告：1）框架协议节约：通过锁定DRAM和NAND长单，Q1节约成本约¥2.3M（超目标15%）；2）E&O管理：呆滞料损失同比下降18%，主要得益于库存预警机制上线；3）供应商多元化：YMTC SSD导入率从12%提升至28%，成本节省约¥0.8M。对团队参考：Q2重点推进国产化替代，目标将国产化率从28%提升至35%。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-16', label: '2026-04-16（今日）'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
