<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 联想动态</div>
                <div id="lenovoSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 SSC参考</div>
                <div id="sscSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月17日星期五';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/17 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 498.00,
                change: 17,
                trend: 'down',
                date: '2026-04-17',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 808,
                change: 7,
                trend: 'down',
                date: '2026-04-17',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 9.26,
                change: 0.65,
                trend: 'up',
                date: '2026-04-16',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 现货较年内高点回落约17%，渠道商抛售+AI订单延后导致短期供需缓和</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | NAND现货小幅松动，但合约价Q2仍将上涨40-50%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股通持股比例升至9.26%创历史新高</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '内存回落',
                    title: '内存价格大幅回落！从暴涨300%到持续降价：2026年内存市场的"过山车"行情',
                    source: '头条 / 什么值得买',
                    date: '2026-04-16',
                    summary: '头条4月16日报道：今年1月DDR5 16G单条还卖到1100-1200元，32G套条逼近4000元，涨幅超过300%。但最近半个月，电脑圈最火的消息是内存价格大跳水——DDR5 16GB模组已从年内高点回落约15-20%。核心逻辑：前期过度囤货的渠道商开始抛售，加上部分AI服务器订单延后，短期内现货市场供需缓和。对联想SSC参考：现货市场回落为谈判长协框架提供了良好时机，建议利用当前窗口与供应商锁定部分长协配额。'
                },
                {
                    tag: 'Q1出货',
                    title: 'Q1全球PC出货增长3%低于预期：机构警告供应链压力将持续',
                    source: 'IDC/Omdia / MSN中文',
                    date: '2026-04-15',
                    summary: 'IDC/Omdia数据显示，2026年Q1全球PC出货约6560万台，同比增长3%，低于此前预期。联想出货1650万台，市占突破25%领跑全球。分析师警告：从Q2开始，内存和存储成本预计将比此前预期更快、更大幅度上涨，这将压缩PC厂商的毛利空间。对联想SSC启示：全年出货前高后低态势确立，Q2起备件成本压力加大，需提前锁定长协配额控制成本。'
                },
                {
                    tag: '存储周期',
                    title: '2026年存储器价格走势分析：AI驱动的"超级周期"仍在持续',
                    source: '中国IC交易网',
                    date: '2026-04-05',
                    summary: '2026年4月，全球存储器市场正处于由AI驱动的"超级周期"之中。这一周期的特征是需求强劲增长与供给结构性短缺并存，导致HBM、标准DRAM和NAND价格持续处于高位。虽然现货价格在4月有所回落，但合约市场依然紧张。对SSC参考：超级周期特征下，备件成本将长期高于历史平均水平，长协框架是控制成本波动的关键工具。'
                }
            ],
            lenovo: [
                {
                    tag: '新品倒计时',
                    title: 'ThinkPad 2026新品发布会倒计时6天：天禧AI生态即将揭晓',
                    source: '联想官方 / IT之家',
                    date: '2026-04-16',
                    summary: '联想官方4月16日发布倒计时预告：ThinkPad 2026新品暨天禧AI生态发布会将于4月22日举行，主题"我·即我们"。已开启1元预约通道，X1 Carbon、X9-15p、X14等新品即将亮相。对SSC参考：新品发布后对应的备件SKU将更新，需提前准备新机型LCD/MB/SSD关键备件采购计划。'
                },
                {
                    tag: '资金流入',
                    title: '联想港股通持股比例升至9.26%创历史新高：资金持续流入科技硬件板块',
                    source: '格隆汇 / Wind数据',
                    date: '2026-04-16',
                    summary: '格隆汇4月16日报道：进入四月以来，港股市场整体回暖，科技板块活跃，联想集团获得资金关注度显著提升。Wind数据显示，截止2026年4月13日，联想港股通持股比例已升至9.26%，创出历史新高。联想Q1出货1650万台增9%领跑全球，市占超25%。'
                },
                {
                    tag: '供应链',
                    title: '联想集团何以成为业绩"异类"？韧性的全球供应链是核心优势',
                    source: '新浪财经 / Gartner',
                    date: '2026-02-13',
                    summary: '新浪财经2月报道：联想集团在过去数十年积累的规模优势、韧性的全球供应链以及稳固的合作伙伴关系，将在AI时代被进一步放大。Gartner 2026供应链Top 25榜单中，联想位列第8位，较2025年上升2位，连续三年领跑中国科技企业。'
                }
            ],
            ssc: [
                {
                    tag: 'SSC建议',
                    title: '【SSC内部参考】内存价格回落窗口期：长协谈判策略建议',
                    source: '联想SSC成本团队',
                    date: '2026-04-17',
                    summary: '基于最新市场动态的SSC成本团队建议：1）DDR5现货较年内高点回落约17%，是启动长协谈判的良好窗口期；2）Q1 PC出货低于预期，但Q2起存储成本上涨压力加大，需提前锁定配额；3）ThinkPad 2026发布会（4月22日）后新机型备件SKU将更新，提前备货；4）联想港股通持股创历史新高（9.26%），市场信心充足；5）NAND现货小幅松动但合约价Q2仍将上涨40-50%，核心采购仍以合约价为准。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.lenovo, 'lenovoSection');
        renderNews(newsData.ssc, 'sscSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-17', label: '2026-04-17（今日）'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
