<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 235.00,
                change: -3.1,
                trend: 'down',
                date: '2026-04-11',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 788,
                change: 0.1,
                trend: 'up',
                date: '2026-04-11',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.ddr5.change)}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'Omdia Q1数据',
                    title: '2026 Q1全球PC出货6484万台同比+3.2%，联想份额破25%稳坐第一',
                    source: 'Omdia / 快科技',
                    date: '2026-04-10~12',
                    summary: 'Omdia最新Q1初步统计显示，全球台式机、笔记本和工作站总出货量6484万台，同比+3.2%。联想以超25%份额稳居第一，440万台出货，增速14%大幅领先市场。自2025年Q1以来内存和存储成本已分别上涨约5倍和3倍，AI数据中心建设挤占消费级DRAM/NAND供应，PC BOM成本急剧攀升。行业预警：Q2存储价格走势需关注合约市场走向，下半年PC出货或承压。'
                },
                {
                    tag: '存储收购',
                    title: '联想完成Infinidat收购：强化B2B企业级存储，QClaw生态再添利器',
                    source: '全球半导体观察 / 网易',
                    date: '2026-04-09~12',
                    summary: '4月9日，联想集团正式宣布完成对全球高端企业级存储解决方案提供商Infinidat的收购。该交易于2025年1月首次披露，现已获双方董事会全票通过及所有必要监管批准。Infinidat以其高性能企业级存储阵列闻名，将补强联想B2B存储市场竞争力，与腾讯云QClaw V2等多云管理方案形成协同。分析师预计该收购将在FY26/27为联想带来额外营收贡献。'
                },
                {
                    tag: '内存市场',
                    title: '内存价格"断崖"之后：消费级DDR4半月跌34%，市场进入理性回归期',
                    source: '观察者网 / 深圳商报',
                    date: '2026-04-11~12',
                    summary: '继3月中下旬消费级内存断崖式暴跌后，市场进入理性回归期。华强北数据：金士顿16GB DDR4从¥1,100跌至¥720（-34.5%），威刚等品牌跟进降价。但TrendForce Q2 DRAM合约价仍预涨58-63%，现货/合约双轨分歧持续。SSD价格变动相对较小，机械硬盘保持高位。对SSC影响：消费级备件采购成本回落，企业级/服务器存储成本仍承压，需分类管理。'
                }
            ],
            ai: [
                {
                    tag: 'GPT-6',
                    title: '倒计时2天！GPT-6定档4月14日发布，OpenAI预训练完成',
                    source: '多课网 / 钛媒体',
                    date: '2026-04-11~12',
                    summary: 'GPT-6正式定档4月14日（倒计时2天），代号"Spud"的预训练已全部完成。核心参数：性能较GPT-5.4暴涨40%，支持200万Token超长上下文，原生多模态（文本+图像+音频+视频），内部定位为冲刺AGI的"最后20%"。与此同时，Anthropic发布Mythos刷新最强AI记录，Claude Opus 4.6仍是最强编程模型；Alphabet计划2026年AI资本支出翻倍至1850亿美元。'
                },
                {
                    tag: '开源模型',
                    title: 'Google Gemma 4发布：Apache 2.0开源许可，四款规格覆盖移动到数据中心',
                    source: 'Google DeepMind / CSDN',
                    date: '2026-04-02~12',
                    summary: 'Google DeepMind发布Gemma 4系列开源模型，共四款规格：1B（移动端）、4B、9B、27B（数据中心级）。基于Gemini 3同源技术构建，全系列原生多模态，专为自主Agent工作流设计。许可升级为Apache 2.0，商业使用零限制。阿里千问登顶全球调用榜首，"词元经济"按量结算模式加速普及，腾讯云5月9日起AI算力价格上调5%。'
                }
            ],
            lenovo: [
                {
                    tag: '战略',
                    title: 'ThinkPad 2026新品发布会倒计时10天，4月22日天禧AI生态全面亮相',
                    source: 'IT之家 / ZOL中关村在线',
                    date: '2026-04-11~12',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布会将于4月22日在北京举行，主题"我·即我们"。预告机型含ThinkPad X1 Carbon 2026、X9-15p、X14等旗舰，均搭载天禧AI生态（DingOS）。结合4月1日誓师大会"混合式AI战略交付年"定位，ThinkPad新品将全面拥抱AI PC时代，高盛维持联想亚太买入名单。'
                },
                {
                    tag: '业绩',
                    title: 'Omdia+IDC双数据验证：联想AI PC份额42.8%历史峰值，龙头地位稳固',
                    source: 'IDC / Omdia / 新浪财经',
                    date: '2026-04-10~12',
                    summary: 'IDC Q1数据：联想AI PC出货253万台（FY2025/26），全球市场份额42.8%创历史峰值。Omdia数据同步验证联想份额破25%稳居第一。联想完成Infinidat收购补强B2B存储，混合式AI战略持续推进。杨元庆设定未来两年营收突破千亿美元目标，ThinkPad 2026新品发布会4月22日倒计时10天。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-12', label: '2026-04-12'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
