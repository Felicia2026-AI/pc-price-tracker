<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        document.getElementById('updateTime').textContent = `更新时间：${now.toLocaleString('zh-CN')}`;

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 242.50,
                change: 4.3,
                trend: 'up',
                date: '2026-04-10',
                unit: '$'
            },
            ssd: {
                name: '1TB SSD（零售）',
                price: 787,
                change: 1,
                trend: 'up',
                date: '2026-04-10',
                unit: '¥'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ${priceData.ddr5.change}%</span></div>
                <div class="date">数据日期：${priceData.ddr5.date}</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date}</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: 'PC出货',
                    title: 'IDC（4月9日）：2026年Q1全球PC出货6560万台，同比+2.5%；联想以25.2%份额蝉联第一',
                    source: 'IDC / 腾讯新闻',
                    date: '2026-04-09',
                    summary: 'IDC最新发布2026年Q1全球PC市场初步报告：全球PC出货量6560万台，同比增长2.5%，在内存短缺、物流成本上升等多重压力下仍实现正增长。联想出货1650万台（+8.6%），增速为市场均值的3.4倍，市场份额升至25.2%；惠普1210万台（-4.9%）；戴尔1030万台（+7.7%）。IDC预警：PC整机涨价压力将在下半年抑制出货量。'
                },
                {
                    tag: '存储',
                    title: '华强北内存价格"过山车"：半月跌三成，金士顿16GB DDR4跌至720元',
                    source: '深圳商报 / 腾讯新闻',
                    date: '2026-04-08',
                    summary: '2026年3月下旬至4月初，深圳华强北消费级内存条出现断崖式下跌：金士顿16GB DDR4从¥1,100跌至¥720（-34.5%）；三星/SK海力士4GB DDR4跌超30%。主因：渠道库存积压超60天，商家降价出货。合约端TrendForce Q2 DRAM仍预涨58-63%、NAND预涨70-75%，现货/合约双轨分化持续，对SSC备件采购成本影响不可忽视。'
                },
                {
                    tag: 'AIPC',
                    title: 'IDC预警：整机涨价+内存短缺，2026年Q2~Q4 PC出货量恐进一步承压',
                    source: 'IDC / 芯智讯',
                    date: '2026-04-09',
                    summary: 'Q1报告发布同时，IDC发出预警：供应链稳定性是2026年PC厂商关键竞争点。原厂优先保障HBM及DDR5企业级产能，消费级供给不足推高整机成本15-20%，消费端需求下半年料受抑制。AI PC渗透率有望在年底突破50%，但价格弹性不足将制约绝对出货量增长。'
                }
            ],
            ai: [
                {
                    tag: 'AI工具',
                    title: '腾讯云QClaw V2发布开启多Agent协同；字节Seeduplex原生全双工语音模型上线',
                    source: '格熊 / 腾讯云',
                    date: '2026-04-10',
                    summary: '今日AI早报：①腾讯云QClaw V2正式发布，支持多Agent协同，企业级AI应用落地加速；②字节跳动发布原生全双工语音模型Seeduplex，强抗干扰，适合客服/远程协作；③谷歌Gemini Notebooks打通NotebookLM个人知识库；④阿里云百炼上线"记忆库"，跨会话检索性能+50%；⑤面壁智能完成数亿元融资跻身独角兽。'
                },
                {
                    tag: '大模型格局',
                    title: '2026年大模型三强：GPT-5.4、Claude Opus 4.6、DeepSeek V4；腾讯云算力5月涨价5%',
                    source: 'ofox.ai / 腾讯云',
                    date: '2026-04-10',
                    summary: '当前大模型三足鼎立：GPT-5.4综合性能领跑，Claude Opus 4.6安全推理最优，DeepSeek V4以约1/10的API成本实现接近顶级的中文能力。国产AI周调用量突破7.359万亿Token，连续三周超越美国。腾讯云宣布5月9日起AI算力及容器服务价格上调5%，反映AI基础设施成本持续上行。'
                }
            ],
            lenovo: [
                {
                    tag: '股价',
                    title: '联想集团(0992.HK) 4/10股价HK$10.11，+2.33%；IDC Q1数据提供基本面支撑',
                    source: '新浪财经港股 / IDC',
                    date: '2026-04-10',
                    summary: '联想港股（0992.HK）今日股价HK$10.11，涨幅+2.33%，市盈率89.47。IDC Q1数据为其上涨提供基本面支撑：Q1出货1650万台（+8.6%），市场份额25.2%，增速为行业均值3.4倍。中国方案服务业务擎天AI交付能力4月9日誓师大会持续发力企业级。高盛维持亚太买入名单，目标营收突破千亿美元。'
                },
                {
                    tag: '战略',
                    title: '联想ThinkPad 2026新品发布会4月22日；AIPC出货253万台，份额42.8%历史峰值',
                    source: 'IT之家 / ZOL',
                    date: '2026-04-07',
                    summary: 'ThinkPad 2026新品暨天禧AI生态发布会定于4月22日，主题"我·即我们"，预告机型含X1 Carbon 2026、X9-15p、X14等旗舰。联想AI PC当前全球份额42.8%，为历史峰值。IDC Q1报告同期印证：AI PC渗透率有望年底破50%。杨元庆战略重心：从规模扩张转向盈利质量，目标冲击5%净利率。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-10', label: '2026-04-10'},
            {date: '2026-04-09', label: '2026-04-09'},
            {date: '2026-04-08', label: '2026-04-08'},
            {date: '2026-04-07', label: '2026-04-07'},
            {date: '2026-04-06', label: '2026-04-06'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
