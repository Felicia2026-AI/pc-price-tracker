<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月28日星期二';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/28 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 485.00,
                change: 23,
                trend: 'down',
                date: '2026-04-28',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 862,
                change: 7,
                trend: 'up',
                date: '2026-04-28',
                unit: '¥'
            },
            nvidia: {
                name: '英伟达 (NVDA)',
                price: 216.61,
                change: 4.0,
                trend: 'up',
                date: '2026-04-27',
                unit: 'US$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 渠道现货小幅回落，但高盛预测2026年DRAM最高涨幅达280%</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | Q2 NAND合约价预计再涨70%-75%，存储超级周期持续</div>
            </div>
            <div class="price-item">
                <div name">${priceData.nvidia.name}</div>
                <div class="price">${priceData.nvidia.unit}${priceData.nvidia.price} <span class="change ${priceData.nvidia.trend}">${priceData.nvidia.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.nvidia.change)}%</span></div>
                <div class="date">收盘日期：${priceData.nvidia.date} | 市值突破5.26万亿美元，AI算力需求持续爆发</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '存储涨价',
                    title: '高盛大幅上调存储芯片价格预测：2026年DRAM最高涨幅达280%，NAND最高涨250%',
                    source: '金融界 / TrendForce',
                    date: '2026-04-24',
                    summary: '高盛近日大幅上调DRAM与NAND Flash两类存储芯片的价格预测，预计2026年DRAM价格最高飙升280%，NAND价格最高上涨250%。TrendForce同步预估Q2 NAND Flash合约价环比增长70%-75%，DRAM合约价季增58%-63%。全球存储行业正进入一轮罕见的涨价超级周期，AI服务器存储需求预计增长300%。对联想SSC参考：高盛预测进一步确认存储成本持续攀升压力，Q2锁价窗口紧迫，企业级备件采购成本将继续承压。'
                },
                {
                    tag: 'NAND涨价',
                    title: '4月内第二波集中涨价：Q2 NAND闪存合约价预计环比增长70%-75%',
                    source: '199it / TrendForce',
                    date: '2026-04-27',
                    summary: '这是4月内存储大厂发起的第二波集中涨价，推动零售端价格达到历史高位。TrendForce集邦咨询预估，Q2 NAND Flash合约价将环比再增70%至75%。对联想SSC参考：企业级SSD备件采购成本Q2继续大幅上行，PCIe 5.0 NVMe SSD锁价窗口紧迫。'
                },
                {
                    tag: 'AMD份额',
                    title: 'AMD x86处理器市场份额达30%创历史新高，市值4541亿美元',
                    source: '新浪财经',
                    date: '2026-04-19',
                    summary: '当地时间4月16日，AMD股价冲上278美元，市值达4541.2亿美元，创下AMD 1969年成立半个多世纪以来最高纪录。AMD x86处理器已占据30%的历史新高市场份额。对联想SSC参考：AMD份额提升意味着PC处理器供应链多元化，ThinkPad AMD版本备件需求可能相应增加。'
                }
            ],
            ai: [
                {
                    tag: '英伟达新高',
                    title: '英伟达市值突破5.26万亿美元，AI算力驱动股价再创历史新高',
                    source: '腾讯科技 / CNMO',
                    date: '2026-04-28',
                    summary: '当地时间4月27日，英伟达股价收涨4%，报216.61美元，盘中触及216.83美元，双双刷新历史纪录，公司总市值突破5.26万亿美元。这是英伟达自2025年10月后，时隔约6个月再度站上5万亿美元市值台阶，稳居全球上市公司市值榜首。对联想SSC参考：英伟达市值强劲表明AI算力需求持续爆发，GPU供应链景气延续。'
                },
                {
                    tag: '费城半导体',
                    title: '费城半导体指数连续18个交易日上涨，A股半导体板块全线爆发',
                    source: '华尔街见闻 / 同花顺',
                    date: '2026-04-27',
                    summary: '费城半导体指数收涨4.32%，创纪录连涨18日。4月27日A股半导体板块全线爆发，帝奥微涨超19%，富瀚微涨超13%，派瑞股份、东芯股份涨超11%。对联想SSC参考：半导体行业景气持续，PC核心零部件供应链稳定。'
                }
            ],
            lenovo: [
                {
                    tag: '联想新品',
                    title: '联想来酷AI MINI高性能迷你主机正式开售，4499元起',
                    source: '快科技 / 联想官方',
                    date: '2026-04-28',
                    summary: '联想来酷AI MINI高性能迷你主机4月28日正式开售，主打小巧体积和AI性能，4499元起，支持一键部署OpenClaw。该产品搭载AMD/Intel平台，主打AI办公场景。对联想SSC参考：来酷新品上线意味着备件SKU矩阵扩大，需关注新品备件认证和库存备货节奏。'
                },
                {
                    tag: 'Intel变动',
                    title: '英特尔迎来新掌门陈立武，政府入股+新战略转型',
                    source: '新浪财经 / 半导体分析',
                    date: '2026-04-27',
                    summary: '英特尔迎来新掌门陈立武(Lip-Bu Tan)，并获得美国政府入股支持。新管理层面临重建信任与业绩的双重挑战。帕特·基辛格时期启动的扭转计划未能有效执行，英特尔近期股价飙升，市场预期新战略方向将在Q2明朗化。对联想SSC参考：Intel管理层变动可能影响处理器供货节奏和定价策略，关注Q2新品规划变动。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-28', label: '2026-04-28（今日）'},
            {date: '2026-04-27', label: '2026-04-27'},
            {date: '2026-04-20', label: '2026-04-20'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
