<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - PC行业早报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header .date {
            font-size: 16px;
            opacity: 0.9;
        }

        .header .update-time {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .news-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .news-item h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #212529;
        }

        .news-item .meta {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .news-item .summary {
            font-size: 15px;
            color: #495057;
            line-height: 1.6;
        }

        .news-item .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .price-item .name {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 5px;
        }

        .price-item .price {
            font-size: 28px;
            font-weight: 700;
            color: #e65100;
        }

        .price-item .change {
            font-size: 16px;
            margin-left: 10px;
        }

        .price-item .change.up {
            color: #dc3545;
        }

        .price-item .change.down {
            color: #28a745;
        }

        .price-item .date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .history-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .history-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #212529;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .history-link {
            display: block;
            padding: 12px 16px;
            background: white;
            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #dee2e6;
        }

        .history-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .history-list {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 PC行业早报</h1>
            <div class="date" id="currentDate"></div>
            <div class="update-time" id="updateTime"></div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">📈 价格快讯</div>
                <div id="priceSection"></div>
            </div>

            <div class="section">
                <div class="section-title">🔥 行业动态</div>
                <div id="newsSection"></div>
            </div>

            <div class="section">
                <div class="section-title">💡 AI工具前沿</div>
                <div id="aiSection"></div>
            </div>

            <div class="section">
                <div class="section-title">📊 联想动态</div>
                <div id="lenovoSection"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 历史记录</div>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="footer">
            <p>© 2026 Daily Digest - PC行业早报 | 每日更新</p>
        </div>
    </div>

    <script>
        // 设置日期（硬编码，禁止使用new Date()）
        document.getElementById('currentDate').textContent = '2026年4月20日星期一';
        document.getElementById('updateTime').textContent = '更新时间：2026/4/20 10:00';

        // 价格数据
        const priceData = {
            ddr5: {
                name: 'DDR5 UDIMM 16GB 模组（全球现货均价）',
                price: 512.00,
                change: 7,
                trend: 'up',
                date: '2026-04-20',
                unit: '¥'
            },
            ssd: {
                name: '1TB SSD（企业级）',
                price: 848,
                change: 13,
                trend: 'up',
                date: '2026-04-20',
                unit: '¥'
            },
            lenovo: {
                name: '联想集团 (00992.HK)',
                price: 11.30,
                change: 1.8,
                trend: 'up',
                date: '2026-04-17',
                unit: 'HK$'
            }
        };

        // 渲染价格
        const priceSection = document.getElementById('priceSection');
        priceSection.innerHTML = `
            <div class="price-item">
                <div class="name">${priceData.ddr5.name}</div>
                <div class="price">${priceData.ddr5.unit}${priceData.ddr5.price} <span class="change ${priceData.ddr5.trend}">${priceData.ddr5.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ddr5.change)}</span></div>
                <div class="date">数据日期：${priceData.ddr5.date} | 五大PC厂商集体提价，存储成本传导加速</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.ssd.name}</div>
                <div class="price">${priceData.ssd.unit}${priceData.ssd.price} <span class="change ${priceData.ssd.trend}">${priceData.ssd.trend === 'up' ? '↑' : '↓'} ¥${Math.abs(priceData.ssd.change)}</span></div>
                <div class="date">数据日期：${priceData.ssd.date} | SOCAMM2量产加速AI存储需求，NAND续涨</div>
            </div>
            <div class="price-item">
                <div class="name">${priceData.lenovo.name}</div>
                <div class="price">${priceData.lenovo.unit}${priceData.lenovo.price} <span class="change ${priceData.lenovo.trend}">${priceData.lenovo.trend === 'up' ? '↑' : '↓'} ${Math.abs(priceData.lenovo.change)}%</span></div>
                <div class="date">收盘日期：${priceData.lenovo.date} | 港股收盘HK$11.30，涨1.8%，4月以来累涨约12%</div>
            </div>
        `;

        // 新闻数据
        const newsData = {
            industry: [
                {
                    tag: '集体提价',
                    title: '五大PC厂商同步提价，笔记本最高涨幅超20%',
                    source: '中关村在线ZOL / 腾讯科技',
                    date: '2026-04-16',
                    summary: '联想、惠普、戴尔、华硕、宏碁五大全球PC制造商于4月16日同步启动提价，部分笔记本型号单日涨幅超过20%，"一份下午发出的报价单，到晚上就被上游供应商通知作废"成为真实写照。背后推手是DDR5和NAND持续涨价叠加企业盈利压力。对联想SSC参考：整机提价是备件成本传导至终端的明确信号，全年备件cost target需结合涨价幅度重新测算，建议财务团队本周完成全年预算修订。'
                },
                {
                    tag: '存储涨价',
                    title: '全链条半导体涨价蔓延，部分品类已超100%',
                    source: '21世纪经济报道',
                    date: '2026-04-10',
                    summary: '2026年以来，半导体涨价从存储（DDR5/NAND/HBM）延伸至模拟芯片、功率器件、晶圆代工和封测，形成全链条涨价格局，数十家厂商密集调价，部分品类涨幅超100%。AI服务器需求爆发与原厂产能向高利润品类倾斜是核心驱动力。对联想SSC参考：需系统梳理备件BOM中各类半导体器件，识别高风险品类，对非存储类备件（功率器件、模拟芯片等）同步实施涨价监控，避免盲区。'
                },
                {
                    tag: '供应链预警',
                    title: 'SK海力士量产192GB SOCAMM2，AI存储需求进一步收紧供给',
                    source: 'SK海力士官方 / EET电子工程专辑',
                    date: '2026-04-20',
                    summary: 'SK海力士今日正式量产基于1c LPDDR5X的192GB SOCAMM2，面向英伟达Vera Rubin AI服务器平台，宣称建立AI服务器存储性能新基准。SOCAMM2竞争已超越HBM4成为2026年最热存储赛道，三星、美光同步跟进。对联想SSC参考：AI基础设施对高端内存的强力吸引将持续抬高DRAM价格预期，PC端DDR5备件供给将因高端产品线优先分配而承压，Q2-Q3采购窗口需提早行动。'
                }
            ],
            ai: [
                {
                    tag: 'AI服务器',
                    title: 'SOCAMM2热度超越HBM4，成AI服务器存储新赛点',
                    source: 'OFweek电子工程',
                    date: '2026-04-18',
                    summary: '进入2026年，SOCAMM2的升温速度远超HBM4，成为AI服务器存储赛道竞争最激烈的领域。SK海力士今日量产、三星和美光同步推进，英伟达Rubin平台预计是最大需求方。SOCAMM2采用LPDDR5X架构，具备比HBM更低功耗和更高集成度的优势。AI PC和AI服务器之间的存储技术路线分歧正在加大，PC端和服务器端备件规划策略需相互解耦。'
                },
                {
                    tag: 'AI PC趋势',
                    title: 'ThinkPad天禧AI发布在即，AI PC战略进入关键节点',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-07',
                    summary: '4月22日ThinkPad 2026新品暨天禧AI生态发布会距今仅剩2天，将推出搭载天禧AI生态的全新一代AI PC产品线，涵盖X1 Carbon Gen 13、X9-15p、X14及E/T/P系列。天禧AI整合端云一体AI能力，是联想AI战略的重要里程碑。对联想SSC备件规划启示：天禧AI PC将引入新硬件规格（高算力NPU、大容量LPDDR5X内存、大容量PCIe 5.0 SSD），发布会后需48小时内启动新机型备件认证流程，避免因备件断货影响保修兑现。'
                }
            ],
            lenovo: [
                {
                    tag: '新品发布',
                    title: '倒计时2天！ThinkPad 2026+天禧AI生态即将正式亮相',
                    source: 'IT之家 / 联想官方',
                    date: '2026-04-07',
                    summary: '联想ThinkPad 2026新品暨天禧AI生态发布活动定于4月22日举行，主题"我·即我们"。X1 Carbon Gen 13、X9-15p、X14三款旗舰型号预约权益已上架，E系列、T系列、P系列新品可能同期发布。这是联想年度最重要的PC产品发布节点。对SSC建议：发布会72小时内须完成以下准备：①获取新机型BOM，②识别关键备件变更，③启动优先备件的采购锁价，④评估现有库存的型号兼容性。'
                },
                {
                    tag: '涨价应对',
                    title: '【SSC内部参考】五大厂商集体提价下的成本应对策略（4月20日）',
                    source: '联想SSC成本团队',
                    date: '2026-04-20',
                    summary: '基于五大PC厂商集体提价及SK海力士SOCAMM2量产的综合评估：1）存储涨价已从上游全面传导至终端，PC备件成本同步承压；2）ThinkPad发布会在即，新机型备件规格尚未披露，需预留应急采购资金；3）DDR5现货¥512（+¥7）、企业级SSD ¥848（+¥13），周涨幅均超1%；4）AI服务器SOCAMM2量产将进一步压缩PC端内存原厂产能分配；5）建议本周内完成Q3备件采购计划修订，优先锁定DDR5/NAND关键SKU。'
                },
                {
                    tag: '市场地位',
                    title: 'IDC Q1数据：联想市占25.2%领跑，涨价潮考验Q2出货',
                    source: 'IDC / 每经网',
                    date: '2026-04-16',
                    summary: 'IDC数据显示2026年Q1全球PC出货约6560万台，联想以25.2%市占继续领跑。但五大厂商集体提价事件将影响Q2消费者购买意愿，TrendForce已下调全年PC出货预期。对联想SSC参考：市占领先带来规模采购议价优势，但出货量下修意味着部分现有备件库存可能产生滞销风险，需结合新机型发布节奏动态调整库存策略。'
                }
            ]
        };

        // 渲染新闻
        function renderNews(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="news-item">
                    <span class="tag">${item.tag}</span>
                    <h3>${item.title}</h3>
                    <div class="meta">来源：${item.source} | ${item.date}</div>
                    <div class="summary">${item.summary}</div>
                </div>
            `).join('');
        }

        renderNews(newsData.industry, 'newsSection');
        renderNews(newsData.ai, 'aiSection');
        renderNews(newsData.lenovo, 'lenovoSection');

        // 历史记录数据
        const historyDates = [
            {date: '2026-04-20', label: '2026-04-20（今日）'},
            {date: '2026-04-18', label: '2026-04-18'},
            {date: '2026-04-17', label: '2026-04-17'},
            {date: '2026-04-16', label: '2026-04-16'},
            {date: '2026-04-15', label: '2026-04-15'},
            {date: '2026-04-14', label: '2026-04-14'},
            {date: '2026-04-13', label: '2026-04-13'},
            {date: '2026-04-11', label: '2026-04-11'},
            {date: '2026-04-10', label: '2026-04-10'},
        ];

        // 动态生成历史记录链接
        const historyList = document.getElementById('historyList');
        historyDates.forEach(item => {
            const link = document.createElement('a');
            link.href = `news/${item.date}.html`;
            link.className = 'history-link';
            link.textContent = item.label;
            historyList.appendChild(link);
        });
    </script>
</body>
</html>
